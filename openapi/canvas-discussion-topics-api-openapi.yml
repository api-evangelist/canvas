openapi: 3.2.0
info:
  title: Canvas LMS REST Discussion Topics API
  version: v1
  summary: The complete Canvas LMS REST API, converted from the Swagger 1.2 documents Instructure publishes under https://canvas.instructure.com/doc/api/.
  description: The Canvas LMS REST API covers courses, assignments, quizzes, grades, users, enrollments, accounts, files, modules, rubrics, submissions, SIS imports, LTI, analytics and account administration.
  contact:
    name: Instructure Canvas
    url: https://canvas.instructure.com/doc/api/
  license:
    name: AGPL-3.0
    url: https://github.com/instructure/canvas-lms/blob/master/LICENSE
servers:
- url: https://canvas.instructure.com/api
  description: Instructure-hosted Canvas (canvas.instructure.com)
- url: https://{canvas_host}/api
  description: Any Canvas instance; Canvas is multi-tenant and self-hostable, so the host is the institution's Canvas domain.
  variables:
    canvas_host:
      default: canvas.instructure.com
      description: Your institution's Canvas hostname, e.g. school.instructure.com
security:
- bearerAuth: []
- oauth2: []
tags:
- name: Discussion Topics
  x-resource: discussion_topics
  externalDocs:
    url: https://canvas.instructure.com/doc/api/discussion_topics.html
paths:
  /v1/courses/{course_id}/discussion_topics:
    get:
      tags:
      - Discussion Topics
      operationId: list_discussion_topics_courses
      summary: List discussion topics
      description: Returns the paginated list of discussion topics for this course or group.
      parameters:
      - name: course_id
        in: path
        schema:
          type: string
        required: true
        description: ID
      - name: include
        in: query
        schema:
          type: array
          items:
            type: string
            enum:
            - all_dates
            - sections
            - sections_user_count
            - overrides
        required: false
        description: "If \"all_dates\" is passed, all dates associated with graded discussions'\nassignments will be included.\nif \"sections\" is passed, includes the course sections that are associated\nwith the topic, if the topic is specific to certain sections of the course.\nIf \"sections_user_count\" is passed, then:\n  (a) If sections were asked for *and* the topic is specific to certain\n      course sections, includes the number of users in each\n      section. (as part of the section json asked for above)\n  (b) Else, includes at the root level the total number of users in the\n      topic's context (group or course) that the topic applies to.\nIf \"overrides\" is passed, the overrides for the assignment will be included"
      - name: order_by
        in: query
        schema:
          type: string
          enum:
          - position
          - recent_activity
          - title
        required: false
        description: Determines the order of the discussion topic list. Defaults to "position".
      - name: scope
        in: query
        schema:
          type: string
          enum:
          - locked
          - unlocked
          - pinned
          - unpinned
        required: false
        description: 'Only return discussion topics in the given state(s). Defaults to including

          all topics. Filtering is done after pagination, so pages

          may be smaller than requested if topics are filtered.

          Can pass multiple states as comma separated string.'
      - name: only_announcements
        in: query
        schema:
          type: boolean
        required: false
        description: Return announcements instead of discussion topics. Defaults to false
      - name: filter_by
        in: query
        schema:
          type: string
          enum:
          - all
          - unread
        required: false
        description: The state of the discussion topic to return. Currently only supports unread state.
      - name: search_term
        in: query
        schema:
          type: string
        required: false
        description: The partial title of the discussion topics to match and return.
      - name: exclude_context_module_locked_topics
        in: query
        schema:
          type: boolean
        required: false
        description: 'For students, exclude topics that are locked by module progression.

          Defaults to false.'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DiscussionTopic'
      externalDocs:
        url: https://canvas.instructure.com/doc/api/discussion_topics.html
    post:
      tags:
      - Discussion Topics
      operationId: create_new_discussion_topic_courses
      summary: Create a new discussion topic
      description: Create an new discussion topic for the course or group.
      parameters:
      - name: course_id
        in: path
        schema:
          type: string
        required: true
        description: ID
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  description: no description
                message:
                  type: string
                  description: no description
                discussion_type:
                  type: string
                  enum:
                  - side_comment
                  - threaded
                  - not_threaded
                  description: The type of discussion. Defaults to side_comment or not_threaded if not value is given. Accepted values are 'side_comment', 'not_threaded' for discussions that only allow one level of nested comments, and 'threaded' for fully threaded discussions.
                published:
                  type: boolean
                  description: 'Whether this topic is published (true) or draft state (false). Only

                    teachers and TAs have the ability to create draft state topics.'
                delayed_post_at:
                  type: string
                  format: date-time
                  description: If a timestamp is given, the topic will not be published until that time.
                allow_rating:
                  type: boolean
                  description: Whether or not users can rate entries in this topic.
                lock_at:
                  type: string
                  format: date-time
                  description: 'If a timestamp is given, the topic will be scheduled to lock at the

                    provided timestamp. If the timestamp is in the past, the topic will be

                    locked.'
                podcast_enabled:
                  type: boolean
                  description: If true, the topic will have an associated podcast feed.
                podcast_has_student_posts:
                  type: boolean
                  description: 'If true, the podcast will include posts from students as well. Implies

                    podcast_enabled.'
                require_initial_post:
                  type: boolean
                  description: 'If true then a user may not respond to other replies until that user has

                    made an initial reply. Defaults to false.'
                assignment:
                  type: string
                  x-canvas-declared-type: Assignment
                  description: 'To create an assignment discussion, pass the assignment parameters as a

                    sub-object. See the {api:AssignmentsApiController#create Create an Assignment API}

                    for the available parameters. The name parameter will be ignored, as it''s

                    taken from the discussion title. If you want to make a discussion that was

                    an assignment NOT an assignment, pass set_assignment = false as part of

                    the assignment object'
                is_announcement:
                  type: boolean
                  description: 'If true, this topic is an announcement. It will appear in the

                    announcement''s section rather than the discussions section. This requires

                    announcment-posting permissions.'
                pinned:
                  type: boolean
                  description: If true, this topic will be listed in the "Pinned Discussion" section
                position_after:
                  type: string
                  description: 'By default, discussions are sorted chronologically by creation date, you

                    can pass the id of another topic to have this one show up after the other

                    when they are listed.'
                group_category_id:
                  type: integer
                  format: int64
                  description: 'If present, the topic will become a group discussion assigned

                    to the group.'
                only_graders_can_rate:
                  type: boolean
                  description: If true, only graders will be allowed to rate entries.
                sort_order:
                  type: string
                  enum:
                  - asc
                  - desc
                  description: Default sort order of the discussion. Accepted values are "asc", "desc".
                sort_order_locked:
                  type: boolean
                  description: If true, users cannot choose their prefered sort order
                expanded:
                  type: boolean
                  description: If true, thread will be expanded by default
                expanded_locked:
                  type: boolean
                  description: If true, users cannot choose their prefered thread expansion setting
                sort_by_rating:
                  type: boolean
                  description: (DEPRECATED) If true, entries will be sorted by rating.
                attachment:
                  type: string
                  format: binary
                  description: 'A multipart/form-data form-field-style attachment.

                    Attachments larger than 1 kilobyte are subject to quota restrictions.'
                specific_sections:
                  type: string
                  description: 'A comma-separated list of sections ids to which the discussion topic

                    should be made specific to.  If it is not desired to make the discussion

                    topic specific to sections, then this parameter may be omitted or set to

                    "all".  Can only be present only on announcements and only those that are

                    for a course (as opposed to a group).'
                lock_comment:
                  type: boolean
                  description: If is_announcement and lock_comment are true, ‘Allow Participants to Comment’ setting is disabled.
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                title:
                  type: string
                  description: no description
                message:
                  type: string
                  description: no description
                discussion_type:
                  type: string
                  enum:
                  - side_comment
                  - threaded
                  - not_threaded
                  description: The type of discussion. Defaults to side_comment or not_threaded if not value is given. Accepted values are 'side_comment', 'not_threaded' for discussions that only allow one level of nested comments, and 'threaded' for fully threaded discussions.
                published:
                  type: boolean
                  description: 'Whether this topic is published (true) or draft state (false). Only

                    teachers and TAs have the ability to create draft state topics.'
                delayed_post_at:
                  type: string
                  format: date-time
                  description: If a timestamp is given, the topic will not be published until that time.
                allow_rating:
                  type: boolean
                  description: Whether or not users can rate entries in this topic.
                lock_at:
                  type: string
                  format: date-time
                  description: 'If a timestamp is given, the topic will be scheduled to lock at the

                    provided timestamp. If the timestamp is in the past, the topic will be

                    locked.'
                podcast_enabled:
                  type: boolean
                  description: If true, the topic will have an associated podcast feed.
                podcast_has_student_posts:
                  type: boolean
                  description: 'If true, the podcast will include posts from students as well. Implies

                    podcast_enabled.'
                require_initial_post:
                  type: boolean
                  description: 'If true then a user may not respond to other replies until that user has

                    made an initial reply. Defaults to false.'
                assignment:
                  type: string
                  x-canvas-declared-type: Assignment
                  description: 'To create an assignment discussion, pass the assignment parameters as a

                    sub-object. See the {api:AssignmentsApiController#create Create an Assignment API}

                    for the available parameters. The name parameter will be ignored, as it''s

                    taken from the discussion title. If you want to make a discussion that was

                    an assignment NOT an assignment, pass set_assignment = false as part of

                    the assignment object'
                is_announcement:
                  type: boolean
                  description: 'If true, this topic is an announcement. It will appear in the

                    announcement''s section rather than the discussions section. This requires

                    announcment-posting permissions.'
                pinned:
                  type: boolean
                  description: If true, this topic will be listed in the "Pinned Discussion" section
                position_after:
                  type: string
                  description: 'By default, discussions are sorted chronologically by creation date, you

                    can pass the id of another topic to have this one show up after the other

                    when they are listed.'
                group_category_id:
                  type: integer
                  format: int64
                  description: 'If present, the topic will become a group discussion assigned

                    to the group.'
                only_graders_can_rate:
                  type: boolean
                  description: If true, only graders will be allowed to rate entries.
                sort_order:
                  type: string
                  enum:
                  - asc
                  - desc
                  description: Default sort order of the discussion. Accepted values are "asc", "desc".
                sort_order_locked:
                  type: boolean
                  description: If true, users cannot choose their prefered sort order
                expanded:
                  type: boolean
                  description: If true, thread will be expanded by default
                expanded_locked:
                  type: boolean
                  description: If true, users cannot choose their prefered thread expansion setting
                sort_by_rating:
                  type: boolean
                  description: (DEPRECATED) If true, entries will be sorted by rating.
                attachment:
                  type: string
                  format: binary
                  description: 'A multipart/form-data form-field-style attachment.

                    Attachments larger than 1 kilobyte are subject to quota restrictions.'
                specific_sections:
                  type: string
                  description: 'A comma-separated list of sections ids to which the discussion topic

                    should be made specific to.  If it is not desired to make the discussion

                    topic specific to sections, then this parameter may be omitted or set to

                    "all".  Can only be present only on announcements and only those that are

                    for a course (as opposed to a group).'
                lock_comment:
                  type: boolean
                  description: If is_announcement and lock_comment are true, ‘Allow Participants to Comment’ setting is disabled.
      responses:
        '200':
          description: Success, no content returned
      externalDocs:
        url: https://canvas.instructure.com/doc/api/discussion_topics.html
