openapi: 3.2.0
info:
  title: Canvas LMS REST Quiz Questions API
  version: v1
  summary: The complete Canvas LMS REST API, converted from the Swagger 1.2 documents Instructure publishes under https://canvas.instructure.com/doc/api/.
  description: The Canvas LMS REST API covers courses, assignments, quizzes, grades, users, enrollments, accounts, files, modules, rubrics, submissions, SIS imports, LTI, analytics and account administration.
  contact:
    name: Instructure Canvas
    url: https://canvas.instructure.com/doc/api/
  license:
    name: AGPL-3.0
    url: https://github.com/instructure/canvas-lms/blob/master/LICENSE
servers:
- url: https://canvas.instructure.com/api
  description: Instructure-hosted Canvas (canvas.instructure.com)
- url: https://{canvas_host}/api
  description: Any Canvas instance; Canvas is multi-tenant and self-hostable, so the host is the institution's Canvas domain.
  variables:
    canvas_host:
      default: canvas.instructure.com
      description: Your institution's Canvas hostname, e.g. school.instructure.com
security:
- bearerAuth: []
- oauth2: []
tags:
- name: Quiz Questions
  x-resource: quiz_questions
  externalDocs:
    url: https://canvas.instructure.com/doc/api/quiz_questions.html
paths:
  /v1/courses/{course_id}/quizzes/{quiz_id}/questions:
    get:
      tags:
      - Quiz Questions
      operationId: list_questions_in_quiz_or_submission
      summary: List questions in a quiz or a submission
      description: Returns the paginated list of QuizQuestions in this quiz.
      parameters:
      - name: course_id
        in: path
        schema:
          type: string
        required: true
        description: ID
      - name: quiz_id
        in: path
        schema:
          type: string
        required: true
        description: ID
      - name: quiz_submission_id
        in: query
        schema:
          type: integer
          format: int64
        required: false
        description: 'If specified, the endpoint will return the questions that were presented

          for that submission. This is useful if the quiz has been modified after

          the submission was created and the latest quiz version''s set of questions

          does not match the submission''s.

          NOTE: you must specify quiz_submission_attempt as well if you specify this

          parameter.'
      - name: quiz_submission_attempt
        in: query
        schema:
          type: integer
          format: int64
        required: false
        description: The attempt of the submission you want the questions for.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/QuizQuestion'
      externalDocs:
        url: https://canvas.instructure.com/doc/api/quiz_questions.html
    post:
      tags:
      - Quiz Questions
      operationId: create_single_quiz_question
      summary: Create a single quiz question
      description: Create a new quiz question for this quiz
      parameters:
      - name: course_id
        in: path
        schema:
          type: string
        required: true
        description: ID
      - name: quiz_id
        in: path
        schema:
          type: string
        required: true
        description: ID
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                question[question_name]:
                  type: string
                  description: The name of the question.
                question[question_text]:
                  type: string
                  description: The text of the question.
                question[quiz_group_id]:
                  type: integer
                  format: int64
                  description: The id of the quiz group to assign the question to.
                question[question_type]:
                  type: string
                  enum:
                  - calculated_question
                  - essay_question
                  - file_upload_question
                  - fill_in_multiple_blanks_question
                  - matching_question
                  - multiple_answers_question
                  - multiple_choice_question
                  - multiple_dropdowns_question
                  - numerical_question
                  - short_answer_question
                  - text_only_question
                  - true_false_question
                  description: The type of question. Multiple optional fields depend upon the type of question to be used.
                question[position]:
                  type: integer
                  format: int64
                  description: The order in which the question will be displayed in the quiz in relation to other questions.
                question[points_possible]:
                  type: integer
                  format: int64
                  description: The maximum amount of points received for answering this question correctly.
                question[correct_comments]:
                  type: string
                  description: The comment to display if the student answers the question correctly.
                question[incorrect_comments]:
                  type: string
                  description: The comment to display if the student answers incorrectly.
                question[neutral_comments]:
                  type: string
                  description: The comment to display regardless of how the student answered.
                question[text_after_answers]:
                  type: string
                  description: no description
                question[answers]:
                  type: array
                  items:
                    $ref: '#/components/schemas/Answer'
                  description: no description
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                question[question_name]:
                  type: string
                  description: The name of the question.
                question[question_text]:
                  type: string
                  description: The text of the question.
                question[quiz_group_id]:
                  type: integer
                  format: int64
