                  type: string
                  description: no description
                question[answers]:
                  type: array
                  items:
                    $ref: '#/components/schemas/Answer'
                  description: no description
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizQuestion'
      externalDocs:
        url: https://canvas.instructure.com/doc/api/quiz_questions.html
