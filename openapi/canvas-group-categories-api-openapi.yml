          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupCategory'
      externalDocs:
        url: https://canvas.instructure.com/doc/api/group_categories.html
    delete:
      tags:
      - Group Categories
      operationId: delete_group_category
      summary: Delete a Group Category
      description: 'Deletes a group category and all groups under it. Protected group

        categories can not be deleted, i.e. "communities" and "student_organized".'
      parameters:
      - name: group_category_id
        in: path
        schema:
          type: string
        required: true
        description: ID
      responses:
        '200':
          description: Success, no content returned
      externalDocs:
        url: https://canvas.instructure.com/doc/api/group_categories.html
  /v1/courses/{course_id}/group_categories/bulk_manage_differentiation_tag:
    post:
      tags:
      - Group Categories
      operationId: bulk_manage_differentiation_tags
      summary: Bulk manage differentiation tags
      description: 'This API is only meant for Groups and GroupCategories where non_collaborative is true.


        Perform bulk operations on groups within a group category, or create a new group category

        along with the groups in one transaction. If creation of the GroupCategory or any Group fails, the entire operation will be rolled back.'
      parameters:
      - name: course_id
        in: path
        schema:
          type: string
        required: true
        description: ID
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                operations:
                  type: object
                  additionalProperties: true
                  description: "A hash containing arrays of create/update/delete operations:\n{\n  \"create\": [\n    { \"name\": \"New Group A\" },\n    { \"name\": \"New Group B\" }\n  ],\n  \"update\": [\n    { \"id\": 123, \"name\": \"Updated Group Name A\" },\n    { \"id\": 456, \"name\": \"Updated Group Name B\" }\n  ],\n  \"delete\": [\n    { \"id\": 789 },\n    { \"id\": 101 }\n  ]\n}"
                group_category:
                  type: object
                  additionalProperties: true
                  description: "Attributes for the GroupCategory. May include:\n  - id [Optional, Integer]: The ID of an existing GroupCategory.\n  - name [Optional, String]: A new name for the GroupCategory. If provided with an ID, the category name will be updated."
              required:
              - operations
              - group_category
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                operations:
                  type: object
                  additionalProperties: true
                  description: "A hash containing arrays of create/update/delete operations:\n{\n  \"create\": [\n    { \"name\": \"New Group A\" },\n    { \"name\": \"New Group B\" }\n  ],\n  \"update\": [\n    { \"id\": 123, \"name\": \"Updated Group Name A\" },\n    { \"id\": 456, \"name\": \"Updated Group Name B\" }\n  ],\n  \"delete\": [\n    { \"id\": 789 },\n    { \"id\": 101 }\n  ]\n}"
                group_category:
                  type: object
                  additionalProperties: true
                  description: "Attributes for the GroupCategory. May include:\n  - id [Optional, Integer]: The ID of an existing GroupCategory.\n  - name [Optional, String]: A new name for the GroupCategory. If provided with an ID, the category name will be updated."
              required:
              - operations
              - group_category
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: string
                x-canvas-declared-type: GroupCategory and groups operation results
      externalDocs:
        url: https://canvas.instructure.com/doc/api/group_categories.html
  /v1/courses/{course_id}/group_categories/differentiation_tag_candidate_count:
    get:
      tags:
      - Group Categories
      operationId: get_differentiation_tag_candidate_count
      summary: Get differentiation tag candidate count
      description: 'Returns the number of students in the course eligible for a

        differentiation tag bulk-membership action (see Create a membership''s

        `all_in_group_course` option), optionally narrowed by enrollment role

        and/or existing differentiation tag membership. The count only includes

        students visible to the calling user, so a section-limited teacher only

        sees students in their own sections.'
      parameters:
      - name: course_id
        in: path
        schema:
          type: string
        required: true
        description: ID
      - name: enrollment_role_id
        in: query
        schema:
          type: array
          items:
            type: integer
        required: false
        description: Only count students holding one of these enrollment role ids.
      - name: differentiation_tag_id
        in: query
        schema:
          type: array
          items:
            type: integer
        required: false
        description: Only count students who are members of one of these differentiation tags.
      - name: exclude_user_ids
        in: query
        schema:
          type: array
          items:
            type: integer
        required: false
        description: Exclude these user ids from the count.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: string
                x-canvas-declared-type: '{ "count": "integer" }'
      externalDocs:
        url: https://canvas.instructure.com/doc/api/group_categories.html
  /v1/courses/{course_id}/group_categories/import_tags:
    post:
      tags:
      - Group Categories
      operationId: import_differentiation_tags
      summary: Import differentiation tags
      description: 'Create Differentiation Tags through a CSV import


        For more information on the format that''s expected here, please see the

        "Differentiation Tag CSV" section in the API docs.'
      parameters:
      - name: course_id
        in: path
        schema:
          type: string
        required: true
        description: ID
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                attachment:
                  type: string
                  description: "There are two ways to post differentiation tag import data - either via a\nmultipart/form-data form-field-style attachment, or via a non-multipart\nraw post request.\n\n'attachment' is required for multipart/form-data style posts. Assumed to\nbe tag data from a file upload form field named 'attachment'.\n\nExamples:\n  curl -F attachment=@<filename> -H \"Authorization: Bearer <token>\" \\\n      'https://<canvas>/api/v1/group_categories/import_tags'\n\nIf you decide to do a raw post, you can skip the 'attachment' argument,\nbut you will then be required to provide a suitable Content-Type header.\nYou are encouraged to also provide the 'extension' argument.\n\nExamples:\n  curl -H 'Content-Type: text/csv' --data-binary @<filename>.csv \\\n      -H \"Authorization: Bearer <token>\" \\\n      'https://<canvas>/api/v1/group_categories_tags'"
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                attachment:
                  type: string
                  description: "There are two ways to post differentiation tag import data - either via a\nmultipart/form-data form-field-style attachment, or via a non-multipart\nraw post request.\n\n'attachment' is required for multipart/form-data style posts. Assumed to\nbe tag data from a file upload form field named 'attachment'.\n\nExamples:\n  curl -F attachment=@<filename> -H \"Authorization: Bearer <token>\" \\\n      'https://<canvas>/api/v1/group_categories/import_tags'\n\nIf you decide to do a raw post, you can skip the 'attachment' argument,\nbut you will then be required to provide a suitable Content-Type header.\nYou are encouraged to also provide the 'extension' argument.\n\nExamples:\n  curl -H 'Content-Type: text/csv' --data-binary @<filename>.csv \\\n      -H \"Authorization: Bearer <token>\" \\\n      'https://<canvas>/api/v1/group_categories_tags'"
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: string
                x-canvas-declared-type: Progress
      externalDocs:
        url: https://canvas.instructure.com/doc/api/group_categories.html
  /v1/group_categories/{group_category_id}/import:
    post:
      tags:
      - Group Categories
      operationId: import_category_groups
      summary: Import category groups
      description: 'Create Groups in a Group Category through a CSV import


        For more information on the format that''s expected here, please see the

        "Group Category CSV" section in the API docs.'
      parameters:
      - name: group_category_id
        in: path
        schema:
          type: string
        required: true
        description: ID
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                attachment:
                  type: string
                  description: "There are two ways to post group category import data - either via a\nmultipart/form-data form-field-style attachment, or via a non-multipart\nraw post request.\n\n'attachment' is required for multipart/form-data style posts. Assumed to\nbe outcome data from a file upload form field named 'attachment'.\n\nExamples:\n  curl -F attachment=@<filename> -H \"Authorization: Bearer <token>\" \\\n      'https://<canvas>/api/v1/group_categories/<category_id>/import'\n\nIf you decide to do a raw post, you can skip the 'attachment' argument,\nbut you will then be required to provide a suitable Content-Type header.\nYou are encouraged to also provide the 'extension' argument.\n\nExamples:\n  curl -H 'Content-Type: text/csv' --data-binary @<filename>.csv \\\n      -H \"Authorization: Bearer <token>\" \\\n      'https://<canvas>/api/v1/group_categories/<category_id>/import'"
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                attachment:
                  type: string
                  description: "There are two ways to post group category import data - either via a\nmultipart/form-data form-field-style attachment, or via a non-multipart\nraw post request.\n\n'attachment' is required for multipart/form-data style posts. Assumed to\nbe outcome data from a file upload form field named 'attachment'.\n\nExamples:\n  curl -F attachment=@<filename> -H \"Authorization: Bearer <token>\" \\\n      'https://<canvas>/api/v1/group_categories/<category_id>/import'\n\nIf you decide to do a raw post, you can skip the 'attachment' argument,\nbut you will then be required to provide a suitable Content-Type header.\nYou are encouraged to also provide the 'extension' argument.\n\nExamples:\n  curl -H 'Content-Type: text/csv' --data-binary @<filename>.csv \\\n      -H \"Authorization: Bearer <token>\" \\\n      'https://<canvas>/api/v1/group_categories/<category_id>/import'"
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: string
                x-canvas-declared-type: Progress
      externalDocs:
        url: https://canvas.instructure.com/doc/api/group_categories.html
  /v1/group_categories/{group_category_id}/groups:
    get:
      tags:
      - Group Categories
      operationId: list_groups_in_group_category
      summary: List groups in group category
      description: Returns a paginated list of groups in a group category
      parameters:
      - name: group_category_id
        in: path
        schema:
          type: string
        required: true
        description: ID
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
