openapi: 3.2.0
info:
  title: Canvas LMS REST Group Categories API
  version: v1
  summary: The complete Canvas LMS REST API, converted from the Swagger 1.2 documents Instructure publishes under https://canvas.instructure.com/doc/api/.
  description: The Canvas LMS REST API covers courses, assignments, quizzes, grades, users, enrollments, accounts, files, modules, rubrics, submissions, SIS imports, LTI, analytics and account administration.
  contact:
    name: Instructure Canvas
    url: https://canvas.instructure.com/doc/api/
  license:
    name: AGPL-3.0
    url: https://github.com/instructure/canvas-lms/blob/master/LICENSE
servers:
- url: https://canvas.instructure.com/api
  description: Instructure-hosted Canvas (canvas.instructure.com)
- url: https://{canvas_host}/api
  description: Any Canvas instance; Canvas is multi-tenant and self-hostable, so the host is the institution's Canvas domain.
  variables:
    canvas_host:
      default: canvas.instructure.com
      description: Your institution's Canvas hostname, e.g. school.instructure.com
security:
- bearerAuth: []
- oauth2: []
tags:
- name: Group Categories
  x-resource: group_categories
  externalDocs:
    url: https://canvas.instructure.com/doc/api/group_categories.html
paths:
  /v1/accounts/{account_id}/group_categories:
    get:
      tags:
      - Group Categories
      operationId: list_group_categories_for_context_accounts
      summary: List group categories for a context
      description: 'Returns a paginated list of group categories in a context. The list returned

        depends on the permissions of the current user and the specified collaboration state.'
      parameters:
      - name: account_id
        in: path
        schema:
          type: string
        required: true
        description: ID
      - name: collaboration_state
        in: query
        schema:
          type: string
        required: false
        description: 'Filter group categories by their collaboration state:

          - "all": Return both collaborative and non-collaborative group categories

          - "collaborative": Return only collaborative group categories (default)

          - "non_collaborative": Return only non-collaborative group categories'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GroupCategory'
      externalDocs:
        url: https://canvas.instructure.com/doc/api/group_categories.html
    post:
      tags:
      - Group Categories
      operationId: create_group_category_accounts
      summary: Create a Group Category
      description: Create a new group category
      parameters:
      - name: account_id
        in: path
        schema:
          type: string
        required: true
        description: ID
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Name of the group category
                non_collaborative:
                  type: boolean
                  description: 'Can only be set by users with the Differentiation Tag - Add permission


                    If set to true, groups in this category will be only be visible to users with the

                    Differentiation Tag - Manage permission.'
                self_signup:
                  type: string
                  enum:
                  - enabled
                  - restricted
                  description: "Allow students to sign up for a group themselves (Course Only).\nvalid values are:\n\"enabled\":: allows students to self sign up for any group in course\n\"restricted\":: allows students to self sign up only for groups in the\n               same section null disallows self sign up"
                auto_leader:
                  type: string
                  enum:
                  - first
                  - random
                  description: 'Assigns group leaders automatically when generating and allocating students to groups

                    Valid values are:

                    "first":: the first student to be allocated to a group is the leader

                    "random":: a random student from all members is chosen as the leader'
                group_limit:
                  type: integer
                  format: int64
                  description: 'Limit the maximum number of users in each group (Course Only). Requires

                    self signup.'
                sis_group_category_id:
                  type: string
                  description: The unique SIS identifier.
                create_group_count:
                  type: integer
                  format: int64
                  description: Create this number of groups (Course Only).
                split_group_count:
                  type: string
                  description: '(Deprecated)

                    Create this number of groups, and evenly distribute students

                    among them. not allowed with "enable_self_signup". because

                    the group assignment happens synchronously, it''s recommended

                    that you instead use the assign_unassigned_members endpoint.

                    (Course Only)'
              required:
              - name
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Name of the group category
                non_collaborative:
                  type: boolean
                  description: 'Can only be set by users with the Differentiation Tag - Add permission


                    If set to true, groups in this category will be only be visible to users with the

                    Differentiation Tag - Manage permission.'
                self_signup:
                  type: string
                  enum:
                  - enabled
                  - restricted
                  description: "Allow students to sign up for a group themselves (Course Only).\nvalid values are:\n\"enabled\":: allows students to self sign up for any group in course\n\"restricted\":: allows students to self sign up only for groups in the\n               same section null disallows self sign up"
                auto_leader:
                  type: string
                  enum:
                  - first
                  - random
                  description: 'Assigns group leaders automatically when generating and allocating students to groups

                    Valid values are:

                    "first":: the first student to be allocated to a group is the leader

                    "random":: a random student from all members is chosen as the leader'
                group_limit:
                  type: integer
                  format: int64
                  description: 'Limit the maximum number of users in each group (Course Only). Requires

                    self signup.'
                sis_group_category_id:
                  type: string
                  description: The unique SIS identifier.
                create_group_count:
                  type: integer
                  format: int64
                  description: Create this number of groups (Course Only).
                split_group_count:
                  type: string
                  description: '(Deprecated)

                    Create this number of groups, and evenly distribute students

                    among them. not allowed with "enable_self_signup". because

                    the group assignment happens synchronously, it''s recommended

                    that you instead use the assign_unassigned_members endpoint.

                    (Course Only)'
              required:
              - name
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupCategory'
      externalDocs:
        url: https://canvas.instructure.com/doc/api/group_categories.html
  /v1/courses/{course_id}/group_categories:
    get:
      tags:
      - Group Categories
      operationId: list_group_categories_for_context_courses
      summary: List group categories for a context
      description: 'Returns a paginated list of group categories in a context. The list returned

