                  $ref: '#/components/schemas/GroupCategory'
      externalDocs:
        url: https://canvas.instructure.com/doc/api/group_categories.html
    post:
      tags:
      - Group Categories
      operationId: create_group_category_courses
      summary: Create a Group Category
      description: Create a new group category
      parameters:
      - name: course_id
        in: path
        schema:
          type: string
        required: true
        description: ID
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Name of the group category
                non_collaborative:
                  type: boolean
                  description: 'Can only be set by users with the Differentiation Tag - Add permission


                    If set to true, groups in this category will be only be visible to users with the

                    Differentiation Tag - Manage permission.'
                self_signup:
                  type: string
                  enum:
                  - enabled
                  - restricted
                  description: "Allow students to sign up for a group themselves (Course Only).\nvalid values are:\n\"enabled\":: allows students to self sign up for any group in course\n\"restricted\":: allows students to self sign up only for groups in the\n               same section null disallows self sign up"
                auto_leader:
                  type: string
                  enum:
                  - first
                  - random
                  description: 'Assigns group leaders automatically when generating and allocating students to groups

                    Valid values are:

                    "first":: the first student to be allocated to a group is the leader

                    "random":: a random student from all members is chosen as the leader'
                group_limit:
                  type: integer
                  format: int64
                  description: 'Limit the maximum number of users in each group (Course Only). Requires

                    self signup.'
                sis_group_category_id:
                  type: string
                  description: The unique SIS identifier.
                create_group_count:
                  type: integer
                  format: int64
                  description: Create this number of groups (Course Only).
                split_group_count:
                  type: string
                  description: '(Deprecated)

                    Create this number of groups, and evenly distribute students

                    among them. not allowed with "enable_self_signup". because

                    the group assignment happens synchronously, it''s recommended

                    that you instead use the assign_unassigned_members endpoint.

                    (Course Only)'
              required:
              - name
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Name of the group category
                non_collaborative:
                  type: boolean
                  description: 'Can only be set by users with the Differentiation Tag - Add permission


                    If set to true, groups in this category will be only be visible to users with the

                    Differentiation Tag - Manage permission.'
                self_signup:
                  type: string
                  enum:
                  - enabled
                  - restricted
                  description: "Allow students to sign up for a group themselves (Course Only).\nvalid values are:\n\"enabled\":: allows students to self sign up for any group in course\n\"restricted\":: allows students to self sign up only for groups in the\n               same section null disallows self sign up"
                auto_leader:
                  type: string
                  enum:
                  - first
                  - random
                  description: 'Assigns group leaders automatically when generating and allocating students to groups

                    Valid values are:

                    "first":: the first student to be allocated to a group is the leader

                    "random":: a random student from all members is chosen as the leader'
                group_limit:
                  type: integer
                  format: int64
                  description: 'Limit the maximum number of users in each group (Course Only). Requires

                    self signup.'
                sis_group_category_id:
                  type: string
                  description: The unique SIS identifier.
                create_group_count:
                  type: integer
                  format: int64
                  description: Create this number of groups (Course Only).
                split_group_count:
                  type: string
                  description: '(Deprecated)

                    Create this number of groups, and evenly distribute students

                    among them. not allowed with "enable_self_signup". because

                    the group assignment happens synchronously, it''s recommended

                    that you instead use the assign_unassigned_members endpoint.

                    (Course Only)'
              required:
              - name
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupCategory'
      externalDocs:
        url: https://canvas.instructure.com/doc/api/group_categories.html
  /v1/group_categories/{group_category_id}:
    get:
      tags:
      - Group Categories
      operationId: get_single_group_category
      summary: Get a single group category
      description: 'Returns the data for a single group category, or a 401 if the caller doesn''t have

        the rights to see it.'
      parameters:
      - name: group_category_id
        in: path
        schema:
          type: string
        required: true
        description: ID
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupCategory'
      externalDocs:
        url: https://canvas.instructure.com/doc/api/group_categories.html
    put:
      tags:
      - Group Categories
      operationId: update_group_category
      summary: Update a Group Category
      description: Modifies an existing group category.
      parameters:
      - name: group_category_id
        in: path
        schema:
          type: string
        required: true
        description: ID
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Name of the group category
                self_signup:
                  type: string
                  enum:
                  - enabled
                  - restricted
                  description: "Allow students to sign up for a group themselves (Course Only).\nValid values are:\n\"enabled\":: allows students to self sign up for any group in course\n\"restricted\":: allows students to self sign up only for groups in the\n               same section null disallows self sign up"
                auto_leader:
                  type: string
                  enum:
                  - first
                  - random
                  description: 'Assigns group leaders automatically when generating and allocating students to groups

                    Valid values are:

                    "first":: the first student to be allocated to a group is the leader

                    "random":: a random student from all members is chosen as the leader'
                group_limit:
                  type: integer
                  format: int64
                  description: 'Limit the maximum number of users in each group (Course Only). Requires

                    self signup.'
                sis_group_category_id:
                  type: string
                  description: The unique SIS identifier.
                create_group_count:
                  type: integer
                  format: int64
                  description: Create this number of groups (Course Only).
                split_group_count:
                  type: string
                  description: '(Deprecated)

                    Create this number of groups, and evenly distribute students

                    among them. not allowed with "enable_self_signup". because

                    the group assignment happens synchronously, it''s recommended

                    that you instead use the assign_unassigned_members endpoint.

                    (Course Only)'
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Name of the group category
                self_signup:
                  type: string
                  enum:
                  - enabled
                  - restricted
                  description: "Allow students to sign up for a group themselves (Course Only).\nValid values are:\n\"enabled\":: allows students to self sign up for any group in course\n\"restricted\":: allows students to self sign up only for groups in the\n               same section null disallows self sign up"
                auto_leader:
                  type: string
                  enum:
                  - first
                  - random
                  description: 'Assigns group leaders automatically when generating and allocating students to groups

                    Valid values are:

                    "first":: the first student to be allocated to a group is the leader

                    "random":: a random student from all members is chosen as the leader'
                group_limit:
                  type: integer
                  format: int64
                  description: 'Limit the maximum number of users in each group (Course Only). Requires

                    self signup.'
                sis_group_category_id:
                  type: string
                  description: The unique SIS identifier.
                create_group_count:
                  type: integer
                  format: int64
                  description: Create this number of groups (Course Only).
