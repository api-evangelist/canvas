    url: https://github.com/instructure/canvas-lms/blob/master/LICENSE
servers:
- url: https://canvas.instructure.com/api
  description: Instructure-hosted Canvas (canvas.instructure.com)
- url: https://{canvas_host}/api
  description: Any Canvas instance; Canvas is multi-tenant and self-hostable, so the host is the institution's Canvas domain.
  variables:
    canvas_host:
      default: canvas.instructure.com
      description: Your institution's Canvas hostname, e.g. school.instructure.com
security:
- bearerAuth: []
- oauth2: []
tags:
- name: Course Pace
  x-resource: course_pace
  externalDocs:
    url: https://canvas.instructure.com/doc/api/course_pace.html
paths:
  /v1/courses/{course_id}/course_pacing/{id}:
    get:
      tags:
      - Course Pace
      operationId: show_course_pace
      summary: Show a Course pace
      description: Returns a course pace for the course and pace id provided
      parameters:
      - name: id
        in: path
        schema:
          type: string
        required: true
        description: ID
      - name: course_id
        in: path
        schema:
          type: integer
          format: int64
        required: true
        description: The id of the course
      - name: course_pace_id
        in: query
        schema:
          type: integer
          format: int64
        required: true
        description: The id of the course_pace
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoursePace'
      externalDocs:
        url: https://canvas.instructure.com/doc/api/course_pace.html
    put:
      tags:
      - Course Pace
      operationId: update_course_pace
      summary: Update a Course pace
      description: Returns the updated course pace
      parameters:
      - name: id
        in: path
        schema:
          type: string
        required: true
        description: ID
      - name: course_id
        in: path
        schema:
          type: integer
          format: int64
        required: true
        description: The id of the course
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                course_pace_id:
                  type: integer
                  format: int64
                  description: The id of the course pace
                end_date:
                  type: string
                  format: date-time
                  description: End date of the course pace
                exclude_weekends:
                  type: boolean
                  description: Course pace dates excludes weekends if true
                selected_days_to_skip:
                  type: string
                  description: '[Array<String>]

                    Course pace dates excludes weekends if true'
                hard_end_dates:
                  type: boolean
                  description: Course pace uess hard end dates if true
                workflow_state:
                  type: string
                  description: The state of the course pace
                course_pace_module_item_attributes:
                  type: array
                  items:
                    type: string
                  description: Module Items attributes
              required:
              - course_pace_id
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                course_pace_id:
                  type: integer
                  format: int64
                  description: The id of the course pace
                end_date:
                  type: string
                  format: date-time
                  description: End date of the course pace
                exclude_weekends:
                  type: boolean
                  description: Course pace dates excludes weekends if true
                selected_days_to_skip:
                  type: string
                  description: '[Array<String>]

                    Course pace dates excludes weekends if true'
                hard_end_dates:
                  type: boolean
                  description: Course pace uess hard end dates if true
                workflow_state:
                  type: string
                  description: The state of the course pace
                course_pace_module_item_attributes:
                  type: array
                  items:
                    type: string
                  description: Module Items attributes
              required:
              - course_pace_id
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoursePace'
      externalDocs:
        url: https://canvas.instructure.com/doc/api/course_pace.html
    delete:
      tags:
      - Course Pace
      operationId: delete_course_pace
      summary: Delete a Course pace
      description: Returns the updated course pace
      parameters:
      - name: id
        in: path
        schema:
          type: string
        required: true
        description: ID
      - name: course_id
        in: path
        schema:
          type: integer
          format: int64
        required: true
        description: The id of the course
      - name: course_pace_id
        in: query
        schema:
          type: integer
          format: int64
        required: true
        description: The id of the course_pace
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoursePace'
      externalDocs:
        url: https://canvas.instructure.com/doc/api/course_pace.html
  /v1/courses/{course_id}/course_pacing:
    post:
      tags:
      - Course Pace
      operationId: create_course_pace
      summary: Create a Course pace
      description: Creates a new course pace with specified parameters.
      parameters:
      - name: course_id
        in: path
        schema:
          type: integer
          format: int64
        required: true
        description: The id of the course
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                end_date:
                  type: string
                  format: date-time
                  description: End date of the course pace
                end_date_context:
                  type: string
                  description: End date context (course, section, hupothetical)
                start_date:
                  type: string
                  format: date-time
                  description: Start date of the course pace
                start_date_context:
                  type: string
                  description: Start date context (course, section, hupothetical)
                exclude_weekends:
                  type: boolean
                  description: Course pace dates excludes weekends if true
                selected_days_to_skip:
                  type: string
                  description: '[Array<String>]

                    Course pace dates excludes weekends if true'
                hard_end_dates:
                  type: boolean
                  description: Course pace uess hard end dates if true
                workflow_state:
                  type: string
                  description: The state of the course pace
                course_pace_module_item_attributes:
                  type: array
                  items:
                    type: string
                  description: Module Items attributes
                context_id:
                  type: integer
                  format: int64
                  description: Pace Context ID
                context_type:
                  type: string
                  description: Pace Context Type (Course, Section, User)
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                end_date:
                  type: string
                  format: date-time
                  description: End date of the course pace
                end_date_context:
                  type: string
                  description: End date context (course, section, hupothetical)
                start_date:
                  type: string
                  format: date-time
                  description: Start date of the course pace
                start_date_context:
                  type: string
                  description: Start date context (course, section, hupothetical)
                exclude_weekends:
                  type: boolean
                  description: Course pace dates excludes weekends if true
                selected_days_to_skip:
                  type: string
                  description: '[Array<String>]

                    Course pace dates excludes weekends if true'
                hard_end_dates:
                  type: boolean
                  description: Course pace uess hard end dates if true
                workflow_state:
                  type: string
                  description: The state of the course pace
                course_pace_module_item_attributes:
                  type: array
                  items:
                    type: string
                  description: Module Items attributes
                context_id:
                  type: integer
                  format: int64
                  description: Pace Context ID
                context_type:
                  type: string
                  description: Pace Context Type (Course, Section, User)
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoursePace'
