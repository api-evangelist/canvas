        url: https://canvas.instructure.com/doc/api/course_pace.html
components:
  schemas:
    CoursePace:
      type: object
      properties:
        id:
          type: integer
          example: 5
          description: the ID of the course pace
        course_id:
          type: integer
          example: 5
          description: the ID of the course
        user_id:
          type: integer
          example: 10
          description: the ID of the user for this course pace
        workflow_state:
          type: string
          example: active
          description: the state of the course pace
        exclude_weekends:
          type: boolean
          example: true
          description: boolean value depending on exclude weekends setting
        selected_days_to_skip:
          type: array
          items:
            type: integer
          example:
          - fri
          - sat
          description: array of strings representing the days of the work week
        hard_end_dates:
          type: boolean
          example: true
          description: set if the end date is set from course
        created_at:
          type: string
          format: date-time
          example: '2013-01-23T23:59:00-07:00'
          description: date when course pace is created
        end_date:
          type: string
          format: date-time
          example: '2013-01-23T23:59:00-07:00'
          description: course end date
        updated_at:
          type: string
          format: date-time
          example: '2013-01-23T23:59:00-07:00'
          description: date when course pace is updated
        published_at:
          type: string
          format: date-time
          example: '2013-01-23T23:59:00-07:00'
          description: date when course pace is published
        root_account_id:
          type: integer
          example: 10
          description: the root account ID for this course pace
        start_date:
          type: string
          format: date-time
          example: '2013-01-23T23:59:00-07:00'
          description: course start date
        modules:
          type: array
          items: {}
          description: list of modules and items for this course pace
        progress:
          type: string
          description: progress of pace publishing
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'Canvas OAuth2 access token sent as "Authorization: Bearer <token>". See https://canvas.instructure.com/doc/api/file.oauth.html'
    oauth2:
      type: oauth2
      description: Canvas OAuth2. See https://canvas.instructure.com/doc/api/file.oauth.html and https://canvas.instructure.com/doc/api/file.oauth_endpoints.html
      flows:
        authorizationCode:
          authorizationUrl: https://canvas.instructure.com/login/oauth2/auth
          tokenUrl: https://canvas.instructure.com/login/oauth2/token
          refreshUrl: https://canvas.instructure.com/login/oauth2/token
          scopes: {}
externalDocs:
  description: Canvas LMS REST API Documentation
  url: https://canvas.instructure.com/doc/api/
