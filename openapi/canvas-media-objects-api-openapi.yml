paths:
  /v1/media_objects/{media_object_id}/media_tracks:
    get:
      tags:
      - Media Objects
      operationId: list_media_tracks_for_media_object_or_attachment_media_objects
      summary: List media tracks for a Media Object or Attachment
      description: List the media tracks associated with a media object or attachment
      parameters:
      - name: media_object_id
        in: path
        schema:
          type: string
        required: true
        description: ID
      - name: include
        in: query
        schema:
          type: array
          items:
            type: string
            enum:
            - content
            - webvtt_content
            - updated_at
            - created_at
        required: false
        description: 'By default, index returns id, locale, kind, media_object_id, and user_id for each of the

          result MediaTracks. Use include[] to

          add additional fields. For example include[]=content'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MediaTrack'
      externalDocs:
        url: https://canvas.instructure.com/doc/api/media_objects.html
    put:
      tags:
      - Media Objects
      operationId: update_media_tracks_media_objects
      summary: Update Media Tracks
      description: 'Replace the media tracks associated with a media object or attachment with

        the array of tracks provided in the body.

        Update will

        delete any existing tracks not listed,

        leave untouched any tracks with no content field,

        and update or create tracks with a content field.'
      parameters:
      - name: media_object_id
        in: path
        schema:
          type: string
        required: true
        description: ID
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                include:
                  type: array
                  items:
                    type: string
                    enum:
                    - content
                    - webvtt_content
                    - updated_at
                    - created_at
                  description: 'By default, an update returns id, locale, kind, media_object_id, and user_id for each of the

                    result MediaTracks. Use include[] to

                    add additional fields. For example include[]=content'
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                include:
                  type: array
                  items:
                    type: string
                    enum:
                    - content
                    - webvtt_content
                    - updated_at
                    - created_at
                  description: 'By default, an update returns id, locale, kind, media_object_id, and user_id for each of the

                    result MediaTracks. Use include[] to

                    add additional fields. For example include[]=content'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MediaTrack'
      externalDocs:
        url: https://canvas.instructure.com/doc/api/media_objects.html
