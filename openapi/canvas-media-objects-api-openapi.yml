  /v1/media_objects:
    get:
      tags:
      - Media Objects
      operationId: list_media_objects_media_objects
      summary: List Media Objects
      description: 'Returns media objects created by the user making the request. When

        using the second version, returns media objects associated with

        the given course.'
      parameters:
      - name: sort
        in: query
        schema:
          type: string
          enum:
          - title
          - created_at
        required: false
        description: 'Field to sort on. Default is "title"


          title:: sorts on user_entered_title if available, title if not.


          created_at:: sorts on the object''s creation time.'
      - name: order
        in: query
        schema:
          type: string
          enum:
          - asc
          - desc
        required: false
        description: Sort direction. Default is "asc"
      - name: exclude
        in: query
        schema:
          type: array
          items:
            type: string
            enum:
            - sources
            - tracks
        required: false
        description: 'Array of data to exclude. By excluding "sources" and "tracks",

          the api will not need to query kaltura, which greatly

          speeds up its response.


          sources:: Do not query kaltura for media_sources

          tracks:: Do not query kaltura for media_tracks'
      responses:
