        required: false
        description: "Array of strings indicating what additional data to include in the response.\nValid values:\n- \"peer_review\": includes peer review sub assignment information and overrides in the response.\n  If a peer review sub assignment exists, it is returned regardless of the Peer Review\n  Allocation and Grading feature state. If no peer review sub assignment exists,\n  the feature must be enabled to receive a null value; otherwise the key is omitted.\n- \"child_peer_review_override_dates\": each assignment override will include a peer_review_dates\n  field containing the matched peer review override data (id, due_at, unlock_at, lock_at)\n  for that override. The field will be present as null if no matching peer review override exists."
      - name: exclude
        in: query
        schema:
          type: array
          items:
            type: array
            items: {}
        required: false
        description: "Array of strings indicating what data to exclude from the response.\nValid values:\n- \"peer_review_overrides\": when include[]=peer_review is also specified, the\n  peer_review_sub_assignment object will not include the overrides array, reducing the\n  response payload size. This is useful when using include[]=child_peer_review_override_dates\n  since the peer review override data is already embedded in the parent assignment overrides.\n- \"child_override_due_dates\": prevents the sub_assignment_due_dates field from being included\n  in assignment override responses, even when discussion checkpoints are enabled. This reduces\n  response payload size when checkpoint due date information is not needed."
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearningObjectDates'
      externalDocs:
        url: https://canvas.instructure.com/doc/api/learning_object_dates.html
    put:
      tags:
      - Learning Object Dates
      operationId: update_learning_object_s_date_information_assignments
      summary: Update a learning object's date information
      description: 'Updates date-related information for learning objects, including due date, availability dates,

        override status, and assignment overrides.


        Returns 204 No Content response code if successful.'
      parameters:
      - name: course_id
        in: path
        schema:
          type: string
        required: true
        description: ID
      - name: assignment_id
        in: path
        schema:
          type: string
        required: true
        description: ID
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                due_at:
                  type: string
                  format: date-time
                  description: The learning object's due date. Not applicable for ungraded discussions, pages, and files.
                unlock_at:
                  type: string
                  format: date-time
                  description: The learning object's unlock date. Must be before the due date if there is one.
                lock_at:
                  type: string
                  format: date-time
                  description: The learning object's lock date. Must be after the due date if there is one.
                only_visible_to_overrides:
                  type: boolean
                  description: Whether the learning object is only assigned to students who are targeted by an override.
                assignment_overrides:
                  type: array
                  items:
                    type: array
                    items: {}
                  description: 'List of overrides to apply to the learning object. Overrides that already exist should include

                    an ID and will be updated if needed. New overrides will be created for overrides in the list

                    without an ID. Overrides not included in the list will be deleted. Providing an empty list

                    will delete all of the object''s overrides. Keys for each override object can include: ''id'',

                    ''title'', ''due_at'', ''unlock_at'', ''lock_at'', ''student_ids'', and ''course_section_id'', ''course_id'',

                    ''noop_id'', and ''unassign_item''.'
                peer_review:
                  type: object
                  additionalProperties: true
                  description: 'Optional peer review configuration for assignments with peer reviews enabled.

                    Requires the peer_review_allocation_and_grading feature flag.

                    Keys can include: ''due_at'', ''unlock_at'', ''lock_at'', ''peer_review_overrides'''
                peer_review[due_at]:
                  type: string
                  format: date-time
                  description: The peer review due date
                peer_review[unlock_at]:
                  type: string
                  format: date-time
                  description: The peer review unlock date (when peer reviews become available)
                peer_review[lock_at]:
                  type: string
                  format: date-time
                  description: The peer review lock date (when peer reviews are no longer available)
                peer_review[peer_review_overrides]:
                  type: array
                  items:
                    type: array
                    items: {}
                  description: 'List of peer review overrides. Each override can include: ''id'', ''due_at'',

                    ''unlock_at'', ''lock_at'', ''student_ids'', ''course_section_id'', ''course_id'',

                    ''group_id'', ''unassign_item'''
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                due_at:
                  type: string
                  format: date-time
                  description: The learning object's due date. Not applicable for ungraded discussions, pages, and files.
                unlock_at:
                  type: string
                  format: date-time
                  description: The learning object's unlock date. Must be before the due date if there is one.
                lock_at:
                  type: string
                  format: date-time
                  description: The learning object's lock date. Must be after the due date if there is one.
                only_visible_to_overrides:
                  type: boolean
                  description: Whether the learning object is only assigned to students who are targeted by an override.
                assignment_overrides:
                  type: array
                  items:
                    type: array
                    items: {}
                  description: 'List of overrides to apply to the learning object. Overrides that already exist should include

                    an ID and will be updated if needed. New overrides will be created for overrides in the list

                    without an ID. Overrides not included in the list will be deleted. Providing an empty list

                    will delete all of the object''s overrides. Keys for each override object can include: ''id'',

                    ''title'', ''due_at'', ''unlock_at'', ''lock_at'', ''student_ids'', and ''course_section_id'', ''course_id'',

                    ''noop_id'', and ''unassign_item''.'
                peer_review:
                  type: object
                  additionalProperties: true
                  description: 'Optional peer review configuration for assignments with peer reviews enabled.

                    Requires the peer_review_allocation_and_grading feature flag.

                    Keys can include: ''due_at'', ''unlock_at'', ''lock_at'', ''peer_review_overrides'''
                peer_review[due_at]:
                  type: string
                  format: date-time
                  description: The peer review due date
                peer_review[unlock_at]:
                  type: string
                  format: date-time
                  description: The peer review unlock date (when peer reviews become available)
                peer_review[lock_at]:
                  type: string
                  format: date-time
                  description: The peer review lock date (when peer reviews are no longer available)
                peer_review[peer_review_overrides]:
