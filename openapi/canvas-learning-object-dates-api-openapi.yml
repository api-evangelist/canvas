components:
  schemas:
    LearningObjectDates:
      type: object
      properties:
        id:
          type: integer
          example: 4
          description: the ID of the learning object (not present for checkpoints)
        due_at:
          type: string
          format: date-time
          example: '2012-07-01T23:59:00-06:00'
          description: the due date for the learning object. returns null if not present or applicable. never applicable for ungraded discussions, pages, and files
        lock_at:
          type: string
          format: date-time
          example: '2012-07-01T23:59:00-06:00'
          description: the lock date (learning object is locked after this date). returns null if not present
        reply_to_topic_due_at:
          type: string
          format: date-time
          example: '2012-07-01T23:59:00-06:00'
          description: the reply_to_topic sub_assignment due_date. returns null if not present
        required_replies_due_at:
          type: string
          format: date-time
          example: '2012-07-01T23:59:00-06:00'
          description: the reply_to_entry sub_assignment due_date. returns null if not present
        unlock_at:
          type: string
          format: date-time
          example: '2012-07-01T23:59:00-06:00'
          description: the unlock date (learning object is unlocked after this date). returns null if not present
        only_visible_to_overrides:
          type: boolean
          example: false
          description: whether the learning object is only visible to overrides
        graded:
          type: boolean
          example: true
          description: whether the learning object is graded (and thus has a due date)
        blueprint_date_locks:
          type: array
          items:
            type: string
          example:
          - due_dates
          - availability_dates
          description: '[exclusive to blueprint child content only] list of lock types'
        visible_to_everyone:
          type: boolean
          example: true
          description: whether the learning object is visible to everyone
        overrides:
          type: array
          items:
            type: string
            x-canvas-declared-type: AssignmentOverride
          description: paginated list of AssignmentOverride objects
        checkpoints:
          type: array
          items:
            $ref: '#/components/schemas/LearningObjectDates'
          description: list of Checkpoint objects, only present if a learning object has subAssignments
        tag:
          type: string
          example: reply_to_topic
          description: the tag identifying the type of checkpoint (only present for checkpoints)
        peer_review_sub_assignment:
          type: object
          additionalProperties: true
          description: peer review sub assignment details. If a peer review sub assignment exists, it is returned regardless of the Peer Review Allocation and Grading feature state. If no peer review sub assignment exists, the feature must be enabled to receive a null value; otherwise the key is omitted.
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'Canvas OAuth2 access token sent as "Authorization: Bearer <token>". See https://canvas.instructure.com/doc/api/file.oauth.html'
    oauth2:
      type: oauth2
      description: Canvas OAuth2. See https://canvas.instructure.com/doc/api/file.oauth.html and https://canvas.instructure.com/doc/api/file.oauth_endpoints.html
      flows:
        authorizationCode:
