openapi: 3.2.0
info:
  title: Canvas LMS REST Learning Object Dates API
  version: v1
  summary: The complete Canvas LMS REST API, converted from the Swagger 1.2 documents Instructure publishes under https://canvas.instructure.com/doc/api/.
  description: The Canvas LMS REST API covers courses, assignments, quizzes, grades, users, enrollments, accounts, files, modules, rubrics, submissions, SIS imports, LTI, analytics and account administration.
  contact:
    name: Instructure Canvas
    url: https://canvas.instructure.com/doc/api/
  license:
    name: AGPL-3.0
    url: https://github.com/instructure/canvas-lms/blob/master/LICENSE
servers:
- url: https://canvas.instructure.com/api
  description: Instructure-hosted Canvas (canvas.instructure.com)
- url: https://{canvas_host}/api
  description: Any Canvas instance; Canvas is multi-tenant and self-hostable, so the host is the institution's Canvas domain.
  variables:
    canvas_host:
      default: canvas.instructure.com
      description: Your institution's Canvas hostname, e.g. school.instructure.com
security:
- bearerAuth: []
- oauth2: []
tags:
- name: Learning Object Dates
  x-resource: learning_object_dates
  externalDocs:
    url: https://canvas.instructure.com/doc/api/learning_object_dates.html
paths:
  /v1/courses/{course_id}/modules/{context_module_id}/date_details:
    get:
      tags:
      - Learning Object Dates
      operationId: get_learning_object_s_date_information_modules
      summary: Get a learning object's date information
      description: 'Get a learning object''s date-related information, including due date, availability dates,

        override status, and a paginated list of all assignment overrides for the item.'
      parameters:
      - name: course_id
        in: path
        schema:
          type: string
        required: true
        description: ID
      - name: context_module_id
        in: path
        schema:
          type: string
        required: true
        description: ID
      - name: include
        in: query
        schema:
          type: array
          items:
            type: array
            items: {}
        required: false
        description: "Array of strings indicating what additional data to include in the response.\nValid values:\n- \"peer_review\": includes peer review sub assignment information and overrides in the response.\n  If a peer review sub assignment exists, it is returned regardless of the Peer Review\n  Allocation and Grading feature state. If no peer review sub assignment exists,\n  the feature must be enabled to receive a null value; otherwise the key is omitted.\n- \"child_peer_review_override_dates\": each assignment override will include a peer_review_dates\n  field containing the matched peer review override data (id, due_at, unlock_at, lock_at)\n  for that override. The field will be present as null if no matching peer review override exists."
      - name: exclude
        in: query
        schema:
          type: array
          items:
            type: array
            items: {}
        required: false
        description: "Array of strings indicating what data to exclude from the response.\nValid values:\n- \"peer_review_overrides\": when include[]=peer_review is also specified, the\n  peer_review_sub_assignment object will not include the overrides array, reducing the\n  response payload size. This is useful when using include[]=child_peer_review_override_dates\n  since the peer review override data is already embedded in the parent assignment overrides.\n- \"child_override_due_dates\": prevents the sub_assignment_due_dates field from being included\n  in assignment override responses, even when discussion checkpoints are enabled. This reduces\n  response payload size when checkpoint due date information is not needed."
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearningObjectDates'
      externalDocs:
        url: https://canvas.instructure.com/doc/api/learning_object_dates.html
  /v1/courses/{course_id}/assignments/{assignment_id}/date_details:
    get:
      tags:
      - Learning Object Dates
      operationId: get_learning_object_s_date_information_assignments
