  /v1/appointment_groups/{id}/users:
    get:
      tags:
      - Appointment Groups
      operationId: list_user_participants
      summary: List user participants
      description: 'A paginated list of users that are (or may be) participating in this

        appointment group. Refer to the Users API for the response fields. Returns

        no results for appointment groups with the "Group" participant_type.'
      parameters:
      - name: id
        in: path
        schema:
          type: string
        required: true
        description: ID
      - name: registration_status
        in: query
        schema:
          type: string
          enum:
          - all
          - registered
          - registered
        required: false
        description: Limits results to the a given participation status, defaults to "all"
      responses:
        '200':
          description: Success, no content returned
      externalDocs:
        url: https://canvas.instructure.com/doc/api/appointment_groups.html
  /v1/appointment_groups/{id}/groups:
    get:
      tags:
      - Appointment Groups
      operationId: list_student_group_participants
      summary: List student group participants
      description: 'A paginated list of student groups that are (or may be) participating in

        this appointment group. Refer to the Groups API for the response fields.

        Returns no results for appointment groups with the "User" participant_type.'
      parameters:
      - name: id
        in: path
        schema:
          type: string
        required: true
        description: ID
      - name: registration_status
        in: query
        schema:
          type: string
          enum:
          - all
          - registered
          - registered
        required: false
        description: Limits results to the a given participation status, defaults to "all"
      responses:
        '200':
          description: Success, no content returned
      externalDocs:
        url: https://canvas.instructure.com/doc/api/appointment_groups.html
  /v1/appointment_groups/next_appointment:
    get:
      tags:
      - Appointment Groups
      operationId: get_next_appointment
      summary: Get next appointment
      description: 'Return the next appointment available to sign up for. The appointment

        is returned in a one-element array. If no future appointments are

        available, an empty array is returned.'
      parameters:
      - name: appointment_group_ids
        in: query
        schema:
          type: array
          items:
            type: string
        required: false
        description: List of ids of appointment groups to search.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  x-canvas-declared-type: CalendarEvent
      externalDocs:
        url: https://canvas.instructure.com/doc/api/appointment_groups.html
