            enum:
            - child_events
            - appointments
            - all_context_codes
        required: false
        description: 'Array of additional information to include. See include[] argument of

          "List appointment groups" action.


          "child_events":: reservations of time slots time slots

          "appointments":: will always be returned

          "all_context_codes":: all context codes associated with this appointment group'
      responses:
        '200':
          description: Success, no content returned
      externalDocs:
        url: https://canvas.instructure.com/doc/api/appointment_groups.html
