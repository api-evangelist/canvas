paths:
  /v1/appointment_groups:
    get:
      tags:
      - Appointment Groups
      operationId: list_appointment_groups
      summary: List appointment groups
      description: 'Retrieve the paginated list of appointment groups that can be reserved or

        managed by the current user.'
      parameters:
      - name: scope
        in: query
        schema:
          type: string
          enum:
          - reservable
          - manageable
        required: false
        description: Defaults to "reservable"
      - name: context_codes
        in: query
        schema:
          type: array
          items:
            type: string
        required: false
        description: Array of context codes used to limit returned results.
      - name: include_past_appointments
        in: query
        schema:
          type: boolean
        required: false
        description: Defaults to false. If true, includes past appointment groups
      - name: include
        in: query
        schema:
          type: array
          items:
            type: string
            enum:
            - appointments
            - child_events
            - participant_count
            - reserved_times
            - all_context_codes
        required: false
        description: "Array of additional information to include.\n\n\"appointments\":: calendar event time slots for this appointment group\n\"child_events\":: reservations of those time slots\n\"participant_count\":: number of reservations\n\"reserved_times\":: the event id, start time and end time of reservations\n                   the current user has made)\n\"all_context_codes\":: all context codes associated with this appointment group"
      responses:
        '200':
          description: Success, no content returned
      externalDocs:
        url: https://canvas.instructure.com/doc/api/appointment_groups.html
    post:
      tags:
      - Appointment Groups
      operationId: create_appointment_group
      summary: Create an appointment group
      description: 'Create and return a new appointment group. If new_appointments are

        specified, the response will return a new_appointments array (same format

        as appointments array, see "List appointment groups" action)'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                appointment_group[context_codes]:
                  type: array
                  items:
                    type: string
                  description: 'Array of context codes (courses, e.g. course_1) this group should be

                    linked to (1 or more). Users in the course(s) with appropriate permissions

                    will be able to sign up for this appointment group.'
                appointment_group[sub_context_codes]:
                  type: array
                  items:
                    type: string
                  description: 'Array of sub context codes (course sections or a single group category)

                    this group should be linked to. Used to limit the appointment group to

                    particular sections. If a group category is specified, students will sign

                    up in groups and the participant_type will be "Group" instead of "User".'
                appointment_group[title]:
                  type: string
                  description: Short title for the appointment group.
                appointment_group[description]:
                  type: string
                  description: Longer text description of the appointment group.
                appointment_group[location_name]:
                  type: string
                  description: Location name of the appointment group.
                appointment_group[location_address]:
                  type: string
                  description: Location address.
                appointment_group[publish]:
                  type: boolean
                  description: 'Indicates whether this appointment group should be published (i.e. made

                    available for signup). Once published, an appointment group cannot be

                    unpublished. Defaults to false.'
                appointment_group[participants_per_appointment]:
                  type: integer
                  format: int64
                  description: 'Maximum number of participants that may register for each time slot.

                    Defaults to null (no limit).'
                appointment_group[min_appointments_per_participant]:
                  type: integer
                  format: int64
                  description: 'Minimum number of time slots a user must register for. If not set, users

                    do not need to sign up for any time slots.'
                appointment_group[max_appointments_per_participant]:
                  type: integer
                  format: int64
                  description: Maximum number of time slots a user may register for.
                appointment_group[new_appointments][X]:
                  type: array
                  items:
                    type: string
                  description: 'Nested array of start time/end time pairs indicating time slots for this

                    appointment group. Refer to the example request.'
                appointment_group[participant_visibility]:
                  type: string
                  enum:
                  - private
                  - protected
                  description: "\"private\":: participants cannot see who has signed up for a particular\n            time slot\n\"protected\":: participants can see who has signed up.  Defaults to\n              \"private\"."
                appointment_group[allow_observer_signup]:
                  type: boolean
                  description: Whether observer users can sign-up for an appointment. Defaults to false.
              required:
              - appointment_group[context_codes]
              - appointment_group[title]
          application/x-www-form-urlencoded:
