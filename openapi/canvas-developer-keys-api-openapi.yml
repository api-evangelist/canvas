components:
  schemas:
    DeveloperKey:
      type: object
      properties:
        id:
          type: integer
          example: 1
          description: The Canvas ID of the DeveloperKey object
        name:
          type: string
          example: Test Key
          description: The display name
        created_at:
          type: string
          format: date-time
          example: '2025-05-30T17:09:18Z'
          description: Timestamp of the key's creation
        updated_at:
          type: string
          format: date-time
          example: '2025-05-30T17:09:18Z'
          description: Timestamp of the key's last update
        workflow_state:
          type: string
          example: active
          description: The state of the key
          enum:
          - active
          - deleted
        is_lti_key:
          type: boolean
          example: false
          description: True if key represents an LTI 1.3 Registration. False for Canvas API keys
        email:
          type: string
          example: test@example.com
          description: Contact email configured for key
        icon_url:
          type: string
          example: https://example.com/icon.png
          description: URL for a small icon to display in key list
        notes:
          type: string
          example: this key is for testing
          description: User-provided notes about key
        vendor_code:
          type: string
          example: Google
          description: User-specified code representing the vendor that uses the key
        account_name:
          type: string
          example: Test Account
          description: The name of the account that owns the key
        visible:
          type: boolean
          example: true
          description: True for all keys except Site Admin-level keys, which default to false. Controls visibility in the Inherited tab.
        scopes:
          type: array
          items:
            type: string
          example:
          - url:GET|/api/v1/accounts
          description: List of API endpoints key is allowed to access (API keys), or LTI 1.3 scopes (LTI keys)
        redirect_uri:
          type: string
          example: 'no'
          description: Deprecated in favor of redirect_uris. Do not use.
        redirect_uris:
          type: array
          items:
            type: string
          example:
          - https://mytool.com/oauth2/redirect
          - https://mytool.com/1_3/launch
          description: List of URLs used during OAuth2 flow to validate given redirect URI (API keys), or to redirect to after login (LTI keys)
        all_redirect_uris:
          type: array
          items:
            type: object
            additionalProperties: true
          example:
          - redirect_uri: https://mytool.com/redirect
            last_used_at: '2024-01-15T12:00:00Z'
            workflow_state: active
          description: All redirect URIs associated with the key, including any that have been automatically deactivated due to inactivity, along with their last-used timestamp and workflow_state (one of 'active' or 'inactive')
        access_token_count:
          type: integer
          example: '42'
          description: (API keys only) The number of active access tokens associated with the key
        last_used_at:
          type: string
          format: date-time
          example: '2025-05-30T17:09:18Z'
          description: (API keys only) The last time an access token for this key was used in an API request
        test_cluster_only:
          type: boolean
          example: false
          description: (API keys only) If true, key is only usable in non-production environments (test, beta). Avoids problems with beta refresh.
        allow_includes:
          type: boolean
          example: true
          description: (API keys only) If true, allows `includes` parameters in API requests that match the scopes of this key
        require_scopes:
          type: boolean
          example: false
          description: (API keys only) If true, then token requests with this key must include scopes
        client_credentials_audience:
          type: string
          example: external
          description: (API keys only) Used in OAuth2 client credentials flow to specify the audience for the access token
        allowed_audiences:
          type: array
          items:
            type: string
          example:
          - cedar-api-production.us-east-1.temp.prod.inseng.io
          description: (API keys only) The registered audiences this key may request tokens for. Each value must appear in the environment's configured list of registered audiences.
        authorized_flows:
          type: array
          items:
            type: string
          example:
          - token_exchange
          description: '(API keys only) Additional OAuth2 flows this key is authorized to use. Allowed values: token_exchange, service_user_client_credentials.'
        client_type:
          type: string
          example: confidential
          description: '(API keys only) Whether this is a confidential or public client. Public clients (SPAs, mobile apps) require PKCE, cannot use client_credentials, and receive short-lived rotating tokens. Allowed values: confidential, public. Defaults to confidential. Immutable after creation.'
        api_key:
          type: string
          example: sd45fg64....
          description: (API keys only) The client secret used in the OAuth authorization_code flow.
        tool_configuration:
          type: string
          example:
            type: Lti::ToolConfiguration
          description: (LTI keys only) The Canvas-style tool configuration for this key.
        public_jwk:
          type: object
          additionalProperties: true
          example:
            e: AQAB
            etc: etc
          description: (LTI keys only) The tool's public JWK in JSON format. Discouraged in favor of a url hosting a JWK set.
        public_jwk_url:
          type: string
          example: https://mytool.com/1_3/jwks
          description: (LTI keys only) The tool-hosted URL containing its public JWK keyset. Canvas may cache JWKs up to 5 minutes.
        lti_registration:
          type: object
          additionalProperties: true
          example:
            type: TODO Lti::IMS::Registration
          description: (LTI keys only) The LTI IMS Registration object for this key, if key was created via Dynamic Registration.
        is_lti_registration:
          type: boolean
          example: false
          description: (LTI keys only) Returns true if key was created via Dynamic Registration.
        user_name:
          type: string
          example: ''
          description: Unused.
        user_id:
          type: string
          example: ''
          description: Unused.
        unified_tool_id:
          type: string
          example: 6ba7b810-9dad-11d1-80b4-00c04fd430c8
          description: Correlates an API key to a product configuration.
      description: a Canvas API key (or LTI 1.3 registration)
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'Canvas OAuth2 access token sent as "Authorization: Bearer <token>". See https://canvas.instructure.com/doc/api/file.oauth.html'
    oauth2:
      type: oauth2
      description: Canvas OAuth2. See https://canvas.instructure.com/doc/api/file.oauth.html and https://canvas.instructure.com/doc/api/file.oauth_endpoints.html
      flows:
        authorizationCode:
          authorizationUrl: https://canvas.instructure.com/login/oauth2/auth
          tokenUrl: https://canvas.instructure.com/login/oauth2/token
          refreshUrl: https://canvas.instructure.com/login/oauth2/token
          scopes: {}
