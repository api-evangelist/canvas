openapi: 3.2.0
info:
  title: Canvas LMS REST Developer Keys API
  version: v1
  summary: The complete Canvas LMS REST API, converted from the Swagger 1.2 documents Instructure publishes under https://canvas.instructure.com/doc/api/.
  description: The Canvas LMS REST API covers courses, assignments, quizzes, grades, users, enrollments, accounts, files, modules, rubrics, submissions, SIS imports, LTI, analytics and account administration.
  contact:
    name: Instructure Canvas
    url: https://canvas.instructure.com/doc/api/
  license:
    name: AGPL-3.0
    url: https://github.com/instructure/canvas-lms/blob/master/LICENSE
servers:
- url: https://canvas.instructure.com/api
  description: Instructure-hosted Canvas (canvas.instructure.com)
- url: https://{canvas_host}/api
  description: Any Canvas instance; Canvas is multi-tenant and self-hostable, so the host is the institution's Canvas domain.
  variables:
    canvas_host:
      default: canvas.instructure.com
      description: Your institution's Canvas hostname, e.g. school.instructure.com
security:
- bearerAuth: []
- oauth2: []
tags:
- name: Developer Keys
  x-resource: developer_keys
  externalDocs:
    url: https://canvas.instructure.com/doc/api/developer_keys.html
paths:
  /v1/accounts/{account_id}/developer_keys:
    get:
      tags:
      - Developer Keys
      operationId: list_developer_keys
      summary: List Developer Keys
      description: List all developer keys created in the current account.
      parameters:
      - name: account_id
        in: path
        schema:
          type: string
        required: true
        description: ID
      - name: inherited
        in: query
        schema:
          type: boolean
        required: false
        description: 'Defaults to false. If true, lists keys inherited from

          Site Admin (and consortium parent account, if applicable).'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeveloperKey'
      externalDocs:
        url: https://canvas.instructure.com/doc/api/developer_keys.html
    post:
      tags:
      - Developer Keys
      operationId: create_developer_key
      summary: Create a Developer Key
      description: 'Create a new Canvas API key. Creating an LTI 1.3 registration is not supported here and

        should be done via the LTI Registration API.'
      parameters:
      - name: account_id
        in: path
        schema:
          type: string
        required: true
        description: ID
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                developer_key:
                  type: object
                  additionalProperties: true
                  description: no description
                developer_key[auto_expire_tokens]:
                  type: boolean
                  description: 'Defaults to false. If true, access tokens

                    generated by this key will expire after 1 hour.'
                developer_key[email]:
                  type: string
                  description: Contact email for the key.
                developer_key[icon_url]:
                  type: string
                  description: URL for a small icon to display in key list.
                developer_key[name]:
                  type: string
                  description: The display name.
                developer_key[notes]:
                  type: string
                  description: User-provided notes about the key.
                developer_key[redirect_uri]:
                  type: string
                  description: Deprecated in favor of redirect_uris. Do not use.
                developer_key[redirect_uris]:
                  type: array
                  items: {}
                  description: 'List of URLs used during OAuth2 flow to validate

                    given redirect URI.'
                developer_key[vendor_code]:
                  type: string
                  description: User-specified code representing the vendor that uses the key.
                developer_key[visible]:
                  type: boolean
                  description: Defaults to true. If false, key will not be visible in the UI.
                developer_key[test_cluster_only]:
                  type: boolean
                  description: 'Defaults to false. If true, key is only usable in

                    non-production environments (test, beta). Avoids problems with beta refresh.'
                developer_key[client_credentials_audience]:
                  type: string
                  description: 'Used in OAuth2 client credentials flow to

                    specify the audience for the access token.'
                developer_key[allowed_audiences]:
                  type: array
                  items: {}
                  description: 'The registered audiences this key may request tokens

                    for. Each value must appear in the environment''s configured list of registered audiences.'
                developer_key[authorized_flows]:
                  type: array
                  items: {}
                  description: 'Additional OAuth2 flows this key is authorized to

                    use. Allowed values: token_exchange, service_user_client_credentials.'
                developer_key[client_type]:
                  type: string
                  description: 'Whether this is a confidential or public client.

                    Public clients (SPAs, mobile apps) require PKCE in the authorization code flow, cannot use the

                    client_credentials flow, and receive short-lived access tokens with rotating refresh tokens.

                    Allowed values: confidential (default), public.

                    Not applicable to LTI keys. Immutable after creation.'
                developer_key[scopes]:
                  type: array
                  items: {}
                  description: List of API endpoints key is allowed to access.
                developer_key[require_scopes]:
                  type: boolean
                  description: If true, then token requests with this key must include scopes.
                developer_key[allow_includes]:
                  type: boolean
                  description: 'If true, allows `includes` parameters in API requests that

                    match the scopes of this key.'
              required:
              - developer_key
          application/x-www-form-urlencoded:
