paths:
  /v1/courses/{course_id}/content_exports:
    get:
      tags:
      - Content Exports
      operationId: list_content_exports_courses
      summary: List content exports
      description: 'A paginated list of the past and pending content export jobs for a course,

        group, or user. Exports are returned newest first.'
      parameters:
      - name: course_id
        in: path
        schema:
          type: string
        required: true
        description: ID
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ContentExport'
      externalDocs:
        url: https://canvas.instructure.com/doc/api/content_exports.html
    post:
      tags:
      - Content Exports
      operationId: export_content_courses
      summary: Export content
      description: 'Begin a content export job for a course, group, or user.


        You can use the {api:ProgressController#show Progress API} to track the

        progress of the export. The migration''s progress is linked to with the

        _progress_url_ value.


        When the export completes, use the {api:ContentExportsApiController#show Show content export} endpoint

        to retrieve a download URL for the exported content.'
      parameters:
      - name: course_id
        in: path
        schema:
          type: string
        required: true
        description: ID
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                export_type:
                  type: string
                  enum:
                  - common_cartridge
                  - qti
                  - zip
                  description: '"common_cartridge":: Export the contents of the course in the Common Cartridge (.imscc) format

                    "qti":: Export quizzes from a course in the QTI format

                    "zip":: Export files from a course, group, or user in a zip file'
                skip_notifications:
                  type: boolean
                  description: 'Don''t send the notifications about the export to the user. Default: false'
                select:
                  type: object
                  additionalProperties: true
                  enum:
                  - folders
                  - files
                  - attachments
                  - quizzes
                  - assignments
                  - announcements
                  - calendar_events
                  - discussion_topics
                  - modules
                  - module_items
                  - pages
                  - rubrics
                  description: 'The select parameter allows exporting specific data. The keys are object types like ''files'',

                    ''folders'', ''pages'', etc. The value for each key is a list of object ids. An id can be an

                    integer or a string.


                    Multiple object types can be selected in the same call. However, not all object types are

                    valid for every export_type. Common Cartridge supports all object types. Zip and QTI only

                    support the object types as described below.


                    "folders":: Also supported for zip export_type.

                    "files":: Also supported for zip export_type.

                    "quizzes":: Also supported for qti export_type.'
              required:
              - export_type
          application/x-www-form-urlencoded:
            schema:
              type: object
