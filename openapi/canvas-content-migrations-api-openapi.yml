openapi: 3.2.0
info:
  title: Canvas LMS REST Content Migrations API
  version: v1
  summary: The complete Canvas LMS REST API, converted from the Swagger 1.2 documents Instructure publishes under https://canvas.instructure.com/doc/api/.
  description: The Canvas LMS REST API covers courses, assignments, quizzes, grades, users, enrollments, accounts, files, modules, rubrics, submissions, SIS imports, LTI, analytics and account administration.
  contact:
    name: Instructure Canvas
    url: https://canvas.instructure.com/doc/api/
  license:
    name: AGPL-3.0
    url: https://github.com/instructure/canvas-lms/blob/master/LICENSE
servers:
- url: https://canvas.instructure.com/api
  description: Instructure-hosted Canvas (canvas.instructure.com)
- url: https://{canvas_host}/api
  description: Any Canvas instance; Canvas is multi-tenant and self-hostable, so the host is the institution's Canvas domain.
  variables:
    canvas_host:
      default: canvas.instructure.com
      description: Your institution's Canvas hostname, e.g. school.instructure.com
security:
- bearerAuth: []
- oauth2: []
tags:
- name: Content Migrations
  x-resource: content_migrations
  externalDocs:
    url: https://canvas.instructure.com/doc/api/content_migrations.html
paths:
  /v1/accounts/{account_id}/content_migrations/{content_migration_id}/migration_issues:
    get:
      tags:
      - Content Migrations
      operationId: list_migration_issues_accounts
      summary: List migration issues
      description: Returns paginated migration issues
      parameters:
      - name: account_id
        in: path
        schema:
          type: string
        required: true
        description: ID
      - name: content_migration_id
        in: path
        schema:
          type: string
        required: true
        description: ID
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MigrationIssue'
      externalDocs:
        url: https://canvas.instructure.com/doc/api/content_migrations.html
  /v1/courses/{course_id}/content_migrations/{content_migration_id}/migration_issues:
