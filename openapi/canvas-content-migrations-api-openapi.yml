        required: true
        description: ID
      - name: id
        in: path
        schema:
          type: string
        required: true
        description: ID
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                workflow_state:
                  type: string
                  enum:
                  - active
                  - resolved
                  description: Set the workflow_state of the issue.
              required:
              - workflow_state
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                workflow_state:
                  type: string
                  enum:
                  - active
                  - resolved
                  description: Set the workflow_state of the issue.
              required:
