  /v1/accounts/{account_id}/content_migrations:
    get:
      tags:
      - Content Migrations
      operationId: list_content_migrations_accounts
      summary: List content migrations
      description: Returns paginated content migrations
      parameters:
      - name: account_id
        in: path
        schema:
          type: string
        required: true
        description: ID
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ContentMigration'
      externalDocs:
        url: https://canvas.instructure.com/doc/api/content_migrations.html
    post:
      tags:
      - Content Migrations
      operationId: create_content_migration_accounts
      summary: Create a content migration
      description: 'Create a content migration. If the migration requires a file to be uploaded

        the actual processing of the file will start once the file upload process is completed.

        File uploading works as described in the {file:file.file_uploads.html File Upload Documentation}

        except that the values are set on a *pre_attachment* sub-hash.


        For migrations that don''t require a file to be uploaded, like course copy, the

        processing will begin as soon as the migration is created.


        You can use the {api:ProgressController#show Progress API} to track the

        progress of the migration. The migration''s progress is linked to with the

        _progress_url_ value.


        The two general workflows are:


        If no file upload is needed:


        1. POST to create

        2. Use the {api:ProgressController#show Progress} specified in _progress_url_ to monitor progress


        For file uploading:


        1. POST to create with file info in *pre_attachment*

        2. Do {file:file.file_uploads.html file upload processing} using the data in the *pre_attachment* data

        3. {api:ContentMigrationsController#show GET} the ContentMigration

        4. Use the {api:ProgressController#show Progress} specified in _progress_url_ to monitor progress


        (required if doing .zip file upload)'
      parameters:
      - name: account_id
        in: path
        schema:
          type: string
        required: true
        description: ID
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                migration_type:
                  type: string
                  description: 'The type of the migration. Use the

                    {api:ContentMigrationsController#available_migrators Migrator} endpoint to

                    see all available migrators. Default allowed values:

                    canvas_cartridge_importer, common_cartridge_importer,

                    course_copy_importer, zip_file_importer, qti_converter, moodle_converter'
                pre_attachment[name]:
                  type: string
                  description: 'Required if uploading a file. This is the first step in uploading a file

                    to the content migration. See the {file:file.file_uploads.html File Upload

                    Documentation} for details on the file upload workflow.'
                pre_attachment[*]:
                  type: string
                  description: 'Other file upload properties, See {file:file.file_uploads.html File Upload

                    Documentation}'
                settings[file_url]:
                  type: string
                  description: A URL to download the file from. Must not require authentication.
                settings[content_export_id]:
                  type: string
                  description: 'The id of a ContentExport to import. This allows you to import content previously exported from Canvas

                    without needing to download and re-upload it.'
                settings[source_course_id]:
                  type: string
                  description: 'The course to copy from for a course copy migration. (required if doing

                    course copy)'
                settings[folder_id]:
                  type: string
                  description: The folder to unzip the .zip file into for a zip_file_import.
                settings[overwrite_quizzes]:
                  type: boolean
                  description: 'Whether to overwrite quizzes with the same identifiers between content

                    packages.'
                settings[question_bank_id]:
                  type: integer
                  format: int64
                  description: 'The existing question bank ID to import questions into if not specified in

                    the content package.'
                settings[question_bank_name]:
                  type: string
                  description: 'The question bank to import questions into if not specified in the content

                    package, if both bank id and name are set, id will take precedence.'
                settings[insert_into_module_id]:
                  type: integer
                  format: int64
                  description: 'The id of a module in the target course. This will add all imported items

                    (that can be added to a module) to the given module.'
                settings[insert_into_module_type]:
                  type: string
                  enum:
                  - assignment
                  - discussion_topic
                  - file
                  - page
                  - quiz
                  description: 'If provided (and +insert_into_module_id+ is supplied),

                    only add objects of the specified type to the module.'
                settings[insert_into_module_position]:
                  type: integer
                  format: int64
                  description: 'The (1-based) position to insert the imported items into the course

                    (if +insert_into_module_id+ is supplied). If this parameter

                    is omitted, items will be added to the end of the module.'
                settings[move_to_assignment_group_id]:
                  type: integer
                  format: int64
                  description: 'The id of an assignment group in the target course. If provided, all

                    imported assignments will be moved to the given assignment group.'
                settings[importer_skips]:
                  type: array
                  items:
                    type: string
                    enum:
                    - all_course_settings
                    - visibility_settings
                  description: Set of importers to skip, even if otherwise selected by migration settings.
                settings[import_blueprint_settings]:
                  type: boolean
                  description: 'Import the "use as blueprint course" setting as well as the list of locked items

                    from the source course or package. The destination course must not be associated

                    with an existing blueprint course and cannot have any student or observer enrollments.'
                date_shift_options[shift_dates]:
                  type: boolean
                  description: Whether to shift dates in the copied course
                date_shift_options[old_start_date]:
                  type: string
                  format: date
                  description: The original start date of the source content/course
                date_shift_options[old_end_date]:
                  type: string
                  format: date
                  description: The original end date of the source content/course
                date_shift_options[new_start_date]:
                  type: string
                  format: date
                  description: The new start date for the content/course
                date_shift_options[new_end_date]:
                  type: string
                  format: date
                  description: The new end date for the source content/course
                date_shift_options[day_substitutions][X]:
                  type: integer
                  format: int64
                  description: 'Move anything scheduled for day ''X'' to the specified day. (0-Sunday,

                    1-Monday, 2-Tuesday, 3-Wednesday, 4-Thursday, 5-Friday, 6-Saturday)'
                date_shift_options[remove_dates]:
                  type: boolean
                  description: 'Whether to remove dates in the copied course. Cannot be used

                    in conjunction with *shift_dates*.'
                selective_import:
                  type: boolean
                  description: 'If set, perform a selective import instead of importing all content.

                    The migration will identify the contents of the package and then stop

                    in the +waiting_for_select+ workflow state. At this point, use the

                    {api:ContentMigrationsController#content_list List items endpoint}

                    to enumerate the contents of the package, identifying the copy

                    parameters for the desired content. Then call the

                    {api:ContentMigrationsController#update Update endpoint} and provide these

                    copy parameters to start the import.'
                select:
                  type: object
                  additionalProperties: true
                  enum:
                  - folders
                  - files
                  - attachments
                  - quizzes
                  - assignments
                  - announcements
                  - calendar_events
                  - discussion_topics
                  - modules
                  - module_items
                  - pages
                  - rubrics
                  description: 'For +course_copy_importer+ migrations, this parameter allows you to select

                    the objects to copy without using the +selective_import+ argument and

                    +waiting_for_select+ state as is required for uploaded imports (though that

                    workflow is also supported for course copy migrations).

                    The keys are object types like ''files'', ''folders'', ''pages'', etc. The value

                    for each key is a list of object ids. An id can be an integer or a string.

                    Multiple object types can be selected in the same call.'
              required:
              - migration_type
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                migration_type:
                  type: string
                  description: 'The type of the migration. Use the

                    {api:ContentMigrationsController#available_migrators Migrator} endpoint to

                    see all available migrators. Default allowed values:

                    canvas_cartridge_importer, common_cartridge_importer,

                    course_copy_importer, zip_file_importer, qti_converter, moodle_converter'
                pre_attachment[name]:
                  type: string
                  description: 'Required if uploading a file. This is the first step in uploading a file

                    to the content migration. See the {file:file.file_uploads.html File Upload

                    Documentation} for details on the file upload workflow.'
                pre_attachment[*]:
                  type: string
                  description: 'Other file upload properties, See {file:file.file_uploads.html File Upload

                    Documentation}'
                settings[file_url]:
                  type: string
                  description: A URL to download the file from. Must not require authentication.
                settings[content_export_id]:
                  type: string
                  description: 'The id of a ContentExport to import. This allows you to import content previously exported from Canvas

                    without needing to download and re-upload it.'
                settings[source_course_id]:
                  type: string
                  description: 'The course to copy from for a course copy migration. (required if doing

                    course copy)'
                settings[folder_id]:
                  type: string
                  description: The folder to unzip the .zip file into for a zip_file_import.
                settings[overwrite_quizzes]:
                  type: boolean
                  description: 'Whether to overwrite quizzes with the same identifiers between content

                    packages.'
                settings[question_bank_id]:
                  type: integer
                  format: int64
                  description: 'The existing question bank ID to import questions into if not specified in

                    the content package.'
                settings[question_bank_name]:
                  type: string
                  description: 'The question bank to import questions into if not specified in the content

                    package, if both bank id and name are set, id will take precedence.'
                settings[insert_into_module_id]:
                  type: integer
                  format: int64
                  description: 'The id of a module in the target course. This will add all imported items

                    (that can be added to a module) to the given module.'
                settings[insert_into_module_type]:
                  type: string
                  enum:
                  - assignment
                  - discussion_topic
                  - file
                  - page
                  - quiz
                  description: 'If provided (and +insert_into_module_id+ is supplied),

                    only add objects of the specified type to the module.'
                settings[insert_into_module_position]:
                  type: integer
                  format: int64
                  description: 'The (1-based) position to insert the imported items into the course

                    (if +insert_into_module_id+ is supplied). If this parameter

                    is omitted, items will be added to the end of the module.'
                settings[move_to_assignment_group_id]:
                  type: integer
                  format: int64
                  description: 'The id of an assignment group in the target course. If provided, all

                    imported assignments will be moved to the given assignment group.'
                settings[importer_skips]:
                  type: array
                  items:
                    type: string
                    enum:
                    - all_course_settings
                    - visibility_settings
                  description: Set of importers to skip, even if otherwise selected by migration settings.
                settings[import_blueprint_settings]:
                  type: boolean
                  description: 'Import the "use as blueprint course" setting as well as the list of locked items

                    from the source course or package. The destination course must not be associated

                    with an existing blueprint course and cannot have any student or observer enrollments.'
                date_shift_options[shift_dates]:
                  type: boolean
                  description: Whether to shift dates in the copied course
                date_shift_options[old_start_date]:
                  type: string
                  format: date
                  description: The original start date of the source content/course
                date_shift_options[old_end_date]:
                  type: string
                  format: date
                  description: The original end date of the source content/course
                date_shift_options[new_start_date]:
                  type: string
                  format: date
                  description: The new start date for the content/course
                date_shift_options[new_end_date]:
                  type: string
                  format: date
                  description: The new end date for the source content/course
                date_shift_options[day_substitutions][X]:
                  type: integer
                  format: int64
                  description: 'Move anything scheduled for day ''X'' to the specified day. (0-Sunday,

                    1-Monday, 2-Tuesday, 3-Wednesday, 4-Thursday, 5-Friday, 6-Saturday)'
                date_shift_options[remove_dates]:
                  type: boolean
                  description: 'Whether to remove dates in the copied course. Cannot be used

                    in conjunction with *shift_dates*.'
                selective_import:
                  type: boolean
                  description: 'If set, perform a selective import instead of importing all content.

                    The migration will identify the contents of the package and then stop

