      - name: user_id
        in: path
        schema:
          type: string
        required: true
        description: ID
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                migration_type:
                  type: string
                  description: 'The type of the migration. Use the

                    {api:ContentMigrationsController#available_migrators Migrator} endpoint to

                    see all available migrators. Default allowed values:

                    canvas_cartridge_importer, common_cartridge_importer,

                    course_copy_importer, zip_file_importer, qti_converter, moodle_converter'
                pre_attachment[name]:
                  type: string
                  description: 'Required if uploading a file. This is the first step in uploading a file

                    to the content migration. See the {file:file.file_uploads.html File Upload

                    Documentation} for details on the file upload workflow.'
                pre_attachment[*]:
                  type: string
                  description: 'Other file upload properties, See {file:file.file_uploads.html File Upload

                    Documentation}'
                settings[file_url]:
                  type: string
                  description: A URL to download the file from. Must not require authentication.
                settings[content_export_id]:
                  type: string
                  description: 'The id of a ContentExport to import. This allows you to import content previously exported from Canvas

                    without needing to download and re-upload it.'
                settings[source_course_id]:
                  type: string
                  description: 'The course to copy from for a course copy migration. (required if doing

                    course copy)'
                settings[folder_id]:
                  type: string
                  description: The folder to unzip the .zip file into for a zip_file_import.
                settings[overwrite_quizzes]:
                  type: boolean
                  description: 'Whether to overwrite quizzes with the same identifiers between content

                    packages.'
                settings[question_bank_id]:
                  type: integer
                  format: int64
                  description: 'The existing question bank ID to import questions into if not specified in

                    the content package.'
                settings[question_bank_name]:
                  type: string
                  description: 'The question bank to import questions into if not specified in the content

                    package, if both bank id and name are set, id will take precedence.'
                settings[insert_into_module_id]:
                  type: integer
                  format: int64
                  description: 'The id of a module in the target course. This will add all imported items

                    (that can be added to a module) to the given module.'
                settings[insert_into_module_type]:
                  type: string
                  enum:
                  - assignment
                  - discussion_topic
                  - file
                  - page
                  - quiz
                  description: 'If provided (and +insert_into_module_id+ is supplied),

                    only add objects of the specified type to the module.'
                settings[insert_into_module_position]:
                  type: integer
                  format: int64
                  description: 'The (1-based) position to insert the imported items into the course

                    (if +insert_into_module_id+ is supplied). If this parameter

                    is omitted, items will be added to the end of the module.'
                settings[move_to_assignment_group_id]:
                  type: integer
