paths:
  /v1/accounts/{account_id}/sis_imports/{id}/errors:
    get:
      tags:
      - Sis Import Errors
      operationId: get_sis_import_error_list_sis_imports
      summary: Get SIS import error list
      description: 'Returns the list of SIS import errors for an account or a SIS import. Import

        errors are only stored for 30 days.


        Example:

        curl ''https:///api/v1/accounts//sis_imports//sis_import_errors'' \

        -H "Authorization: Bearer "


        Example:

        curl ''https:///api/v1/accounts//sis_import_errors'' \

        -H "Authorization: Bearer "'
      parameters:
      - name: account_id
        in: path
        schema:
          type: string
        required: true
        description: ID
      - name: id
        in: path
        schema:
          type: string
        required: true
        description: ID
      - name: failure
        in: query
        schema:
          type: boolean
        required: false
        description: If set, only shows errors on a sis import that would cause a failure.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SisImportError'
      externalDocs:
        url: https://canvas.instructure.com/doc/api/sis_import_errors.html
