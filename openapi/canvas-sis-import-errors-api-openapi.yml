components:
  schemas:
    SisImportError:
      type: object
      properties:
        sis_import_id:
          type: integer
          example: '1'
          description: The unique identifier for the SIS import.
        file:
          type: string
          example: courses.csv
          description: The file where the error message occurred.
        message:
          type: string
          example: No short_name given for course C001
          description: The error message that from the record.
        row_info:
          type: string
          example: 'account_1, Sub account 1,, active '
          description: The contents of the line that had the error.
        row:
          type: integer
          example: '34'
          description: The line number where the error occurred. Some Importers do not yet support this. This is a 1 based index starting with the header row.
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'Canvas OAuth2 access token sent as "Authorization: Bearer <token>". See https://canvas.instructure.com/doc/api/file.oauth.html'
    oauth2:
      type: oauth2
      description: Canvas OAuth2. See https://canvas.instructure.com/doc/api/file.oauth.html and https://canvas.instructure.com/doc/api/file.oauth_endpoints.html
      flows:
        authorizationCode:
          authorizationUrl: https://canvas.instructure.com/login/oauth2/auth
          tokenUrl: https://canvas.instructure.com/login/oauth2/token
          refreshUrl: https://canvas.instructure.com/login/oauth2/token
          scopes: {}
