      operationId: batch_update_grading_periods_courses
      summary: Batch update grading periods
      description: Update multiple grading periods
      parameters:
      - name: course_id
        in: path
        schema:
          type: string
        required: true
        description: ID
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                set_id:
                  type: string
                  description: The id of the grading period set.
                grading_periods[id]:
                  type: array
                  items:
                    type: string
                  description: The id of the grading period. If the id parameter does not exist, a new grading period will be created.
                grading_periods[title]:
                  type: array
                  items:
                    type: string
                  description: 'The title of the grading period.

                    The title is required for creating a new grading period, but not for updating an existing grading period.'
                grading_periods[start_date]:
                  type: array
                  items:
                    type: string
                    format: date
                  description: 'The date the grading period starts.

                    The start_date is required for creating a new grading period, but not for updating an existing grading period.'
                grading_periods[end_date]:
                  type: array
                  items:
                    type: string
                    format: date
                  description: 'The date the grading period ends.

                    The end_date is required for creating a new grading period, but not for updating an existing grading period.'
                grading_periods[close_date]:
                  type: array
                  items:
                    type: string
                    format: date
                  description: 'The date after which grades can no longer be changed for a grading period.

                    The close_date is required for creating a new grading period, but not for updating an existing grading period.'
                grading_periods[weight]:
                  type: array
                  items:
                    type: number
                  description: A weight value that contributes to the overall weight of a grading period set which is used to calculate how much assignments in this period contribute to the total grade
              required:
              - set_id
              - grading_periods[title]
              - grading_periods[start_date]
              - grading_periods[end_date]
              - grading_periods[close_date]
          application/x-www-form-urlencoded:
