    get:
      tags:
      - Grading Periods
      operationId: list_grading_periods_accounts
      summary: List grading periods
      description: Returns the paginated list of grading periods for the current course.
      parameters:
      - name: account_id
        in: path
        schema:
          type: string
        required: true
        description: ID
      responses:
        '200':
          description: Success, no content returned
      externalDocs:
        url: https://canvas.instructure.com/doc/api/grading_periods.html
