      summary: List grading periods
      description: Returns the paginated list of grading periods for the current course.
      parameters:
      - name: course_id
        in: path
        schema:
          type: string
        required: true
        description: ID
      responses:
        '200':
          description: Success, no content returned
      externalDocs:
        url: https://canvas.instructure.com/doc/api/grading_periods.html
  /v1/courses/{course_id}/grading_periods/{id}:
    get:
      tags:
      - Grading Periods
      operationId: get_single_grading_period
      summary: Get a single grading period
      description: Returns the grading period with the given id
      parameters:
      - name: course_id
        in: path
        schema:
          type: string
        required: true
        description: ID
      - name: id
        in: path
        schema:
          type: string
        required: true
        description: ID
      responses:
        '200':
          description: Success, no content returned
      externalDocs:
        url: https://canvas.instructure.com/doc/api/grading_periods.html
    put:
      tags:
      - Grading Periods
      operationId: update_single_grading_period
      summary: Update a single grading period
      description: Update an existing grading period.
      parameters:
      - name: course_id
        in: path
        schema:
          type: string
        required: true
        description: ID
      - name: id
        in: path
        schema:
          type: string
        required: true
        description: ID
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                grading_periods[start_date]:
                  type: array
                  items:
                    type: string
                    format: date
                  description: The date the grading period starts.
                grading_periods[end_date]:
                  type: array
                  items:
                    type: string
                    format: date
                  description: no description
                grading_periods[weight]:
                  type: array
                  items:
                    type: number
                  description: A weight value that contributes to the overall weight of a grading period set which is used to calculate how much assignments in this period contribute to the total grade
              required:
              - grading_periods[start_date]
              - grading_periods[end_date]
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                grading_periods[start_date]:
                  type: array
                  items:
                    type: string
                    format: date
                  description: The date the grading period starts.
                grading_periods[end_date]:
                  type: array
                  items:
                    type: string
                    format: date
                  description: no description
                grading_periods[weight]:
                  type: array
                  items:
                    type: number
                  description: A weight value that contributes to the overall weight of a grading period set which is used to calculate how much assignments in this period contribute to the total grade
              required:
              - grading_periods[start_date]
              - grading_periods[end_date]
      responses:
        '200':
          description: Success, no content returned
      externalDocs:
        url: https://canvas.instructure.com/doc/api/grading_periods.html
    delete:
      tags:
      - Grading Periods
      operationId: delete_grading_period_courses
      summary: Delete a grading period
      description: '204 No Content response code is returned if the deletion was

        successful.'
      parameters:
      - name: course_id
        in: path
        schema:
          type: string
        required: true
        description: ID
      - name: id
        in: path
        schema:
          type: string
        required: true
        description: ID
      responses:
        '200':
          description: Success, no content returned
      externalDocs:
        url: https://canvas.instructure.com/doc/api/grading_periods.html
  /v1/accounts/{account_id}/grading_periods/{id}:
    delete:
      tags:
      - Grading Periods
      operationId: delete_grading_period_accounts
      summary: Delete a grading period
      description: '204 No Content response code is returned if the deletion was

        successful.'
      parameters:
      - name: account_id
        in: path
        schema:
          type: string
        required: true
        description: ID
