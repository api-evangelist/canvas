  /v1/users/{user_id}/logins/{id}:
    delete:
      tags:
      - Logins
      operationId: delete_user_login
      summary: Delete a user login
      description: Delete an existing login.
      parameters:
      - name: user_id
        in: path
        schema:
          type: string
        required: true
        description: ID
      - name: id
        in: path
        schema:
          type: string
