openapi: 3.2.0
info:
  title: Canvas LMS REST Outcome Groups API
  version: v1
  summary: The complete Canvas LMS REST API, converted from the Swagger 1.2 documents Instructure publishes under https://canvas.instructure.com/doc/api/.
  description: The Canvas LMS REST API covers courses, assignments, quizzes, grades, users, enrollments, accounts, files, modules, rubrics, submissions, SIS imports, LTI, analytics and account administration.
  contact:
    name: Instructure Canvas
    url: https://canvas.instructure.com/doc/api/
  license:
    name: AGPL-3.0
    url: https://github.com/instructure/canvas-lms/blob/master/LICENSE
servers:
- url: https://canvas.instructure.com/api
  description: Instructure-hosted Canvas (canvas.instructure.com)
- url: https://{canvas_host}/api
  description: Any Canvas instance; Canvas is multi-tenant and self-hostable, so the host is the institution's Canvas domain.
  variables:
    canvas_host:
      default: canvas.instructure.com
      description: Your institution's Canvas hostname, e.g. school.instructure.com
security:
- bearerAuth: []
- oauth2: []
tags:
- name: Outcome Groups
  x-resource: outcome_groups
  externalDocs:
    url: https://canvas.instructure.com/doc/api/outcome_groups.html
paths:
  /v1/global/root_outcome_group:
    get:
      tags:
      - Outcome Groups
      operationId: redirect_to_root_outcome_group_for_context_global
      summary: Redirect to root outcome group for context
      description: 'Convenience redirect to find the root outcome group for a particular

        context. Will redirect to the appropriate outcome group''s URL.'
      responses:
        '200':
          description: Success, no content returned
      externalDocs:
        url: https://canvas.instructure.com/doc/api/outcome_groups.html
  /v1/accounts/{account_id}/root_outcome_group:
    get:
      tags:
      - Outcome Groups
      operationId: redirect_to_root_outcome_group_for_context_accounts
      summary: Redirect to root outcome group for context
      description: 'Convenience redirect to find the root outcome group for a particular

        context. Will redirect to the appropriate outcome group''s URL.'
      parameters:
      - name: account_id
        in: path
        schema:
          type: string
        required: true
        description: ID
      responses:
        '200':
          description: Success, no content returned
      externalDocs:
        url: https://canvas.instructure.com/doc/api/outcome_groups.html
  /v1/courses/{course_id}/root_outcome_group:
    get:
      tags:
      - Outcome Groups
      operationId: redirect_to_root_outcome_group_for_context_courses
      summary: Redirect to root outcome group for context
      description: 'Convenience redirect to find the root outcome group for a particular

        context. Will redirect to the appropriate outcome group''s URL.'
      parameters:
      - name: course_id
        in: path
        schema:
          type: string
        required: true
        description: ID
      responses:
        '200':
          description: Success, no content returned
      externalDocs:
        url: https://canvas.instructure.com/doc/api/outcome_groups.html
  /v1/accounts/{account_id}/outcome_groups:
    get:
      tags:
      - Outcome Groups
      operationId: get_all_outcome_groups_for_context_accounts
      summary: Get all outcome groups for context
      description: Returns a list of all outcome groups in the specified context.
      parameters:
      - name: account_id
        in: path
        schema:
          type: string
        required: true
        description: ID
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OutcomeGroup'
      externalDocs:
        url: https://canvas.instructure.com/doc/api/outcome_groups.html
  /v1/courses/{course_id}/outcome_groups:
    get:
      tags:
      - Outcome Groups
      operationId: get_all_outcome_groups_for_context_courses
      summary: Get all outcome groups for context
      description: Returns a list of all outcome groups in the specified context.
      parameters:
      - name: course_id
        in: path
        schema:
          type: string
        required: true
        description: ID
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OutcomeGroup'
      externalDocs:
        url: https://canvas.instructure.com/doc/api/outcome_groups.html
  /v1/accounts/{account_id}/outcome_group_links:
    get:
      tags:
      - Outcome Groups
      operationId: get_all_outcome_links_for_context_accounts
      summary: Get all outcome links for context
      description: Returns a list of all outcome links in the specified context.
      parameters:
      - name: account_id
        in: path
        schema:
          type: string
        required: true
        description: ID
      - name: outcome_style
        in: query
        schema:
          type: string
        required: false
        description: 'The detail level of the outcomes. Defaults to "abbrev".

          Specify "full" for more information.'
      - name: outcome_group_style
        in: query
        schema:
          type: string
        required: false
        description: 'The detail level of the outcome groups. Defaults to "abbrev".

          Specify "full" for more information.'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OutcomeLink'
      externalDocs:
        url: https://canvas.instructure.com/doc/api/outcome_groups.html
  /v1/courses/{course_id}/outcome_group_links:
    get:
      tags:
      - Outcome Groups
      operationId: get_all_outcome_links_for_context_courses
      summary: Get all outcome links for context
      description: Returns a list of all outcome links in the specified context.
      parameters:
      - name: course_id
        in: path
        schema:
          type: string
        required: true
        description: ID
      - name: outcome_style
        in: query
        schema:
          type: string
        required: false
        description: 'The detail level of the outcomes. Defaults to "abbrev".

          Specify "full" for more information.'
      - name: outcome_group_style
        in: query
        schema:
          type: string
        required: false
        description: 'The detail level of the outcome groups. Defaults to "abbrev".

          Specify "full" for more information.'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OutcomeLink'
      externalDocs:
        url: https://canvas.instructure.com/doc/api/outcome_groups.html
  /v1/global/outcome_groups/{id}:
    get:
      tags:
      - Outcome Groups
      operationId: show_outcome_group_global
      summary: Show an outcome group
      description: Returns detailed information about a specific outcome group.
      parameters:
      - name: id
        in: path
        schema:
          type: string
        required: true
        description: ID
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutcomeGroup'
      externalDocs:
        url: https://canvas.instructure.com/doc/api/outcome_groups.html
    put:
      tags:
      - Outcome Groups
      operationId: update_outcome_group_global
      summary: Update an outcome group
      description: 'Modify an existing outcome group. Fields not provided are left as is;

        unrecognized fields are ignored.


        When changing the parent outcome group, the new parent group must belong to

        the same context as this outcome group, and must not be a descendant of

        this outcome group (i.e. no cycles allowed).'
      parameters:
      - name: id
        in: path
        schema:
          type: string
        required: true
        description: ID
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  description: The new outcome group title.
                description:
                  type: string
                  description: The new outcome group description.
                vendor_guid:
                  type: string
                  description: A custom GUID for the learning standard.
                parent_outcome_group_id:
                  type: integer
                  format: int64
                  description: The id of the new parent outcome group.
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                title:
                  type: string
                  description: The new outcome group title.
                description:
                  type: string
                  description: The new outcome group description.
                vendor_guid:
                  type: string
                  description: A custom GUID for the learning standard.
                parent_outcome_group_id:
                  type: integer
                  format: int64
                  description: The id of the new parent outcome group.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutcomeGroup'
      externalDocs:
        url: https://canvas.instructure.com/doc/api/outcome_groups.html
    delete:
      tags:
      - Outcome Groups
      operationId: delete_outcome_group_global
      summary: Delete an outcome group
      description: 'Deleting an outcome group deletes descendant outcome groups and outcome

        links. The linked outcomes themselves are only deleted if all links to the

        outcome were deleted.


        Aligned outcomes cannot be deleted; as such, if all remaining links to an

        aligned outcome are included in this group''s descendants, the group

        deletion will fail.'
      parameters:
      - name: id
        in: path
        schema:
          type: string
        required: true
        description: ID
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutcomeGroup'
      externalDocs:
        url: https://canvas.instructure.com/doc/api/outcome_groups.html
  /v1/accounts/{account_id}/outcome_groups/{id}:
    get:
      tags:
      - Outcome Groups
      operationId: show_outcome_group_accounts
