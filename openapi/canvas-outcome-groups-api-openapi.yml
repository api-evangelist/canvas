        url: https://canvas.instructure.com/doc/api/outcome_groups.html
  /v1/global/outcome_groups/{id}/outcomes:
    get:
      tags:
      - Outcome Groups
      operationId: list_linked_outcomes_global
      summary: List linked outcomes
      description: A paginated list of the immediate OutcomeLink children of the outcome group.
      parameters:
      - name: id
        in: path
        schema:
          type: string
        required: true
        description: ID
      - name: outcome_style
        in: query
        schema:
          type: string
        required: false
        description: 'The detail level of the outcomes. Defaults to "abbrev".

          Specify "full" for more information.'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OutcomeLink'
      externalDocs:
        url: https://canvas.instructure.com/doc/api/outcome_groups.html
    post:
      tags:
      - Outcome Groups
      operationId: create_link_outcome_global
      summary: Create/link an outcome
      description: 'Link an outcome into the outcome group. The outcome to link can either be

        specified by a PUT to the link URL for a specific outcome (the outcome_id

        in the PUT URLs) or by supplying the information for a new outcome (title,

        description, ratings, mastery_points) in a POST to the collection.


        If linking an existing outcome, the outcome_id must identify an outcome

        available to this context; i.e. an outcome owned by this group''s context,

        an outcome owned by an associated account, or a global outcome. With

        outcome_id present, any other parameters (except move_from) are ignored.


        If defining a new outcome, the outcome is created in the outcome group''s

        context using the provided title, description, ratings, and mastery points;

        the title is required but all other fields are optional. The new outcome

        is then linked into the outcome group.


        If ratings are provided when creating a new outcome, an embedded rubric

        criterion is included in the new outcome. This criterion''s mastery_points

        default to the maximum points in the highest rating if not specified in the

        mastery_points parameter. Any ratings lacking a description are given a

        default of "No description". Any ratings lacking a point value are given a

        default of 0. If no ratings are provided, the mastery_points parameter is

        ignored.'
      parameters:
      - name: id
        in: path
        schema:
          type: string
        required: true
        description: ID
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                outcome_id:
                  type: integer
                  format: int64
                  description: The ID of the existing outcome to link.
                move_from:
                  type: integer
                  format: int64
                  description: The ID of the old outcome group. Only used if outcome_id is present.
                title:
                  type: string
                  description: The title of the new outcome. Required if outcome_id is absent.
                display_name:
                  type: string
                  description: 'A friendly name shown in reports for outcomes with cryptic titles,

                    such as common core standards names.'
                description:
                  type: string
                  description: The description of the new outcome.
                vendor_guid:
                  type: string
                  description: A custom GUID for the learning standard.
                mastery_points:
                  type: integer
                  format: int64
                  description: The mastery threshold for the embedded rubric criterion.
                ratings[description]:
                  type: array
                  items:
                    type: string
                  description: The description of a rating level for the embedded rubric criterion.
                ratings[points]:
                  type: array
                  items:
                    type: integer
                  description: The points corresponding to a rating level for the embedded rubric criterion.
                calculation_method:
                  type: string
                  enum:
                  - weighted_average
                  - decaying_average
                  - n_mastery
                  - latest
                  - highest
                  - average
                  description: 'The new calculation method.  Defaults to "decaying_average"

                    if the Outcomes New Decaying Average Calculation Method FF is ENABLED

                    then Defaults to "weighted_average"'
                calculation_int:
                  type: integer
                  format: int64
                  description: The new calculation int.  Only applies if the calculation_method is "weighted_average", "decaying_average" or "n_mastery". Defaults to 65
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                outcome_id:
                  type: integer
                  format: int64
                  description: The ID of the existing outcome to link.
                move_from:
                  type: integer
                  format: int64
                  description: The ID of the old outcome group. Only used if outcome_id is present.
                title:
                  type: string
                  description: The title of the new outcome. Required if outcome_id is absent.
                display_name:
                  type: string
                  description: 'A friendly name shown in reports for outcomes with cryptic titles,

                    such as common core standards names.'
                description:
                  type: string
                  description: The description of the new outcome.
                vendor_guid:
                  type: string
                  description: A custom GUID for the learning standard.
                mastery_points:
                  type: integer
                  format: int64
                  description: The mastery threshold for the embedded rubric criterion.
                ratings[description]:
                  type: array
                  items:
                    type: string
                  description: The description of a rating level for the embedded rubric criterion.
                ratings[points]:
                  type: array
                  items:
                    type: integer
                  description: The points corresponding to a rating level for the embedded rubric criterion.
                calculation_method:
                  type: string
                  enum:
                  - weighted_average
                  - decaying_average
                  - n_mastery
                  - latest
                  - highest
                  - average
                  description: 'The new calculation method.  Defaults to "decaying_average"

                    if the Outcomes New Decaying Average Calculation Method FF is ENABLED

                    then Defaults to "weighted_average"'
                calculation_int:
                  type: integer
                  format: int64
                  description: The new calculation int.  Only applies if the calculation_method is "weighted_average", "decaying_average" or "n_mastery". Defaults to 65
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutcomeLink'
      externalDocs:
        url: https://canvas.instructure.com/doc/api/outcome_groups.html
