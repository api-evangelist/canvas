          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutcomeGroup'
      externalDocs:
        url: https://canvas.instructure.com/doc/api/outcome_groups.html
    put:
      tags:
      - Outcome Groups
      operationId: update_outcome_group_accounts
      summary: Update an outcome group
      description: 'Modify an existing outcome group. Fields not provided are left as is;

