                module_item[external_url]:
                  type: string
                  description: External url that the item points to. Only applies to 'ExternalUrl' type.
                module_item[new_tab]:
                  type: boolean
                  description: 'Whether the external tool opens in a new tab. Only applies to

                    ''ExternalTool'' type.'
                module_item[completion_requirement][type]:
                  type: string
                  enum:
                  - must_view
                  - must_contribute
                  - must_submit
                  - must_mark_done
                  description: 'Completion requirement for this module item.

                    "must_view": Applies to all item types

                    "must_contribute": Only applies to "Assignment", "Discussion", and "Page" types

                    "must_submit", "min_score": Only apply to "Assignment" and "Quiz" types

                    "must_mark_done": Only applies to "Assignment", "Page", and "AiExperience" types

                    Inapplicable types will be ignored'
                module_item[completion_requirement][min_score]:
                  type: integer
                  format: int64
                  description: 'Minimum score required to complete, Required for completion_requirement

