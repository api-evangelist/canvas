openapi: 3.2.0
info:
  title: Canvas LMS REST Modules API
  version: v1
  summary: The complete Canvas LMS REST API, converted from the Swagger 1.2 documents Instructure publishes under https://canvas.instructure.com/doc/api/.
  description: The Canvas LMS REST API covers courses, assignments, quizzes, grades, users, enrollments, accounts, files, modules, rubrics, submissions, SIS imports, LTI, analytics and account administration.
  contact:
    name: Instructure Canvas
    url: https://canvas.instructure.com/doc/api/
  license:
    name: AGPL-3.0
    url: https://github.com/instructure/canvas-lms/blob/master/LICENSE
servers:
- url: https://canvas.instructure.com/api
  description: Instructure-hosted Canvas (canvas.instructure.com)
- url: https://{canvas_host}/api
  description: Any Canvas instance; Canvas is multi-tenant and self-hostable, so the host is the institution's Canvas domain.
  variables:
    canvas_host:
      default: canvas.instructure.com
      description: Your institution's Canvas hostname, e.g. school.instructure.com
security:
- bearerAuth: []
- oauth2: []
tags:
- name: Modules
  x-resource: modules
  externalDocs:
    url: https://canvas.instructure.com/doc/api/modules.html
paths:
  /v1/courses/{course_id}/modules:
    get:
      tags:
      - Modules
      operationId: list_modules
      summary: List modules
      description: A paginated list of the modules in a course
      parameters:
      - name: course_id
        in: path
        schema:
          type: string
        required: true
        description: ID
      - name: include
        in: query
        schema:
          type: array
          items:
            type: string
            enum:
            - items
            - content_details
        required: false
        description: "- \"items\": Return module items inline if possible.\n  This parameter suggests that Canvas return module items directly\n  in the Module object JSON, to avoid having to make separate API\n  requests for each module when enumerating modules and items. Canvas\n  is free to omit 'items' for any particular module if it deems them\n  too numerous to return inline. Callers must be prepared to use the\n  {api:ContextModuleItemsApiController#index List Module Items API}\n  if items are not returned.\n- \"content_details\": Requires 'items'. Returns additional\n  details with module items specific to their associated content items.\n  Includes standard lock information for each item."
      - name: search_term
        in: query
        schema:
          type: string
        required: false
        description: 'The partial name of the modules (and module items, if ''items'' is

          specified with include[]) to match and return.'
      - name: student_id
        in: query
        schema:
          type: string
        required: false
        description: Returns module completion information for the student with this id.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Module__modules'
      externalDocs:
        url: https://canvas.instructure.com/doc/api/modules.html
    post:
      tags:
      - Modules
      operationId: create_module
      summary: Create a module
      description: Create and return a new module
      parameters:
      - name: course_id
        in: path
        schema:
          type: string
        required: true
        description: ID
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                module[name]:
                  type: string
                  description: The name of the module
                module[unlock_at]:
                  type: string
                  format: date-time
                  description: The date the module will unlock
                module[position]:
                  type: integer
                  format: int64
                  description: The position of this module in the course (1-based)
                module[require_sequential_progress]:
                  type: boolean
                  description: Whether module items must be unlocked in order
                module[prerequisite_module_ids]:
                  type: array
                  items:
                    type: string
                  description: 'IDs of Modules that must be completed before this one is unlocked.

                    Prerequisite modules must precede this module (i.e. have a lower position

                    value), otherwise they will be ignored'
                module[publish_final_grade]:
                  type: boolean
                  description: 'Whether to publish the student''s final grade for the course upon

                    completion of this module.'
              required:
              - module[name]
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                module[name]:
                  type: string
                  description: The name of the module
                module[unlock_at]:
                  type: string
                  format: date-time
                  description: The date the module will unlock
                module[position]:
                  type: integer
                  format: int64
                  description: The position of this module in the course (1-based)
                module[require_sequential_progress]:
                  type: boolean
                  description: Whether module items must be unlocked in order
                module[prerequisite_module_ids]:
                  type: array
                  items:
                    type: string
                  description: 'IDs of Modules that must be completed before this one is unlocked.

                    Prerequisite modules must precede this module (i.e. have a lower position

                    value), otherwise they will be ignored'
                module[publish_final_grade]:
                  type: boolean
                  description: 'Whether to publish the student''s final grade for the course upon

                    completion of this module.'
              required:
              - module[name]
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Module__modules'
      externalDocs:
        url: https://canvas.instructure.com/doc/api/modules.html
  /v1/courses/{course_id}/modules/{id}:
    get:
      tags:
      - Modules
      operationId: show_module
      summary: Show module
      description: Get information about a single module
      parameters:
      - name: course_id
        in: path
        schema:
          type: string
        required: true
        description: ID
      - name: id
        in: path
        schema:
          type: string
        required: true
        description: ID
      - name: include
        in: query
        schema:
          type: array
          items:
            type: string
            enum:
            - items
            - content_details
        required: false
        description: "- \"items\": Return module items inline if possible.\n  This parameter suggests that Canvas return module items directly\n  in the Module object JSON, to avoid having to make separate API\n  requests for each module when enumerating modules and items. Canvas\n  is free to omit 'items' for any particular module if it deems them\n  too numerous to return inline. Callers must be prepared to use the\n  {api:ContextModuleItemsApiController#index List Module Items API}\n  if items are not returned.\n- \"content_details\": Requires 'items'. Returns additional\n  details with module items specific to their associated content items.\n  Includes standard lock information for each item."
      - name: student_id
        in: query
        schema:
          type: string
        required: false
        description: Returns module completion information for the student with this id.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Module__modules'
      externalDocs:
        url: https://canvas.instructure.com/doc/api/modules.html
    put:
      tags:
      - Modules
      operationId: update_module
      summary: Update a module
      description: Update and return an existing module
      parameters:
      - name: course_id
        in: path
        schema:
          type: string
        required: true
        description: ID
      - name: id
        in: path
        schema:
          type: string
        required: true
        description: ID
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                module[name]:
                  type: string
                  description: The name of the module
                module[unlock_at]:
                  type: string
                  format: date-time
                  description: The date the module will unlock
                module[position]:
                  type: integer
                  format: int64
                  description: The position of the module in the course (1-based)
                module[require_sequential_progress]:
                  type: boolean
                  description: Whether module items must be unlocked in order
                module[prerequisite_module_ids]:
                  type: array
                  items:
                    type: string
                  description: 'IDs of Modules that must be completed before this one is unlocked

                    Prerequisite modules must precede this module (i.e. have a lower position

                    value), otherwise they will be ignored'
                module[publish_final_grade]:
                  type: boolean
                  description: 'Whether to publish the student''s final grade for the course upon

                    completion of this module.'
                module[published]:
                  type: boolean
                  description: Whether the module is published and visible to students
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                module[name]:
                  type: string
                  description: The name of the module
                module[unlock_at]:
                  type: string
                  format: date-time
                  description: The date the module will unlock
                module[position]:
                  type: integer
                  format: int64
                  description: The position of the module in the course (1-based)
                module[require_sequential_progress]:
                  type: boolean
                  description: Whether module items must be unlocked in order
                module[prerequisite_module_ids]:
                  type: array
                  items:
                    type: string
                  description: 'IDs of Modules that must be completed before this one is unlocked

                    Prerequisite modules must precede this module (i.e. have a lower position

                    value), otherwise they will be ignored'
                module[publish_final_grade]:
                  type: boolean
                  description: 'Whether to publish the student''s final grade for the course upon

                    completion of this module.'
                module[published]:
                  type: boolean
                  description: Whether the module is published and visible to students
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Module__modules'
      externalDocs:
        url: https://canvas.instructure.com/doc/api/modules.html
    delete:
      tags:
      - Modules
      operationId: delete_module
      summary: Delete module
      description: Delete a module
      parameters:
      - name: course_id
        in: path
        schema:
          type: string
        required: true
        description: ID
      - name: id
        in: path
        schema:
          type: string
        required: true
        description: ID
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Module__modules'
      externalDocs:
        url: https://canvas.instructure.com/doc/api/modules.html
  /v1/courses/{course_id}/modules/{id}/relock:
    put:
      tags:
      - Modules
      operationId: re_lock_module_progressions
      summary: Re-lock module progressions
      description: 'Resets module progressions to their default locked state and

        recalculates them based on the current requirements.


        Adding progression requirements to an active course will not lock students

        out of modules they have already unlocked unless this action is called.'
      parameters:
      - name: course_id
        in: path
        schema:
          type: string
        required: true
        description: ID
      - name: id
        in: path
        schema:
          type: string
        required: true
        description: ID
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Module__modules'
      externalDocs:
        url: https://canvas.instructure.com/doc/api/modules.html
  /v1/courses/{course_id}/modules/{module_id}/items:
    get:
      tags:
      - Modules
      operationId: list_module_items
      summary: List module items
      description: A paginated list of the items in a module
      parameters:
      - name: course_id
        in: path
        schema:
          type: string
        required: true
        description: ID
      - name: module_id
        in: path
        schema:
          type: string
        required: true
        description: ID
      - name: include
        in: query
        schema:
          type: array
          items:
            type: string
            enum:
            - content_details
        required: false
        description: 'If included, will return additional details specific to the content

          associated with each item. Refer to the {api:Modules:Module%20Item Module

          Item specification} for more details.

          Includes standard lock information for each item.'
      - name: search_term
        in: query
        schema:
          type: string
        required: false
        description: The partial title of the items to match and return.
      - name: student_id
        in: query
        schema:
          type: string
        required: false
        description: Returns module completion information for the student with this id.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ModuleItem__modules'
      externalDocs:
        url: https://canvas.instructure.com/doc/api/modules.html
    post:
      tags:
      - Modules
      operationId: create_module_item
      summary: Create a module item
      description: Create and return a new module item
      parameters:
      - name: course_id
        in: path
        schema:
          type: string
        required: true
        description: ID
      - name: module_id
        in: path
        schema:
          type: string
        required: true
        description: ID
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                module_item[title]:
                  type: string
                  description: The name of the module item and associated content
                module_item[type]:
                  type: string
                  enum:
                  - File
                  - Page
                  - Discussion
                  - Assignment
                  - Quiz
                  - SubHeader
                  - ExternalUrl
                  - ExternalTool
                  description: The type of content linked to the item
                module_item[content_id]:
                  type: string
                  description: 'The id of the content to link to the module item. Required, except for

                    ''ExternalUrl'', ''Page'', and ''SubHeader'' types.'
                module_item[position]:
                  type: integer
                  format: int64
                  description: The position of this item in the module (1-based).
                module_item[indent]:
                  type: integer
                  format: int64
                  description: 0-based indent level; module items may be indented to show a hierarchy
                module_item[page_url]:
                  type: string
                  description: 'Suffix for the linked wiki page (e.g. ''front-page''). Required for ''Page''

                    type.'
                module_item[external_url]:
                  type: string
                  description: 'External url that the item points to. [Required for ''ExternalUrl'' and

                    ''ExternalTool'' types.'
                module_item[new_tab]:
                  type: boolean
                  description: 'Whether the external tool opens in a new tab. Only applies to

                    ''ExternalTool'' type.'
                module_item[completion_requirement][type]:
                  type: string
                  enum:
                  - must_view
                  - must_contribute
                  - must_submit
                  - must_mark_done
                  description: 'Completion requirement for this module item.

                    "must_view": Applies to all item types

                    "must_contribute": Only applies to "Assignment", "Discussion", and "Page" types

                    "must_submit", "min_score": Only apply to "Assignment" and "Quiz" types

                    "must_mark_done": Only applies to "Assignment", "Page", and "AiExperience" types

                    Inapplicable types will be ignored'
                module_item[completion_requirement][min_score]:
                  type: integer
                  format: int64
                  description: 'Minimum score required to complete. Required for completion_requirement

                    type ''min_score''.'
                module_item[iframe][width]:
                  type: integer
                  format: int64
                  description: Width of the ExternalTool on launch
                module_item[iframe][height]:
                  type: integer
                  format: int64
                  description: Height of the ExternalTool on launch
              required:
              - module_item[type]
              - module_item[content_id]
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                module_item[title]:
                  type: string
                  description: The name of the module item and associated content
                module_item[type]:
                  type: string
                  enum:
                  - File
                  - Page
                  - Discussion
                  - Assignment
                  - Quiz
                  - SubHeader
                  - ExternalUrl
                  - ExternalTool
                  description: The type of content linked to the item
                module_item[content_id]:
                  type: string
                  description: 'The id of the content to link to the module item. Required, except for

                    ''ExternalUrl'', ''Page'', and ''SubHeader'' types.'
                module_item[position]:
                  type: integer
                  format: int64
                  description: The position of this item in the module (1-based).
                module_item[indent]:
                  type: integer
                  format: int64
                  description: 0-based indent level; module items may be indented to show a hierarchy
                module_item[page_url]:
                  type: string
                  description: 'Suffix for the linked wiki page (e.g. ''front-page''). Required for ''Page''

                    type.'
                module_item[external_url]:
                  type: string
                  description: 'External url that the item points to. [Required for ''ExternalUrl'' and

                    ''ExternalTool'' types.'
                module_item[new_tab]:
                  type: boolean
                  description: 'Whether the external tool opens in a new tab. Only applies to

                    ''ExternalTool'' type.'
                module_item[completion_requirement][type]:
                  type: string
                  enum:
                  - must_view
                  - must_contribute
                  - must_submit
                  - must_mark_done
                  description: 'Completion requirement for this module item.

                    "must_view": Applies to all item types

                    "must_contribute": Only applies to "Assignment", "Discussion", and "Page" types

                    "must_submit", "min_score": Only apply to "Assignment" and "Quiz" types

                    "must_mark_done": Only applies to "Assignment", "Page", and "AiExperience" types

                    Inapplicable types will be ignored'
                module_item[completion_requirement][min_score]:
                  type: integer
                  format: int64
                  description: 'Minimum score required to complete. Required for completion_requirement

                    type ''min_score''.'
                module_item[iframe][width]:
                  type: integer
                  format: int64
                  description: Width of the ExternalTool on launch
                module_item[iframe][height]:
                  type: integer
                  format: int64
                  description: Height of the ExternalTool on launch
              required:
              - module_item[type]
              - module_item[content_id]
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleItem__modules'
      externalDocs:
        url: https://canvas.instructure.com/doc/api/modules.html
  /v1/courses/{course_id}/modules/{module_id}/items/{id}:
    get:
      tags:
      - Modules
      operationId: show_module_item
      summary: Show module item
      description: Get information about a single module item
      parameters:
      - name: course_id
