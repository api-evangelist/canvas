  /v1/courses/{course_id}/modules/{module_id}/items/{id}/select_mastery_path:
    post:
      tags:
      - Modules
      operationId: select_mastery_path
      summary: Select a mastery path
      description: 'Select a mastery path when module item includes several possible paths.

        Requires Mastery Paths feature to be enabled. Returns a compound document

        with the assignments included in the given path and any module items

        related to those assignments'
      parameters:
      - name: course_id
        in: path
        schema:
          type: string
        required: true
        description: ID
      - name: module_id
        in: path
        schema:
          type: string
        required: true
        description: ID
      - name: id
        in: path
        schema:
          type: string
        required: true
        description: ID
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                assignment_set_id:
                  type: string
                  description: 'Assignment set chosen, as specified in the mastery_paths portion of the

                    context module item response'
                student_id:
                  type: string
                  description: 'Which student the selection applies to.  If not specified, current user is

                    implied.'
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                assignment_set_id:
                  type: string
                  description: 'Assignment set chosen, as specified in the mastery_paths portion of the

                    context module item response'
                student_id:
                  type: string
                  description: 'Which student the selection applies to.  If not specified, current user is

                    implied.'
      responses:
        '200':
          description: Success, no content returned
      externalDocs:
