              properties:
                assignment_overrides:
                  type: array
                  items:
                    $ref: '#/components/schemas/AssignmentOverride'
                  description: 'Attributes for the new assignment overrides.

                    See {api:AssignmentOverridesController#create Create an assignment override} for available

                    attributes'
