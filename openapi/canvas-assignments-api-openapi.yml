                  - gpa_scale
                  - points
                  - not_graded
                  description: 'The strategy used for grading the assignment.

                    The assignment defaults to "points" if this field is omitted.'
                assignment[due_at]:
                  type: string
                  format: date-time
                  description: 'The day/time the assignment is due. Must be between the lock dates if there are lock dates.

                    Accepts times in ISO 8601 format, e.g. 2014-10-21T18:48:00Z.'
                assignment[lock_at]:
                  type: string
