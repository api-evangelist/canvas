  /v1/courses/{course_id}/assignment_groups/{assignment_group_id}/assignments:
    get:
      tags:
      - Assignments
      operationId: list_assignments_assignment_groups
      summary: List assignments
      description: Returns the paginated list of assignments for the current course or assignment group.
      parameters:
      - name: course_id
        in: path
        schema:
          type: string
        required: true
        description: ID
      - name: assignment_group_id
        in: path
        schema:
          type: string
        required: true
        description: ID
      - name: include
        in: query
        schema:
          type: array
          items:
            type: string
            enum:
            - submission
            - assignment_visibility
            - all_dates
            - overrides
            - observed_users
            - can_edit
            - score_statistics
            - ab_guid
        required: false
        description: 'Optional information to include with each assignment:

          submission:: The current user''s current +Submission+

          assignment_visibility:: An array of ids of students who can see the assignment

          all_dates:: An array of +AssignmentDate+ structures, one for each override, and also a +base+ if the assignment has an "Everyone" / "Everyone Else" date

          overrides:: An array of +AssignmentOverride+ structures

          observed_users:: An array of submissions for observed users

          can_edit:: an extra Boolean value will be included with each +Assignment+ (and +AssignmentDate+ if +all_dates+ is supplied) to indicate whether the caller can edit the assignment or date. Moderated grading and closed grading periods may restrict a user''s ability to edit an assignment.

          score_statistics:: An object containing min, max, and mean score on this assignment. This will not be included for students if there are less than 5 graded assignments or if disabled by the instructor. Only valid if ''submission'' is also included.

          ab_guid:: An array of guid strings for academic benchmarks'
      - name: search_term
        in: query
        schema:
          type: string
        required: false
        description: The partial title of the assignments to match and return.
      - name: override_assignment_dates
        in: query
        schema:
          type: boolean
        required: false
        description: Apply assignment overrides for each assignment, defaults to true.
      - name: needs_grading_count_by_section
        in: query
        schema:
          type: boolean
        required: false
        description: Split up "needs_grading_count" by sections into the "needs_grading_count_by_section" key, defaults to false
      - name: bucket
        in: query
        schema:
          type: string
          enum:
          - past
          - overdue
          - undated
          - ungraded
          - unsubmitted
          - upcoming
          - future
        required: false
        description: If included, only return certain assignments depending on due date and submission status.
      - name: assignment_ids
        in: query
        schema:
          type: array
          items:
            type: string
        required: false
        description: if set, return only assignments specified
      - name: order_by
        in: query
        schema:
          type: string
          enum:
          - position
          - name
          - due_at
        required: false
        description: Determines the order of the assignments. Defaults to "position".
      - name: post_to_sis
        in: query
        schema:
          type: boolean
        required: false
        description: Return only assignments that have post_to_sis set or not set.
      - name: new_quizzes
        in: query
        schema:
          type: boolean
        required: false
        description: Return only New Quizzes assignments
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Assignment'
      externalDocs:
        url: https://canvas.instructure.com/doc/api/assignments.html
  /v1/users/{user_id}/courses/{course_id}/assignments:
    get:
      tags:
      - Assignments
      operationId: list_assignments_for_user
      summary: List assignments for user
      description: 'Returns the paginated list of assignments for the specified user if the current user has rights to view.

        See {api:AssignmentsApiController#index List assignments} for valid arguments.'
      parameters:
      - name: user_id
        in: path
        schema:
          type: string
        required: true
        description: ID
      - name: course_id
        in: path
        schema:
          type: string
        required: true
        description: ID
      responses:
        '200':
          description: Success, no content returned
      externalDocs:
        url: https://canvas.instructure.com/doc/api/assignments.html
  /v1/courses/{course_id}/assignments/{assignment_id}/duplicate:
    post:
      tags:
      - Assignments
      operationId: duplicate_assignment
      summary: Duplicate assignment
      description: Duplicate an assignment and return a json based on result_type argument.
