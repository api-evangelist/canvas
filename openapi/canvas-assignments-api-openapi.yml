      - name: course_id
        in: path
        schema:
          type: string
        required: true
        description: ID
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                assignment[name]:
                  type: string
                  description: The assignment name.
                assignment[position]:
                  type: integer
                  format: int64
                  description: 'The position of this assignment in the group when displaying

                    assignment lists.'
                assignment[submission_types]:
                  type: array
                  items:
                    type: string
                    enum:
                    - online_quiz
                    - none
                    - on_paper
                    - discussion_topic
                    - external_tool
                    - online_upload
                    - online_text_entry
                    - online_url
                    - media_recording
                    - student_annotation
                  description: "List of supported submission types for the assignment.\nUnless the assignment is allowing online submissions, the array should\nonly have one element.\n\nIf not allowing online submissions, your options are:\n  \"online_quiz\"\n  \"none\"\n  \"on_paper\"\n  \"discussion_topic\"\n  \"external_tool\"\n\nIf you are allowing online submissions, you can have one or many\nallowed submission types:\n\n  \"online_upload\"\n  \"online_text_entry\"\n  \"online_url\"\n  \"media_recording\" (Only valid when the Kaltura plugin is enabled)\n  \"student_annotation\""
                assignment[allowed_extensions]:
                  type: array
                  items:
                    type: string
                  description: "Allowed extensions if submission_types includes \"online_upload\"\n\nExample:\n  allowed_extensions: [\"docx\",\"ppt\"]"
                assignment[turnitin_enabled]:
                  type: boolean
                  description: 'Only applies when the Turnitin plugin is enabled for a course and

                    the submission_types array includes "online_upload".

                    Toggles Turnitin submissions for the assignment.

                    Will be ignored if Turnitin is not available for the course.'
                assignment[vericite_enabled]:
                  type: boolean
                  description: 'Only applies when the VeriCite plugin is enabled for a course and

                    the submission_types array includes "online_upload".

                    Toggles VeriCite submissions for the assignment.

                    Will be ignored if VeriCite is not available for the course.'
                assignment[turnitin_settings]:
                  type: string
                  description: 'Settings to send along to turnitin. See Assignment object definition for

                    format.'
                assignment[integration_data]:
                  type: string
                  description: Data used for SIS integrations. Requires admin-level token with the "Manage SIS" permission. JSON string required.
                assignment[integration_id]:
                  type: string
                  description: Unique ID from third party integrations
                assignment[peer_reviews]:
                  type: boolean
                  description: 'If submission_types does not include external_tool,discussion_topic,

                    online_quiz, or on_paper, determines whether or not peer reviews

                    will be turned on for the assignment.'
                assignment[automatic_peer_reviews]:
                  type: boolean
                  description: 'Whether peer reviews will be assigned automatically by Canvas or if

                    teachers must manually assign peer reviews. Does not apply if peer reviews

                    are not enabled.'
                assignment[notify_of_update]:
                  type: boolean
                  description: 'If true, Canvas will send a notification to students in the class

                    notifying them that the content has changed.'
                assignment[group_category_id]:
                  type: integer
                  format: int64
                  description: 'If present, the assignment will become a group assignment assigned

                    to the group.'
                assignment[grade_group_students_individually]:
                  type: integer
                  format: int64
                  description: 'If this is a group assignment, teachers have the options to grade

                    students individually. If false, Canvas will apply the assignment''s

                    score to each member of the group. If true, the teacher can manually

                    assign scores to each member of the group.'
                assignment[external_tool_tag_attributes]:
                  type: string
                  description: 'Hash of external tool parameters if submission_types is ["external_tool"].

