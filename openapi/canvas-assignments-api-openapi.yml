openapi: 3.2.0
info:
  title: Canvas LMS REST Assignments API
  version: v1
  summary: The complete Canvas LMS REST API, converted from the Swagger 1.2 documents Instructure publishes under https://canvas.instructure.com/doc/api/.
  description: The Canvas LMS REST API covers courses, assignments, quizzes, grades, users, enrollments, accounts, files, modules, rubrics, submissions, SIS imports, LTI, analytics and account administration.
  contact:
    name: Instructure Canvas
    url: https://canvas.instructure.com/doc/api/
  license:
    name: AGPL-3.0
    url: https://github.com/instructure/canvas-lms/blob/master/LICENSE
servers:
- url: https://canvas.instructure.com/api
  description: Instructure-hosted Canvas (canvas.instructure.com)
- url: https://{canvas_host}/api
  description: Any Canvas instance; Canvas is multi-tenant and self-hostable, so the host is the institution's Canvas domain.
  variables:
    canvas_host:
      default: canvas.instructure.com
      description: Your institution's Canvas hostname, e.g. school.instructure.com
security:
- bearerAuth: []
- oauth2: []
tags:
- name: Assignments
  x-resource: assignments
  externalDocs:
    url: https://canvas.instructure.com/doc/api/assignments.html
paths:
  /v1/courses/{course_id}/assignments/{id}:
    delete:
      tags:
      - Assignments
      operationId: delete_assignment
      summary: Delete an assignment
      description: Delete the given assignment.
      parameters:
      - name: course_id
        in: path
        schema:
          type: string
        required: true
        description: ID
      - name: id
        in: path
        schema:
          type: string
        required: true
        description: ID
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assignment'
      externalDocs:
        url: https://canvas.instructure.com/doc/api/assignments.html
    get:
      tags:
      - Assignments
      operationId: get_single_assignment
      summary: Get a single assignment
      description: Returns the assignment with the given id.
      parameters:
      - name: course_id
        in: path
        schema:
          type: string
        required: true
        description: ID
      - name: id
        in: path
        schema:
          type: string
        required: true
        description: ID
      - name: include
        in: query
        schema:
          type: array
          items:
            type: string
            enum:
            - submission
            - assignment_visibility
            - overrides
            - observed_users
            - can_edit
            - score_statistics
            - ab_guid
            - peer_review
            - academic_integrity_pledge
        required: false
        description: 'Associations to include with the assignment. The "assignment_visibility" option

          requires that the Differentiated Assignments course feature be turned on. If

          "observed_users" is passed, submissions for observed users will also be included.

          For "score_statistics" to be included, the "submission" option must also be set.

          The "peer_review" option returns peer review sub assignment data if it exists, regardless

          of the Peer Review Allocation and Grading feature state. If no peer review sub assignment

          exists, the feature must be enabled to receive a null value; otherwise the key is omitted.

          The "academic_integrity_pledge" option returns the account-level academic integrity

          pledge text a student must accept before submitting this assignment. The key is only

          present when the pledge is enabled for the account; when present but the pledge does not

          apply to this assignment (e.g. external tool assignments or Canvas Career courses) the

          value is null.'
      - name: override_assignment_dates
        in: query
        schema:
          type: boolean
        required: false
        description: Apply assignment overrides to the assignment, defaults to true.
      - name: needs_grading_count_by_section
        in: query
        schema:
          type: boolean
        required: false
        description: Split up "needs_grading_count" by sections into the "needs_grading_count_by_section" key, defaults to false
      - name: all_dates
        in: query
        schema:
          type: boolean
        required: false
        description: All dates associated with the assignment, if applicable
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assignment'
      externalDocs:
        url: https://canvas.instructure.com/doc/api/assignments.html
    put:
      tags:
      - Assignments
      operationId: edit_assignment
      summary: Edit an assignment
      description: Modify an existing assignment.
      parameters:
      - name: course_id
        in: path
        schema:
          type: string
        required: true
        description: ID
      - name: id
        in: path
        schema:
          type: string
        required: true
        description: ID
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                assignment[name]:
                  type: string
                  description: The assignment name.
                assignment[position]:
                  type: integer
                  format: int64
                  description: 'The position of this assignment in the group when displaying

                    assignment lists.'
                assignment[submission_types]:
                  type: array
                  items:
                    type: string
                  description: Only applies if the assignment doesn't have student submissions.
                  deprecated: true
                assignment[allowed_extensions]:
                  type: array
                  items:
                    type: string
                  description: "Allowed extensions if submission_types includes \"online_upload\"\n\nExample:\n  allowed_extensions: [\"docx\",\"ppt\"]"
                assignment[turnitin_enabled]:
                  type: boolean
                  description: 'Only applies when the Turnitin plugin is enabled for a course and

                    the submission_types array includes "online_upload".

                    Toggles Turnitin submissions for the assignment.

                    Will be ignored if Turnitin is not available for the course.'
                assignment[vericite_enabled]:
                  type: boolean
                  description: 'Only applies when the VeriCite plugin is enabled for a course and

                    the submission_types array includes "online_upload".

                    Toggles VeriCite submissions for the assignment.

                    Will be ignored if VeriCite is not available for the course.'
                assignment[turnitin_settings]:
                  type: string
                  description: 'Settings to send along to turnitin. See Assignment object definition for

                    format.'
                assignment[sis_assignment_id]:
                  type: string
                  description: The sis id of the Assignment
                assignment[integration_data]:
                  type: string
                  description: Data used for SIS integrations. Requires admin-level token with the "Manage SIS" permission. JSON string required.
                assignment[integration_id]:
                  type: string
                  description: Unique ID from third party integrations
                assignment[peer_reviews]:
                  type: boolean
                  description: 'If submission_types does not include external_tool,discussion_topic,

                    online_quiz, or on_paper, determines whether or not peer reviews

                    will be turned on for the assignment.'
                assignment[automatic_peer_reviews]:
                  type: boolean
                  description: 'Whether peer reviews will be assigned automatically by Canvas or if

                    teachers must manually assign peer reviews. Does not apply if peer reviews

                    are not enabled.'
                assignment[notify_of_update]:
                  type: boolean
                  description: 'If true, Canvas will send a notification to students in the class

                    notifying them that the content has changed.'
                assignment[group_category_id]:
                  type: integer
                  format: int64
                  description: 'If present, the assignment will become a group assignment assigned

                    to the group.'
                assignment[grade_group_students_individually]:
                  type: integer
                  format: int64
                  description: 'If this is a group assignment, teachers have the options to grade

                    students individually. If false, Canvas will apply the assignment''s

                    score to each member of the group. If true, the teacher can manually

                    assign scores to each member of the group.'
                assignment[external_tool_tag_attributes]:
                  type: string
                  description: 'Hash of external tool parameters if submission_types is ["external_tool"].

                    See Assignment object definition for format.'
                assignment[points_possible]:
                  type: number
                  description: The maximum points possible on the assignment.
                assignment[grading_type]:
                  type: string
                  enum:
                  - pass_fail
                  - percent
                  - letter_grade
                  - gpa_scale
                  - points
                  - not_graded
                  description: 'The strategy used for grading the assignment.

                    The assignment defaults to "points" if this field is omitted.'
                assignment[due_at]:
                  type: string
                  format: date-time
                  description: 'The day/time the assignment is due.

                    Accepts times in ISO 8601 format, e.g. 2014-10-21T18:48:00Z.'
                assignment[lock_at]:
                  type: string
                  format: date-time
                  description: 'The day/time the assignment is locked after. Must be after the due date if there is a due date.

                    Accepts times in ISO 8601 format, e.g. 2014-10-21T18:48:00Z.'
                assignment[unlock_at]:
                  type: string
                  format: date-time
                  description: 'The day/time the assignment is unlocked. Must be before the due date if there is a due date.

                    Accepts times in ISO 8601 format, e.g. 2014-10-21T18:48:00Z.'
                assignment[description]:
                  type: string
                  description: The assignment's description, supports HTML.
                assignment[assignment_group_id]:
                  type: integer
                  format: int64
                  description: 'The assignment group id to put the assignment in.

                    Defaults to the top assignment group in the course.'
                assignment[assignment_overrides]:
                  type: array
                  items:
                    $ref: '#/components/schemas/AssignmentOverride'
                  description: 'List of overrides for the assignment.

                    If the +assignment[assignment_overrides]+ key is absent, any existing

                    overrides are kept as is. If the +assignment[assignment_overrides]+ key is

                    present, existing overrides are updated or deleted (and new ones created,

                    as necessary) to match the provided list.'
                assignment[only_visible_to_overrides]:
                  type: boolean
                  description: 'Whether this assignment is only visible to overrides

                    (Only useful if ''differentiated assignments'' account setting is on)'
                assignment[published]:
                  type: boolean
                  description: 'Whether this assignment is published.

                    (Only useful if ''draft state'' account setting is on)

                    Unpublished assignments are not visible to students.'
                assignment[grading_standard_id]:
                  type: integer
                  format: int64
                  description: 'The grading standard id to set for the course.  If no value is provided for this argument the current grading_standard will be un-set from this course.

                    This will update the grading_type for the course to ''letter_grade'' unless it is already ''gpa_scale''.'
                assignment[omit_from_final_grade]:
                  type: boolean
                  description: Whether this assignment is counted towards a student's final grade.
                assignment[hide_in_gradebook]:
                  type: boolean
                  description: Whether this assignment is shown in the gradebook.
                assignment[moderated_grading]:
                  type: boolean
                  description: Whether this assignment is moderated.
                assignment[grader_count]:
                  type: integer
                  format: int64
                  description: 'The maximum number of provisional graders who may issue grades for this

                    assignment. Only relevant for moderated assignments. Must be a positive

                    value, and must be set to 1 if the course has fewer than two active

                    instructors. Otherwise, the maximum value is the number of active

                    instructors in the course minus one, or 10 if the course has more than 11

                    active instructors.'
                assignment[final_grader_id]:
                  type: integer
                  format: int64
                  description: 'The user ID of the grader responsible for choosing final grades for this

                    assignment. Only relevant for moderated assignments.'
                assignment[grader_comments_visible_to_graders]:
                  type: boolean
                  description: 'Boolean indicating if provisional graders'' comments are visible to other

                    provisional graders. Only relevant for moderated assignments.'
                assignment[graders_anonymous_to_graders]:
                  type: boolean
                  description: 'Boolean indicating if provisional graders'' identities are hidden from

                    other provisional graders. Only relevant for moderated assignments.'
                assignment[graders_names_visible_to_final_grader]:
                  type: boolean
                  description: 'Boolean indicating if provisional grader identities are visible to the

                    the final grader. Only relevant for moderated assignments.'
                assignment[anonymous_grading]:
                  type: boolean
                  description: 'Boolean indicating if the assignment is graded anonymously. If true,

                    graders cannot see student identities.'
                assignment[allowed_attempts]:
                  type: integer
                  format: int64
                  description: 'The number of submission attempts allowed for this assignment. Set to -1 or null for

                    unlimited attempts.'
                assignment[annotatable_attachment_id]:
                  type: integer
                  format: int64
                  description: 'The Attachment ID of the document being annotated.


                    Only applies when submission_types includes "student_annotation".'
                assignment[asset_processors]:
                  type: array
                  items:
                    type: array
                    items: {}
                  description: 'Document processors for this assignment. New document processors can only be added

                    via the interactive LTI Deep Linking flow (in a browser), not via API token or JWT authentication.

                    Deletion of document processors (passing an empty array) is allowed via API.'
                assignment[force_updated_at]:
                  type: boolean
                  description: If true, updated_at will be set even if no changes were made.
                assignment[peer_review][points_possible]:
                  type: number
                  description: The maximum points possible for peer reviews.
                assignment[peer_review][grading_type]:
                  type: string
                  enum:
                  - pass_fail
                  - percent
                  - letter_grade
                  - gpa_scale
                  - points
                  description: 'The strategy used for grading peer reviews.

                    Defaults to "points" if this field is omitted.'
                assignment[peer_review][due_at]:
                  type: string
                  format: date-time
                  description: 'The day/time the peer reviews are due. Must be between the lock dates if there are lock dates.

                    Accepts times in ISO 8601 format, e.g. 2025-08-20T12:10:00Z.'
                assignment[peer_review][lock_at]:
                  type: string
                  format: date-time
                  description: 'The day/time the peer reviews are locked after. Must be after the due date if there is a due date.

                    Accepts times in ISO 8601 format, e.g. 2025-08-25T12:10:00Z.'
                assignment[peer_review][unlock_at]:
                  type: string
                  format: date-time
                  description: 'The day/time the peer reviews are unlocked. Must be before the due date if there is a due date.

                    Accepts times in ISO 8601 format, e.g. 2025-08-15T12:10:00Z.'
                assignment[peer_review][peer_review_overrides]:
                  type: array
                  items:
                    $ref: '#/components/schemas/AssignmentOverride'
                  description: 'List of overrides for the peer reviews.

                    When updating overrides:

                    - Include "id" to update an existing override

                    - Omit "id" to create a new override

                    - Omit an override from the list to delete it'
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                assignment[name]:
                  type: string
                  description: The assignment name.
                assignment[position]:
