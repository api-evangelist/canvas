      operationId: batch_update_overrides_in_course
      summary: Batch update overrides in a course
      description: 'Updates a list of specified overrides for each assignment. Handles overrides

        in a transaction, so either all updates are applied or none.

        See {api:AssignmentOverridesController#update Update an assignment override} for

        available attributes.


        All current overridden values must be supplied if they are to be retained;

        e.g. if due_at was overridden, but this PUT omits a value for due_at,

        due_at will no longer be overridden. If the override is adhoc and

        student_ids is not supplied, the target override set is unchanged. Target

        override sets cannot be changed for group or section overrides.


        Errors are reported in an errors attribute, an array of errors corresponding

        to inputs. Global errors will be reported as a single element errors array'
      parameters:
      - name: course_id
        in: path
        schema:
          type: string
        required: true
        description: ID
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                assignment_overrides:
                  type: array
                  items:
                    $ref: '#/components/schemas/AssignmentOverride'
                  description: Attributes for the updated overrides.
              required:
              - assignment_overrides
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                assignment_overrides:
                  type: array
                  items:
                    $ref: '#/components/schemas/AssignmentOverride'
                  description: Attributes for the updated overrides.
              required:
              - assignment_overrides
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AssignmentOverride'
      externalDocs:
        url: https://canvas.instructure.com/doc/api/assignments.html
components:
  schemas:
    AssignmentOverride:
      type: object
      properties:
        id:
          type: integer
          example: 4
          description: the ID of the assignment override
        assignment_id:
          type: integer
          example: 123
          description: the ID of the assignment the override applies to (present if the override applies to an assignment)
        quiz_id:
          type: integer
          example: 123
          description: the ID of the quiz the override applies to (present if the override applies to a quiz)
        context_module_id:
          type: integer
          example: 123
          description: the ID of the module the override applies to (present if the override applies to a module)
        discussion_topic_id:
          type: integer
          example: 123
          description: the ID of the discussion the override applies to (present if the override applies to an ungraded discussion)
        wiki_page_id:
          type: integer
          example: 123
          description: the ID of the page the override applies to (present if the override applies to a page)
        attachment_id:
          type: integer
          example: 123
          description: the ID of the file the override applies to (present if the override applies to a file)
        student_ids:
          type: array
          items:
            type: integer
          example:
          - 1
          - 2
          - 3
          description: the IDs of the override's target students (present if the override targets an ad-hoc set of students)
        group_id:
          type: integer
          example: 2
          description: the ID of the override's target group (present if the override targets a group and the assignment is a group assignment)
        course_section_id:
          type: integer
          example: 1
          description: the ID of the overrides's target section (present if the override targets a section)
        title:
          type: string
          example: an assignment override
          description: the title of the override
        due_at:
          type: string
          format: date-time
          example: '2012-07-01T23:59:00-06:00'
          description: the overridden due at (present if due_at is overridden)
        all_day:
          type: boolean
          example: true
          description: the overridden all day flag (present if due_at is overridden)
        all_day_date:
          type: string
          format: date-time
          example: '2012-07-01'
          description: the overridden all day date (present if due_at is overridden)
        unlock_at:
          type: string
          format: date-time
          example: '2012-07-01T23:59:00-06:00'
          description: the overridden unlock at (present if unlock_at is overridden)
        lock_at:
          type: string
          format: date-time
          example: '2012-07-01T23:59:00-06:00'
          description: the overridden lock at, if any (present if lock_at is overridden)
    NeedsGradingCount:
      type: object
      properties:
        section_id:
          type: string
          example: '123456'
          description: The section ID
        needs_grading_count:
          type: integer
          example: 5
          description: Number of submissions that need grading
      description: Used by Assignment model
    Assignment:
      type: object
      properties:
        id:
          type: integer
          example: 4
          description: the ID of the assignment
        name:
          type: string
          example: some assignment
          description: the name of the assignment
        description:
          type: string
          example: <p>Do the following:</p>...
          description: the assignment description, in an HTML fragment
        created_at:
          type: string
          format: date-time
          example: '2012-07-01T23:59:00-06:00'
          description: The time at which this assignment was originally created
        updated_at:
          type: string
          format: date-time
          example: '2012-07-01T23:59:00-06:00'
          description: The time at which this assignment was last modified in any way
        due_at:
          type: string
          format: date-time
          example: '2012-07-01T23:59:00-06:00'
          description: 'the due date for the assignment. returns null if not present. NOTE: If this assignment has assignment overrides, this field will be the due date as it applies to the user requesting information from the API.'
        lock_at:
