      operationId: bind_lti_registration_to_root_account_lti_registrations
      summary: Bind an LTI Registration to a Root Account
      description: 'Enable or disable the specified LTI registration for the specified root account.

        To enable an inherited registration (eg from Site Admin), pass the registration''s global ID.


        Only allowed for root accounts.


        Specifics for centrally-managed/federated consortia:

        Child root accounts may not bind inherited registrations.

        For parent root account, binding also applies to all child root accounts.'
      parameters:
      - name: account_id
        in: path
        schema:
          type: string
        required: true
        description: ID
      - name: id
        in: path
        schema:
          type: string
        required: true
        description: ID
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                workflow_state:
                  type: string
                  enum:
                  - 'on'
                  - 'off'
                  description: The desired state for this registration/account binding.
              required:
              - workflow_state
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                workflow_state:
                  type: string
                  enum:
                  - 'on'
                  - 'off'
                  description: The desired state for this registration/account binding.
              required:
              - workflow_state
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lti__RegistrationAccountBinding'
      externalDocs:
        url: https://canvas.instructure.com/doc/api/lti_registrations.html
    delete:
      tags:
      - Lti Registrations
      operationId: remove_inherited_lti_registration_lti_registrations
      summary: Remove an Inherited LTI Registration
      description: 'Deletes the account binding for this registration, effectively removing it from the account.


        Only available when the lti_deactivate_registrations feature flag is enabled.

        Only valid for inherited (Site Admin) registrations — use destroy for registrations owned by this account.'
