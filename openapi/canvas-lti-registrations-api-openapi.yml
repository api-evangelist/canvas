      summary: Update an LTI Registration
      description: 'Update the specified LTI registration with the provided parameters. Note that updating the base tool configuration

        of a registration that is associated with a Dynamic Registration will return a 422. All other fields can be updated

        freely.'
      parameters:
      - name: account_id
        in: path
        schema:
          type: string
        required: true
        description: ID
      - name: id
        in: path
        schema:
          type: string
        required: true
        description: ID
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: The name of the tool
                admin_nickname:
                  type: string
                  description: The admin-configured friendly display name for the registration
                description:
                  type: string
                  description: A description of the tool. Cannot exceed 2048 bytes.
                configuration:
                  type: string
                  description: '[Lti::ToolConfiguration | Lti::LegacyConfiguration] The LTI 1.3 configuration for the tool. Note that updating the base tool configuration of a registration associated with a Dynamic Registration is not allowed.'
                overlay:
                  type: string
                  description: '[Lti::Overlay] The overlay configuration for the tool. Overrides values in the base configuration. Note that updating the overlay of a registration associated with a Dynamic Registration IS allowed.'
                workflow_state:
                  type: string
                  enum:
                  - 'on'
                  - 'off'
                  - allow
                  - active
                  - inactive
                  description: '"on"/"off"/"allow" set the account binding state directly (binding vocabulary) and will be deprecated soon.

                    "active"/"inactive" set the registration state directly (registration vocabulary).

                    All five values update both the binding and the registration to equivalent states.

                    "allow" is only valid for Site Admin registrations.'
                comment:
                  type: string
                  description: A comment explaining why this change was made. Cannot exceed 2000 characters.
                lock_deploying:
                  type: boolean
                  description: When true, no new deployments of this registration can be created.
