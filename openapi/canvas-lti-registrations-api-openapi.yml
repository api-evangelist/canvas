openapi: 3.2.0
info:
  title: Canvas LMS REST Lti Registrations API
  version: v1
  summary: The complete Canvas LMS REST API, converted from the Swagger 1.2 documents Instructure publishes under https://canvas.instructure.com/doc/api/.
  description: The Canvas LMS REST API covers courses, assignments, quizzes, grades, users, enrollments, accounts, files, modules, rubrics, submissions, SIS imports, LTI, analytics and account administration.
  contact:
    name: Instructure Canvas
    url: https://canvas.instructure.com/doc/api/
  license:
    name: AGPL-3.0
    url: https://github.com/instructure/canvas-lms/blob/master/LICENSE
servers:
- url: https://canvas.instructure.com/api
  description: Instructure-hosted Canvas (canvas.instructure.com)
- url: https://{canvas_host}/api
  description: Any Canvas instance; Canvas is multi-tenant and self-hostable, so the host is the institution's Canvas domain.
  variables:
    canvas_host:
      default: canvas.instructure.com
      description: Your institution's Canvas hostname, e.g. school.instructure.com
security:
- bearerAuth: []
- oauth2: []
tags:
- name: Lti Registrations
  x-resource: lti_registrations
  externalDocs:
    url: https://canvas.instructure.com/doc/api/lti_registrations.html
paths:
  /v1/accounts/{account_id}/lti_registrations:
    get:
      tags:
      - Lti Registrations
      operationId: list_lti_registrations_in_account_lti_registrations
      summary: List LTI Registrations in an account
      description: 'Returns all LTI registrations in the specified account.

        Includes registrations created in this account, those set to ''allow'' from a

        parent root account (like Site Admin) and ''on'' for this account,

        and those enabled ''on'' at the parent root account level.'
      parameters:
      - name: account_id
        in: path
        schema:
          type: string
        required: true
        description: ID
      - name: per_page
        in: query
        schema:
          type: integer
          format: int64
        required: false
        description: The number of registrations to return per page. Defaults to 15.
      - name: page
        in: query
        schema:
          type: integer
          format: int64
        required: false
        description: The page number to return. Defaults to 1.
      - name: sort
        in: query
        schema:
          type: string
        required: false
        description: 'The field to sort by. Choices are: name, nickname, lti_version, installed,

          installed_by, updated_by, updated, and on. Defaults to installed.'
      - name: dir
        in: query
        schema:
          type: string
          enum:
          - asc
          - desc
        required: false
        description: The order to sort the given column by. Defaults to desc.
      - name: include
        in: query
        schema:
          type: array
          items:
            type: string
        required: false
        description: 'Array of additional data to include. Always includes [account_binding].


          "account_binding":: the registration''s binding to the given account

          "configuration":: the registration''s Canvas-style tool configuration, without any overlays applied.

          "overlaid_configuration":: the registration''s Canvas-style tool configuration, with all overlays applied.

          "overlay":: the registration''s admin-defined configuration overlay'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListLtiRegistrationsResponse'
      externalDocs:
        url: https://canvas.instructure.com/doc/api/lti_registrations.html
    post:
      tags:
      - Lti Registrations
      operationId: create_lti_registration_lti_registrations
      summary: Create an LTI Registration
      description: 'Create a new LTI Registration, as well as an associated Tool Configuration, Developer Key, and Registration Account

        binding.

        To install/create using Dynamic Registration, please use the

        {file:file.registration.html Dynamic Registration API}.'
      parameters:
      - name: account_id
        in: path
        schema:
          type: string
        required: true
        description: ID
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: The name of the tool. If one isn't provided, it will be inferred from the configuration's title.
                admin_nickname:
                  type: string
                  description: A friendly nickname set by admins to override the tool name
                vendor:
                  type: string
                  description: The vendor of the tool
                description:
                  type: string
                  description: A description of the tool. Cannot exceed 2048 bytes.
                configuration:
                  type: string
                  description: '[Required, Lti::ToolConfiguration | Lti::LegacyConfiguration] The LTI 1.3 configuration for the tool'
                overlay:
                  type: string
                  description: '[Lti::Overlay] The overlay configuration for the tool. Overrides values in the base configuration.'
                unified_tool_id:
                  type: string
                  description: The unique identifier for the tool, used for analytics. If not provided, one will be generated.
                lock_deploying:
                  type: boolean
                  description: When true, no new deployments of this registration can be created.
                workflow_state:
                  type: string
                  enum:
                  - 'on'
                  - 'off'
                  - allow
                  - active
                  - inactive
                  description: '"on"/"off"/"allow" set the account binding state directly (binding vocabulary).

                    "active"/"inactive" set the registration state directly (registration vocabulary).

                    All five values update both the binding and the registration to equivalent states.

                    "allow" is only valid for Site Admin registrations. Defaults to "off".'
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: The name of the tool. If one isn't provided, it will be inferred from the configuration's title.
                admin_nickname:
                  type: string
                  description: A friendly nickname set by admins to override the tool name
                vendor:
                  type: string
                  description: The vendor of the tool
                description:
                  type: string
                  description: A description of the tool. Cannot exceed 2048 bytes.
                configuration:
                  type: string
                  description: '[Required, Lti::ToolConfiguration | Lti::LegacyConfiguration] The LTI 1.3 configuration for the tool'
                overlay:
                  type: string
                  description: '[Lti::Overlay] The overlay configuration for the tool. Overrides values in the base configuration.'
                unified_tool_id:
                  type: string
                  description: The unique identifier for the tool, used for analytics. If not provided, one will be generated.
                lock_deploying:
                  type: boolean
                  description: When true, no new deployments of this registration can be created.
                workflow_state:
                  type: string
                  enum:
                  - 'on'
                  - 'off'
                  - allow
                  - active
                  - inactive
                  description: '"on"/"off"/"allow" set the account binding state directly (binding vocabulary).

                    "active"/"inactive" set the registration state directly (registration vocabulary).

                    All five values update both the binding and the registration to equivalent states.

                    "allow" is only valid for Site Admin registrations. Defaults to "off".'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lti__Registration'
      externalDocs:
        url: https://canvas.instructure.com/doc/api/lti_registrations.html
