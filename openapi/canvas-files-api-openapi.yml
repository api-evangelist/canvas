openapi: 3.2.0
info:
  title: Canvas LMS REST Files API
  version: v1
  summary: The complete Canvas LMS REST API, converted from the Swagger 1.2 documents Instructure publishes under https://canvas.instructure.com/doc/api/.
  description: The Canvas LMS REST API covers courses, assignments, quizzes, grades, users, enrollments, accounts, files, modules, rubrics, submissions, SIS imports, LTI, analytics and account administration.
  contact:
    name: Instructure Canvas
    url: https://canvas.instructure.com/doc/api/
  license:
    name: AGPL-3.0
    url: https://github.com/instructure/canvas-lms/blob/master/LICENSE
servers:
- url: https://canvas.instructure.com/api
  description: Instructure-hosted Canvas (canvas.instructure.com)
- url: https://{canvas_host}/api
  description: Any Canvas instance; Canvas is multi-tenant and self-hostable, so the host is the institution's Canvas domain.
  variables:
    canvas_host:
      default: canvas.instructure.com
      description: Your institution's Canvas hostname, e.g. school.instructure.com
security:
- bearerAuth: []
- oauth2: []
tags:
- name: Files
  x-resource: files
  externalDocs:
    url: https://canvas.instructure.com/doc/api/files.html
paths:
  /v1/courses/{course_id}/files:
    get:
      tags:
      - Files
      operationId: list_files_courses
      summary: List files
      description: Returns the paginated list of files for the folder or course.
      parameters:
      - name: course_id
        in: path
        schema:
          type: string
        required: true
        description: ID
      - name: content_types
        in: query
        schema:
          type: array
          items:
            type: string
        required: false
        description: 'Filter results by content-type. You can specify type/subtype pairs (e.g.,

          ''image/jpeg''), or simply types (e.g., ''image'', which will match

          ''image/gif'', ''image/jpeg'', etc.).'
      - name: exclude_content_types
        in: query
        schema:
          type: array
          items:
            type: string
        required: false
        description: 'Exclude given content-types from your results. You can specify type/subtype pairs (e.g.,

          ''image/jpeg''), or simply types (e.g., ''image'', which will match

          ''image/gif'', ''image/jpeg'', etc.).'
      - name: search_term
        in: query
        schema:
          type: string
        required: false
        description: The partial name of the files to match and return.
      - name: include
        in: query
        schema:
          type: array
          items:
            type: string
            enum:
            - user
        required: false
        description: 'Array of additional information to include.


          "user":: the user who uploaded the file or last edited its content

          "usage_rights":: copyright and license information for the file (see UsageRights)'
      - name: only
        in: query
        schema:
          type: array
          items:
            type: array
            items: {}
        required: false
        description: 'Array of information to restrict to. Overrides include[]


          "names":: only returns file name information'
      - name: sort
        in: query
        schema:
          type: string
          enum:
          - name
          - size
          - created_at
          - updated_at
          - content_type
          - user
        required: false
        description: Sort results by this field. Defaults to 'name'. Note that `sort=user` implies `include[]=user`.
      - name: order
        in: query
        schema:
          type: string
          enum:
          - asc
          - desc
        required: false
        description: The sorting order. Defaults to 'asc'.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/File__files'
      externalDocs:
        url: https://canvas.instructure.com/doc/api/files.html
  /v1/courses/{course_id}/files/quota:
    get:
      tags:
      - Files
      operationId: get_quota_information_courses
      summary: Get quota information
      description: Returns the total and used storage quota for the course, group, or user.
      parameters:
      - name: course_id
        in: path
        schema:
          type: string
        required: true
        description: ID
      responses:
        '200':
          description: Success, no content returned
      externalDocs:
        url: https://canvas.instructure.com/doc/api/files.html
