components:
  schemas:
    File__files:
      type: object
      properties:
        id:
          type: integer
          example: 569
        folder_id:
          type: integer
          example: 4207
        display_name:
          type: string
          example: file.txt
        filename:
          type: string
          example: file.txt
        content-type:
          type: string
          example: text/plain
        url:
          type: string
          example: http://www.example.com/files/569/download?download_frd=1
        size:
          type: integer
