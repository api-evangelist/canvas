  /v1/files/{id}:
    get:
      tags:
      - Files
      operationId: get_file_files
      summary: Get file
      description: Returns the standard attachment json object
      parameters:
      - name: id
        in: path
        schema:
          type: string
        required: true
        description: ID
      - name: include
        in: query
        schema:
          type: array
          items:
            type: string
            enum:
            - user
        required: false
        description: 'Array of additional information to include.


          "user":: the user who uploaded the file or last edited its content

          "usage_rights":: copyright and license information for the file (see UsageRights)'
      - name: replacement_chain_context_type
        in: query
        schema:
          type: string
        required: false
        description: '[DEPRECATED] When a user replaces a file during upload, Canvas keeps track of the "replacement chain."


          Include this parameter if you wish Canvas to follow the replacement chain if the requested

          file was deleted and replaced by another.


          Must be set to ''course'' or ''account''. The "replacement_chain_context_id" parameter must

          also be included.'
      - name: replacement_chain_context_id
        in: query
        schema:
          type: integer
          format: int64
        required: false
        description: '[DEPRECATED] When a user replaces a file during upload, Canvas keeps track of the "replacement chain."


          Include this parameter if you wish Canvas to follow the replacement chain if the requested

          file was deleted and replaced by another.


          Indicates the context ID Canvas should use when following the "replacement chain." The

          "replacement_chain_context_type" parameter must also be included.'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: string
                format: binary
      externalDocs:
        url: https://canvas.instructure.com/doc/api/files.html
    put:
      tags:
      - Files
      operationId: update_file
      summary: Update file
      description: Update some settings on the specified file
      parameters:
      - name: id
        in: path
        schema:
          type: string
        required: true
        description: ID
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: The new display name of the file, with a limit of 255 characters.
                parent_folder_id:
                  type: string
                  description: 'The id of the folder to move this file into.

                    The new folder must be in the same context as the original parent folder.

                    If the file is in a context without folders this does not apply.'
                on_duplicate:
                  type: string
                  enum:
                  - overwrite
                  - rename
                  description: 'If the file is moved to a folder containing a file with the same name,

                    or renamed to a name matching an existing file, the API call will fail

                    unless this parameter is supplied.


                    "overwrite":: Replace the existing file with the same name

                    "rename":: Add a qualifier to make the new filename unique'
                lock_at:
                  type: string
                  format: date-time
                  description: The datetime to lock the file at
                unlock_at:
                  type: string
                  format: date-time
                  description: The datetime to unlock the file at
                locked:
                  type: boolean
                  description: Flag the file as locked
                hidden:
                  type: boolean
                  description: Flag the file as hidden
                visibility_level:
                  type: string
                  description: Configure which roles can access this file
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: The new display name of the file, with a limit of 255 characters.
                parent_folder_id:
                  type: string
                  description: 'The id of the folder to move this file into.

                    The new folder must be in the same context as the original parent folder.

                    If the file is in a context without folders this does not apply.'
                on_duplicate:
                  type: string
                  enum:
                  - overwrite
                  - rename
                  description: 'If the file is moved to a folder containing a file with the same name,

                    or renamed to a name matching an existing file, the API call will fail

                    unless this parameter is supplied.


                    "overwrite":: Replace the existing file with the same name

                    "rename":: Add a qualifier to make the new filename unique'
                lock_at:
                  type: string
                  format: date-time
                  description: The datetime to lock the file at
                unlock_at:
                  type: string
                  format: date-time
                  description: The datetime to unlock the file at
                locked:
                  type: boolean
                  description: Flag the file as locked
                hidden:
                  type: boolean
                  description: Flag the file as hidden
                visibility_level:
                  type: string
                  description: Configure which roles can access this file
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: string
                format: binary
      externalDocs:
        url: https://canvas.instructure.com/doc/api/files.html
    delete:
      tags:
      - Files
      operationId: delete_file
      summary: Delete file
      description: 'Remove the specified file. Unlike most other DELETE endpoints, using this

        endpoint will result in comprehensive, irretrievable destruction of the file.

        It should be used with the `replace` parameter set to true in cases where the

        file preview also needs to be destroyed (such as to remove files that violate

        privacy laws).'
      parameters:
      - name: id
        in: path
        schema:
          type: string
        required: true
        description: ID
      - name: replace
        in: query
        schema:
          type: boolean
        required: false
        description: 'This action is irreversible.

          If replace is set to true the file contents will be replaced with a

          generic "file has been removed" file. This also destroys any previews

          that have been generated for the file.

          Must have manage files and become other users permissions'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: string
                format: binary
      externalDocs:
        url: https://canvas.instructure.com/doc/api/files.html
