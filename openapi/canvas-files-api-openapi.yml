  /v1/folders/{folder_id}/files:
    post:
      tags:
      - Files
      operationId: upload_file_files
      summary: Upload a file
      description: 'Upload a file to a folder.


        This API endpoint is the first step in uploading a file.

        See the {file:file.file_uploads.html File Upload Documentation} for details on

        the file upload workflow.


        Only those with the "Manage Files" permission on a course or group can

        upload files to a folder in that course or group.'
      parameters:
      - name: folder_id
        in: path
        schema:
          type: string
        required: true
        description: ID
      responses:
        '200':
          description: Success, no content returned
      externalDocs:
        url: https://canvas.instructure.com/doc/api/files.html
  /v1/folders/{dest_folder_id}/copy_file:
    post:
      tags:
      - Files
      operationId: copy_file
      summary: Copy a file
      description: 'Copy a file from elsewhere in Canvas into a folder.


        Copying a file across contexts (between courses and users) is permitted,

        but the source and destination must belong to the same institution.'
      parameters:
      - name: dest_folder_id
        in: path
        schema:
          type: string
        required: true
        description: ID
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                source_file_id:
                  type: string
                  description: The id of the source file
                on_duplicate:
                  type: string
                  enum:
                  - overwrite
                  - rename
                  description: 'What to do if a file with the same name already exists at the destination.

                    If such a file exists and this parameter is not given, the call will fail.


                    "overwrite":: Replace an existing file with the same name

                    "rename":: Add a qualifier to make the new filename unique'
              required:
              - source_file_id
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                source_file_id:
                  type: string
                  description: The id of the source file
                on_duplicate:
                  type: string
                  enum:
                  - overwrite
                  - rename
                  description: 'What to do if a file with the same name already exists at the destination.

                    If such a file exists and this parameter is not given, the call will fail.


                    "overwrite":: Replace an existing file with the same name

                    "rename":: Add a qualifier to make the new filename unique'
              required:
              - source_file_id
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: string
                format: binary
      externalDocs:
        url: https://canvas.instructure.com/doc/api/files.html
  /v1/folders/{dest_folder_id}/copy_folder:
    post:
      tags:
      - Files
      operationId: copy_folder
      summary: Copy a folder
      description: 'Copy a folder (and its contents) from elsewhere in Canvas into a folder.


        Copying a folder across contexts (between courses and users) is permitted,

        but the source and destination must belong to the same institution.

        If the source and destination folders are in the same context, the

        source folder may not contain the destination folder. A folder will be

        renamed at its destination if another folder with the same name already

        exists.'
      parameters:
      - name: dest_folder_id
        in: path
        schema:
          type: string
        required: true
        description: ID
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                source_folder_id:
                  type: string
                  description: The id of the source folder
              required:
              - source_folder_id
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                source_folder_id:
                  type: string
                  description: The id of the source folder
              required:
              - source_folder_id
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Folder'
      externalDocs:
        url: https://canvas.instructure.com/doc/api/files.html
