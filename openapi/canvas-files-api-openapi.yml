      - name: id
        in: path
        schema:
          type: string
        required: true
        description: ID
      - name: submission_id
        in: query
        schema:
          type: integer
          format: int64
        required: false
        description: 'The id of the submission the file is associated with.  Provide this argument to gain access to a file

          that has been submitted to an assignment (Canvas will verify that the file belongs to the submission

          and the calling user has rights to view the submission).'
      responses:
        '200':
          description: Success, no content returned
