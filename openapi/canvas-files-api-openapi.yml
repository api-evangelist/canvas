  /v1/courses/{course_id}/usage_rights:
    put:
      tags:
      - Files
      operationId: set_usage_rights_courses
      summary: Set usage rights
      description: Sets copyright and license information for one or more files
      parameters:
      - name: course_id
        in: path
        schema:
          type: string
        required: true
        description: ID
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                file_ids:
                  type: array
                  items:
                    type: string
                  description: List of ids of files to set usage rights for.
                folder_ids:
                  type: array
                  items:
                    type: string
                  description: 'List of ids of folders to search for files to set usage rights for.

                    Note that new files uploaded to these folders do not automatically inherit these rights.'
                publish:
                  type: boolean
                  description: Whether the file(s) or folder(s) should be published on save, provided that usage rights have been specified (set to `true` to publish on save).
                usage_rights[use_justification]:
                  type: string
                  enum:
                  - own_copyright
                  - used_by_permission
                  - fair_use
                  - public_domain
                  - creative_commons
                  description: The intellectual property justification for using the files in Canvas
                usage_rights[legal_copyright]:
                  type: string
                  description: The legal copyright line for the files
                usage_rights[license]:
                  type: string
                  description: The license that applies to the files. See the {api:UsageRightsController#licenses List licenses endpoint} for the supported license types.
              required:
              - file_ids
              - usage_rights[use_justification]
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                file_ids:
                  type: array
                  items:
                    type: string
                  description: List of ids of files to set usage rights for.
                folder_ids:
                  type: array
                  items:
                    type: string
                  description: 'List of ids of folders to search for files to set usage rights for.

                    Note that new files uploaded to these folders do not automatically inherit these rights.'
                publish:
                  type: boolean
                  description: Whether the file(s) or folder(s) should be published on save, provided that usage rights have been specified (set to `true` to publish on save).
                usage_rights[use_justification]:
                  type: string
                  enum:
                  - own_copyright
                  - used_by_permission
                  - fair_use
                  - public_domain
                  - creative_commons
                  description: The intellectual property justification for using the files in Canvas
                usage_rights[legal_copyright]:
                  type: string
                  description: The legal copyright line for the files
                usage_rights[license]:
                  type: string
                  description: The license that applies to the files. See the {api:UsageRightsController#licenses List licenses endpoint} for the supported license types.
              required:
              - file_ids
              - usage_rights[use_justification]
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageRights'
      externalDocs:
        url: https://canvas.instructure.com/doc/api/files.html
    delete:
      tags:
      - Files
      operationId: remove_usage_rights_courses
      summary: Remove usage rights
      description: Removes copyright and license information associated with one or more files
      parameters:
      - name: course_id
        in: path
        schema:
          type: string
        required: true
        description: ID
      - name: file_ids
        in: query
        schema:
          type: array
          items:
            type: string
        required: true
        description: List of ids of files to remove associated usage rights from.
      - name: folder_ids
        in: query
        schema:
          type: array
          items:
            type: string
        required: false
        description: List of ids of folders. Usage rights will be removed from all files in these folders.
      responses:
        '200':
          description: Success, no content returned
      externalDocs:
        url: https://canvas.instructure.com/doc/api/files.html
