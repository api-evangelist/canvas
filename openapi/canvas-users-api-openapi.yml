openapi: 3.2.0
info:
  title: Canvas LMS REST Users API
  version: v1
  summary: The complete Canvas LMS REST API, converted from the Swagger 1.2 documents Instructure publishes under https://canvas.instructure.com/doc/api/.
  description: The Canvas LMS REST API covers courses, assignments, quizzes, grades, users, enrollments, accounts, files, modules, rubrics, submissions, SIS imports, LTI, analytics and account administration.
  contact:
    name: Instructure Canvas
    url: https://canvas.instructure.com/doc/api/
  license:
    name: AGPL-3.0
    url: https://github.com/instructure/canvas-lms/blob/master/LICENSE
servers:
- url: https://canvas.instructure.com/api
  description: Instructure-hosted Canvas (canvas.instructure.com)
- url: https://{canvas_host}/api
  description: Any Canvas instance; Canvas is multi-tenant and self-hostable, so the host is the institution's Canvas domain.
  variables:
    canvas_host:
      default: canvas.instructure.com
      description: Your institution's Canvas hostname, e.g. school.instructure.com
security:
- bearerAuth: []
- oauth2: []
tags:
- name: Users
  x-resource: users
  externalDocs:
    url: https://canvas.instructure.com/doc/api/users.html
paths:
  /v1/accounts/{account_id}/users:
    get:
      tags:
      - Users
      operationId: list_users_in_account
      summary: List users in account
      description: 'A paginated list of users associated with this account.


        @example_request

        curl https:///api/v1/accounts/self/users?search_term= \

        -X GET \

        -H ''Authorization: Bearer '''
      parameters:
      - name: account_id
        in: path
        schema:
          type: string
        required: true
        description: ID
      - name: search_term
        in: query
        schema:
          type: string
        required: false
        description: 'The partial name or full ID of the users to match and return in the

          results list. Must be at least 3 characters.


          Note that the API will prefer matching on canonical user ID if the ID has

          a numeric form. It will only search against other fields if non-numeric

          in form, or if the numeric value doesn''t yield any matches. Queries by

          administrative users will search on SIS ID, Integration ID, login ID,

          name, or email address'
      - name: enrollment_type
        in: query
        schema:
          type: string
        required: false
        description: 'When set, only return users enrolled with the specified course-level base role.

          This can be a base role type of ''student'', ''teacher'',

          ''ta'', ''observer'', or ''designer''.'
      - name: sort
        in: query
        schema:
          type: string
          enum:
          - username
          - email
          - sis_id
          - integration_id
          - last_login
          - id
        required: false
        description: 'The column to sort results by. For efficiency, use +id+ if you intend to retrieve

          many pages of results. In the future, other sort options may be rate-limited

          after 50 pages.'
      - name: order
        in: query
        schema:
          type: string
          enum:
          - asc
          - desc
        required: false
        description: The order to sort the given column by.
      - name: include_deleted_users
        in: query
        schema:
          type: boolean
        required: false
        description: 'When set to true and used with an account context, returns users who have deleted

          pseudonyms for the context'
      - name: uuids
        in: query
        schema:
          type: array
          items: {}
        required: false
        description: 'When set, only return users with the specified UUIDs. UUIDs after the first 100

          are ignored.'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
      externalDocs:
        url: https://canvas.instructure.com/doc/api/users.html
    post:
      tags:
      - Users
      operationId: create_user
      summary: Create a user
      description: 'Create and return a new user and pseudonym for an account.


        [DEPRECATED (for self-registration only)] If you don''t have the "Modify

        login details for users" permission, but self-registration is enabled

        on the account, you can still use this endpoint to register new users.

        Certain fields will be required, and others will be ignored (see below).'
      parameters:
      - name: account_id
        in: path
        schema:
          type: string
        required: true
        description: ID
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                user[name]:
                  type: string
                  description: 'The full name of the user. This name will be used by teacher for grading.

                    Required if this is a self-registration.'
                user[short_name]:
                  type: string
                  description: User's name as it will be displayed in discussions, messages, and comments.
                user[sortable_name]:
                  type: string
                  description: User's name as used to sort alphabetically in lists.
                user[time_zone]:
                  type: string
                  description: 'The time zone for the user. Allowed time zones are

                    {http://www.iana.org/time-zones IANA time zones} or friendlier

                    {http://api.rubyonrails.org/classes/ActiveSupport/TimeZone.html Ruby on Rails time zones}.'
                user[locale]:
                  type: string
                  description: 'The user''s preferred language, from the list of languages Canvas supports.

                    This is in RFC-5646 format.'
                user[terms_of_use]:
                  type: boolean
                  description: 'Whether the user accepts the terms of use. Required if this is a

                    self-registration and this canvas instance requires users to accept

                    the terms (on by default).


                    If this is true, it will mark the user as having accepted the terms of use.'
                user[skip_registration]:
                  type: boolean
                  description: 'Automatically mark the user as registered.


                    If this is true, it is recommended to set <tt>"pseudonym[send_confirmation]"</tt> to true as well.

                    Otherwise, the user will not receive any messages about their account creation.


                    The users communication channel confirmation can be skipped by setting

                    <tt>"communication_channel[skip_confirmation]"</tt> to true as well.'
                pseudonym[unique_id]:
                  type: string
                  description: 'User''s login ID. If this is a self-registration, it must be a valid

                    email address.'
                pseudonym[password]:
                  type: string
                  description: User's password. Cannot be set during self-registration.
                pseudonym[sis_user_id]:
                  type: string
                  description: 'SIS ID for the user''s account. To set this parameter, the caller must be

                    able to manage SIS permissions.'
                pseudonym[integration_id]:
                  type: string
                  description: 'Integration ID for the login. To set this parameter, the caller must be able to

                    manage SIS permissions. The Integration ID is a secondary

                    identifier useful for more complex SIS integrations.'
                pseudonym[send_confirmation]:
                  type: boolean
                  description: 'Send user notification of account creation if true.

                    Automatically set to true during self-registration.'
                pseudonym[force_self_registration]:
                  type: boolean
                  description: 'Send user a self-registration style email if true.

                    Setting it means the users will get a notification asking them

                    to "complete the registration process" by clicking it, setting

                    a password, and letting them in.  Will only be executed on

                    if the user does not need admin approval.

                    Defaults to false unless explicitly provided.'
                pseudonym[authentication_provider_id]:
                  type: string
                  description: 'The authentication provider this login is associated with. Logins

                    associated with a specific provider can only be used with that provider.

                    Legacy providers (LDAP, CAS, SAML) will search for logins associated with

                    them, or unassociated logins. New providers will only search for logins

                    explicitly associated with them. This can be the integer ID of the

                    provider, or the type of the provider (in which case, it will find the

                    first matching provider).'
                communication_channel[type]:
                  type: string
                  description: The communication channel type, e.g. 'email' or 'sms'.
                communication_channel[address]:
                  type: string
                  description: The communication channel address, e.g. the user's email address.
                communication_channel[confirmation_url]:
                  type: boolean
                  description: 'Only valid for account admins. If true, returns the new user account

                    confirmation URL in the response.'
                communication_channel[skip_confirmation]:
                  type: boolean
                  description: 'Only valid for site admins and account admins making requests; If true, the channel is

                    automatically validated and no confirmation email or SMS is sent.

                    Otherwise, the user must respond to a confirmation message to confirm the

                    channel.


                    If this is true, it is recommended to set <tt>"pseudonym[send_confirmation]"</tt> to true as well.

                    Otherwise, the user will not receive any messages about their account creation.'
                force_validations:
                  type: boolean
                  description: 'If true, validations are performed on the newly created user (and their associated pseudonym)

                    even if the request is made by a privileged user like an admin. When set to false,

                    or not included in the request parameters, any newly created users are subject to

                    validations unless the request is made by a user with a ''manage_user_logins'' right.

                    In which case, certain validations such as ''require_acceptance_of_terms'' and

                    ''require_presence_of_name'' are not enforced. Use this parameter to return helpful json

                    errors while building users with an admin request.'
                enable_sis_reactivation:
                  type: boolean
                  description: 'When true, will first try to re-activate a deleted user with matching sis_user_id if possible.

                    This is commonly done with +user[skip_registration]+ and +communication_channel[skip_confirmation]+

                    so that the default communication_channel is also restored.'
                destination:
                  type: string
                  format: uri
                  description: 'If you''re setting the password for the newly created user, you can provide this param

                    with a valid URL pointing into this Canvas installation, and the response will include

                    a destination field that''s a URL that you can redirect a browser to and have the newly

                    created user automatically logged in. The URL is only valid for a short time, and must

                    match the domain this request is directed to, and be for a well-formed path that Canvas

                    can recognize.'
                initial_enrollment_type:
                  type: string
                  description: '`observer` if doing a self-registration with a pairing code. This allows setting the

                    password during user creation.'
                pairing_code[code]:
                  type: string
                  description: 'If provided and valid, will link the new user as an observer to the student''s whose

                    pairing code is given.'
              required:
              - pseudonym[unique_id]
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                user[name]:
                  type: string
                  description: 'The full name of the user. This name will be used by teacher for grading.

                    Required if this is a self-registration.'
                user[short_name]:
                  type: string
                  description: User's name as it will be displayed in discussions, messages, and comments.
                user[sortable_name]:
                  type: string
                  description: User's name as used to sort alphabetically in lists.
                user[time_zone]:
                  type: string
                  description: 'The time zone for the user. Allowed time zones are

