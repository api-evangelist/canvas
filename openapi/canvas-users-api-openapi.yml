  /v1/users/self/todo:
    get:
      tags:
      - Users
      operationId: list_todo_items
      summary: List the TODO items
      description: 'A paginated list of the current user''s list of todo items.


        There is a limit to the number of items returned.


        The `ignore` and `ignore_permanently` URLs can be used to update the user''s

        preferences on what items will be displayed.

        Performing a DELETE request against the `ignore` URL will hide that item

        from future todo item requests, until the item changes.

        Performing a DELETE request against the `ignore_permanently` URL will hide

        that item forever.'
      parameters:
      - name: include
        in: query
        schema:
          type: array
          items:
            type: string
            enum:
            - ungraded_quizzes
            - grading_counts
        required: false
        description: "\"ungraded_quizzes\":: Optionally include ungraded quizzes (such as practice quizzes and surveys) in the list.\n                     These will be returned under a +quiz+ key instead of an +assignment+ key in response elements.\n\"grading_counts\":: Optionally include segmented submission counts on grading-type items:\n                   +on_time_needs_grading_count+, +late_needs_grading_count+,\n                   +resubmitted_needs_grading_count+, +submitted_submissions_count+, and\n                   +total_submissions_count+. Only honored when the account has the\n                   +educator_dashboard+ feature enabled; otherwise silently ignored."
      - name: course_ids
        in: query
        schema:
          type: array
          items:
            type: string
        required: false
        description: 'Restrict results to todo items in the given courses. Accepts numeric IDs

          and SIS IDs of the form +sis_course_id:foo+. Applies to grading, submitting,

          checkpoint, and ungraded quiz items alike. Courses the user is not enrolled

          in (or that cannot be resolved) are silently dropped. When the parameter is

          present but no valid courses resolve, an empty list is returned rather than

          the unfiltered list.'
      - name: submission_status
        in: query
        schema:
          type: array
          items:
            type: string
            enum:
            - late
            - resubmitted
        required: false
        description: "Restrict grading todo items to submissions matching the given\ncharacteristics. Values OR-combine. When present, only grading (and\ncheckpoint grading) items are returned; submitting and ungraded-quiz items\nare omitted.\n\"late\":: Turned in after the due date.\n\"resubmitted\":: Student resubmitted after grading; the grade no longer\n                matches the current submission.\nUnknown values are silently dropped. When the parameter is present but no\nvalid statuses resolve, grading items return empty rather than unfiltered."
      responses:
        '200':
          description: Success, no content returned
      externalDocs:
