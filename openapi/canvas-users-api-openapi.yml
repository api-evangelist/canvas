              required:
              - pseudonym[unique_id]
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
      externalDocs:
        url: https://canvas.instructure.com/doc/api/users.html
  /v1/users/{user_id}/files:
    post:
      tags:
      - Users
      operationId: upload_file_users
      summary: Upload a file
      description: 'Upload a file to the user''s personal files section.


        This API endpoint is the first step in uploading a file to a user''s files.

        See the {file:file.file_uploads.html File Upload Documentation} for details on

        the file upload workflow.


        Note that typically users will only be able to upload files to their

        own files section. Passing a user_id of +self+ is an easy shortcut

        to specify the current user.'
      parameters:
      - name: user_id
        in: path
        schema:
          type: string
        required: true
        description: ID
      responses:
        '200':
          description: Success, no content returned
      externalDocs:
        url: https://canvas.instructure.com/doc/api/users.html
  /v1/users/self/activity_stream:
    get:
      tags:
      - Users
      operationId: list_activity_stream_self
      summary: List the activity stream
      description: 'Returns the current user''s global activity stream, paginated.


        There are many types of objects that can be returned in the activity

        stream. All object types have the same basic set of shared attributes:

        !!!javascript

        {

        ''created_at'': ''2011-07-13T09:12:00Z'',

        ''updated_at'': ''2011-07-25T08:52:41Z'',

        ''id'': 1234,

        ''title'': ''Stream Item Subject'',

        ''message'': ''This is the body text of the activity stream item. It is plain-text, and can be multiple paragraphs.'',

        ''type'': ''DiscussionTopic|Conversation|Message|Submission|Conference|Collaboration|AssessmentRequest...'',

        ''read_state'': false,

        ''context_type'': ''course'', // course|group

        ''course_id'': 1,

        ''group_id'': null,

        ''html_url'': "http://..." // URL to the Canvas web UI for this stream item

        }


        In addition, each item type has its own set of attributes available.


        DiscussionTopic:


        !!!javascript

        {

        ''type'': ''DiscussionTopic'',

        ''discussion_topic_id'': 1234,

        ''total_root_discussion_entries'': 5,

        ''require_initial_post'': true,

        ''user_has_posted'': true,

        ''root_discussion_entries'': {

        ...

        }

        }


        For DiscussionTopic, the message is truncated at 4kb.


        Announcement:


        !!!javascript

        {

        ''type'': ''Announcement'',

        ''announcement_id'': 1234,

        ''total_root_discussion_entries'': 5,

        ''require_initial_post'': true,

        ''user_has_posted'': null,

        ''root_discussion_entries'': {

        ...

        }

        }


        For Announcement, the message is truncated at 4kb.


        Conversation:


        !!!javascript

        {

        ''type'': ''Conversation'',

        ''conversation_id'': 1234,

        ''private'': false,

        ''participant_count'': 3,

        }


        Message:


        !!!javascript

        {

        ''type'': ''Message'',

        ''message_id'': 1234,

        ''notification_category'': ''Assignment Graded''

        }


        Submission:


        Returns an {api:Submissions:Submission Submission} with its Course and Assignment data.


        Conference:


        !!!javascript

        {

        ''type'': ''Conference'',

        ''web_conference_id'': 1234

        }


        Collaboration:


        !!!javascript

        {

        ''type'': ''Collaboration'',

        ''collaboration_id'': 1234

        }


        AssessmentRequest:


        !!!javascript

        {

        ''type'': ''AssessmentRequest'',

        ''assessment_request_id'': 1234

        }'
      parameters:
      - name: only_active_courses
        in: query
        schema:
          type: boolean
        required: false
        description: If true, will only return objects for courses the user is actively participating in
      responses:
        '200':
          description: Success, no content returned
      externalDocs:
        url: https://canvas.instructure.com/doc/api/users.html
    delete:
      tags:
      - Users
      operationId: hide_all_stream_items
      summary: Hide all stream items
      description: Hide all stream items for the user
      responses:
        '200':
          description: Success, no content returned
      externalDocs:
        url: https://canvas.instructure.com/doc/api/users.html
