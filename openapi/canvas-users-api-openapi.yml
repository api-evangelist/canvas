  /v1/users/{user_id}/missing_submissions:
    get:
      tags:
      - Users
      operationId: list_missing_submissions
      summary: List Missing Submissions
      description: 'A paginated list of past-due assignments for which the student does not have a submission.

        The user sending the request must either be the student, an admin or a parent observer using the parent app'
      parameters:
      - name: user_id
        in: path
        schema:
          type: string
        required: true
        description: the student's ID
      - name: observed_user_id
        in: query
        schema:
          type: string
        required: false
        description: 'Return missing submissions for the given observed user. Must be accompanied by course_ids[].

          The user making the request must be observing the observed user in all the courses specified by

          course_ids[].'
      - name: include
        in: query
        schema:
          type: array
          items:
            type: string
            enum:
            - planner_overrides
            - course
        required: false
        description: "\"planner_overrides\":: Optionally include the assignment's associated planner override, if it exists, for the current user.\n                      These will be returned under a +planner_override+ key\n\"course\":: Optionally include the assignments' courses"
      - name: filter
        in: query
        schema:
          type: array
          items:
            type: string
            enum:
            - submittable
            - current_grading_period
        required: false
        description: '"submittable":: Only return assignments that the current user can submit (i.e. filter out locked assignments)

          "current_grading_period":: Only return missing assignments that are in the current grading period'
      - name: course_ids
        in: query
        schema:
          type: array
          items:
            type: string
        required: false
        description: 'Optionally restricts the list of past-due assignments to only those associated with the specified

          course IDs. Required if observed_user_id is passed.'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
