components:
  schemas:
    QuizItem:
      type: object
      properties:
        id:
          type: string
          example: '35'
          description: the ID of the quiz item
        position:
          type: integer
          example: 2
          description: the position of the item within the quiz. The first item in a quiz is given position 1.
        points_possible:
          type: number
          example: 10.0
          description: the number of points available to score on this item
        entry_type:
          type: string
          example: Item
          description: the type of the item. One of 'Item', 'Stimulus', 'BankEntry', or 'Bank'.
        entry_editable:
          type: boolean
          example: true
          description: whether the current user can edit the item -- used internally, no need to set
        stimulus_quiz_entry_id:
          type: string
          example: '3'
          description: the ID of the stimulus that this item is associated with. null if not associated with any stimuli.
        status:
          type: string
          example: mutable
          description: status of the item. one of 'mutable' or 'immutable'.  Used internally, no need to set
        properties:
          type: string
          description: additional properties for the item (currently only populated by items with a BankItem entry)
        entry:
          type: string
          description: "the specific data associated with the quiz item.  These items can be either a\n       QuestionItem, StimulusItem, BankEntryItem, or BankItem, depending on entry_type, and are defined\n       separately"
      description: Individual items within a quiz, whether they're questions, stimuli, banked content, or question banks.
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'Canvas OAuth2 access token sent as "Authorization: Bearer <token>". See https://canvas.instructure.com/doc/api/file.oauth.html'
    oauth2:
      type: oauth2
      description: Canvas OAuth2. See https://canvas.instructure.com/doc/api/file.oauth.html and https://canvas.instructure.com/doc/api/file.oauth_endpoints.html
      flows:
        authorizationCode:
          authorizationUrl: https://canvas.instructure.com/login/oauth2/auth
          tokenUrl: https://canvas.instructure.com/login/oauth2/token
          refreshUrl: https://canvas.instructure.com/login/oauth2/token
          scopes: {}
