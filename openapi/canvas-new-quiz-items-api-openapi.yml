        in: path
        schema:
          type: integer
          format: int64
        required: true
        description: The id of the assignment associated with the quiz.
      - name: item_id
        in: path
        schema:
          type: integer
          format: int64
        required: true
        description: The id of the item associated with the quiz.
      requestBody:
        required: false
        content:
