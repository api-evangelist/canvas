      description: Get details about a single item in a new quiz.
      parameters:
      - name: course_id
        in: path
        schema:
          type: integer
          format: int64
        required: true
        description: no description
      - name: assignment_id
        in: path
        schema:
          type: integer
          format: int64
        required: true
        description: The id of the assignment associated with the quiz.
      - name: item_id
        in: path
        schema:
          type: integer
          format: int64
        required: true
        description: The id of the item associated with the quiz.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizItem'
      externalDocs:
        url: https://canvas.instructure.com/doc/api/new_quiz_items.html
