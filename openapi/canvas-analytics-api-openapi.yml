  /v1/courses/{course_id}/analytics/activity:
    get:
      tags:
      - Analytics
      operationId: get_course_level_participation_data
      summary: Get course-level participation data
      description: 'Returns page view hits and participation numbers grouped by day through the

        entire history of the course. Page views is returned as a hash, where the

        hash keys are dates in the format "YYYY-MM-DD". The page_views result set

        includes page views broken out by access category. Participations is

        returned as an array of dates in the format "YYYY-MM-DD".'
      parameters:
      - name: course_id
        in: path
        schema:
          type: string
        required: true
        description: ID
      responses:
        '200':
          description: Success, no content returned
      externalDocs:
        url: https://canvas.instructure.com/doc/api/analytics.html
  /v1/courses/{course_id}/analytics/assignments:
    get:
      tags:
      - Analytics
      operationId: get_course_level_assignment_data
      summary: Get course-level assignment data
      description: 'Returns a list of assignments for the course sorted by due date. For

        each assignment returns basic assignment information, the grade breakdown,

        and a breakdown of on-time/late status of homework submissions.'
      parameters:
      - name: course_id
        in: path
        schema:
          type: string
        required: true
        description: ID
      - name: async
        in: query
        schema:
          type: boolean
        required: false
        description: 'If async is true, then the course_assignments call can happen asynch-

          ronously and MAY return a response containing a progress_url key instead

          of an assignments array. If it does, then it is the caller''s

          responsibility to poll the API again to see if the progress is complete.

          If the data is ready (possibly even on the first async call) then it

          will be passed back normally, as documented in the example response.'
      responses:
        '200':
          description: Success, no content returned
      externalDocs:
        url: https://canvas.instructure.com/doc/api/analytics.html
  /v1/courses/{course_id}/analytics/student_summaries:
    get:
      tags:
      - Analytics
      operationId: get_course_level_student_summary_data
      summary: Get course-level student summary data
      description: 'Returns a summary of per-user access information for all students in

        a course. This includes total page views, total participations, and a

        breakdown of on-time/late status for all homework submissions in the course.


        Each student''s summary also includes the maximum number of page views and

        participations by any student in the course, which may be useful for some

        visualizations (since determining maximums client side can be tricky with

        pagination).'
      parameters:
      - name: course_id
        in: path
        schema:
          type: string
        required: true
        description: ID
      - name: sort_column
        in: query
        schema:
          type: string
          enum:
          - name
          - name_descending
          - score
          - score_descending
          - participations
          - participations_descending
          - page_views
          - page_views_descending
        required: false
        description: The order results in which results are returned.  Defaults to "name".
      - name: student_id
        in: query
        schema:
          type: string
        required: false
        description: If set, returns only the specified student.
      responses:
        '200':
          description: Success, no content returned
      externalDocs:
        url: https://canvas.instructure.com/doc/api/analytics.html
  /v1/courses/{course_id}/analytics/users/{student_id}/activity:
    get:
      tags:
      - Analytics
      operationId: get_user_in_a_course_level_participation_data
      summary: Get user-in-a-course-level participation data
      description: 'Returns page view hits grouped by hour, and participation details through the

        entire history of the course.


        `page_views` are returned as a hash, where the keys are iso8601 dates, bucketed by the hour.

        `participations` are returned as an array of hashes, sorted oldest to newest.'
      parameters:
      - name: course_id
        in: path
        schema:
          type: string
        required: true
        description: ID
      - name: student_id
        in: path
        schema:
          type: string
        required: true
        description: ID
      responses:
        '200':
          description: Success, no content returned
      externalDocs:
        url: https://canvas.instructure.com/doc/api/analytics.html
  /v1/courses/{course_id}/analytics/users/{student_id}/assignments:
    get:
      tags:
      - Analytics
      operationId: get_user_in_a_course_level_assignment_data
      summary: Get user-in-a-course-level assignment data
      description: 'Returns a list of assignments for the course sorted by due date. For

        each assignment returns basic assignment information, the grade breakdown

        (including the student''s actual grade), and the basic submission

        information for the student''s submission if it exists.'
      parameters:
      - name: course_id
        in: path
        schema:
          type: string
        required: true
        description: ID
      - name: student_id
        in: path
        schema:
          type: string
        required: true
        description: ID
      responses:
        '200':
          description: Success, no content returned
      externalDocs:
        url: https://canvas.instructure.com/doc/api/analytics.html
  /v1/courses/{course_id}/analytics/users/{student_id}/communication:
    get:
      tags:
      - Analytics
      operationId: get_user_in_a_course_level_messaging_data
      summary: Get user-in-a-course-level messaging data
      description: 'Returns messaging "hits" grouped by day through the entire history of the

        course. Returns a hash containing the number of instructor-to-student messages,

        and student-to-instructor messages, where the hash keys are dates

        in the format "YYYY-MM-DD". Message hits include Conversation messages and

        comments on homework submissions.'
      parameters:
      - name: course_id
        in: path
        schema:
          type: string
        required: true
        description: ID
      - name: student_id
        in: path
        schema:
          type: string
        required: true
        description: ID
      responses:
        '200':
          description: Success, no content returned
      externalDocs:
        url: https://canvas.instructure.com/doc/api/analytics.html
