openapi: 3.2.0
info:
  title: Canvas LMS REST Analytics API
  version: v1
  summary: The complete Canvas LMS REST API, converted from the Swagger 1.2 documents Instructure publishes under https://canvas.instructure.com/doc/api/.
  description: The Canvas LMS REST API covers courses, assignments, quizzes, grades, users, enrollments, accounts, files, modules, rubrics, submissions, SIS imports, LTI, analytics and account administration.
  contact:
    name: Instructure Canvas
    url: https://canvas.instructure.com/doc/api/
  license:
    name: AGPL-3.0
    url: https://github.com/instructure/canvas-lms/blob/master/LICENSE
servers:
- url: https://canvas.instructure.com/api
  description: Instructure-hosted Canvas (canvas.instructure.com)
- url: https://{canvas_host}/api
  description: Any Canvas instance; Canvas is multi-tenant and self-hostable, so the host is the institution's Canvas domain.
  variables:
    canvas_host:
      default: canvas.instructure.com
      description: Your institution's Canvas hostname, e.g. school.instructure.com
security:
- bearerAuth: []
- oauth2: []
tags:
- name: Analytics
  x-resource: analytics
  externalDocs:
    url: https://canvas.instructure.com/doc/api/analytics.html
paths:
  /v1/accounts/{account_id}/analytics/terms/{term_id}/activity:
    get:
      tags:
      - Analytics
      operationId: get_department_level_participation_data_terms
      summary: Get department-level participation data
      description: 'Returns page view hits summed across all courses in the department. Two

        groupings of these counts are returned; one by day (+by_date+), the other

        by category (+by_category+). The possible categories are announcements,

        assignments, collaborations, conferences, discussions, files, general,

        grades, groups, modules, other, pages, and quizzes.


        This and the other department-level endpoints have three variations which

        all return the same style of data but for different subsets of courses. All

        share the prefix /api/v1/accounts//analytics. The possible

        suffixes are:


        * /current: includes all available courses in the default term

        * /completed: includes all concluded courses in the default term

        * /terms/: includes all available or concluded courses in the

        given term.


        Courses not yet offered or which have been deleted are never included.


        /current and /completed are intended for use when the account has only one

        term. /terms/ is intended for use when the account has multiple

        terms.


        The action follows the suffix.'
      parameters:
      - name: account_id
        in: path
        schema:
          type: string
        required: true
        description: ID
      - name: term_id
        in: path
        schema:
          type: string
        required: true
        description: ID
      responses:
        '200':
          description: Success, no content returned
      externalDocs:
        url: https://canvas.instructure.com/doc/api/analytics.html
