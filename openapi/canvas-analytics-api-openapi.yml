  /v1/accounts/{account_id}/analytics/terms/{term_id}/grades:
    get:
      tags:
      - Analytics
      operationId: get_department_level_grade_data_terms
      summary: Get department-level grade data
      description: 'Returns the distribution of grades for students in courses in the

        department. Each data point is one student''s current grade in one course;

        if a student is in multiple courses, he contributes one value per course,

        but if he''s enrolled multiple times in the same course (e.g. a lecture

        section and a lab section), he only constributes on value for that course.


        Grades are binned to the nearest integer score; anomalous grades outside

        the 0 to 100 range are ignored. The raw counts are returned, not yet

        normalized by the total count.


        Shares the same variations on endpoint as the participation data.'
      parameters:
      - name: account_id
        in: path
        schema:
          type: string
        required: true
        description: ID
      - name: term_id
        in: path
        schema:
          type: string
        required: true
        description: ID
      responses:
        '200':
          description: Success, no content returned
      externalDocs:
        url: https://canvas.instructure.com/doc/api/analytics.html
