            schema:
              type: object
              properties:
                wiki_page[title]:
                  type: string
                  description: The title for the new page.
                wiki_page[body]:
                  type: string
                  description: The content for the new page.
                wiki_page[editing_roles]:
                  type: string
                  enum:
                  - teachers
                  - students
                  - members
                  - public
                  description: 'Which user roles are allowed to edit this page. Any combination

                    of these roles is allowed (separated by commas).


                    "teachers":: Allows editing by teachers in the course.

                    "students":: Allows editing by students in the course.

                    "members":: For group wikis, allows editing by members of the group.

                    "public":: Allows editing by any user.'
                wiki_page[notify_of_update]:
                  type: boolean
                  description: Whether participants should be notified when this page changes.
                wiki_page[published]:
                  type: boolean
                  description: Whether the page is published (true) or draft state (false).
                wiki_page[front_page]:
                  type: boolean
                  description: Set an unhidden page as the front page (if true)
                wiki_page[publish_at]:
                  type: string
                  format: date-time
                  description: 'Schedule a future date/time to publish the page. This will have no effect unless the

                    "Scheduled Page Publication" feature is enabled in the account. If a future date is

                    supplied, the page will be unpublished and +wiki_page[published]+ will be ignored.'
              required:
              - wiki_page[title]
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                wiki_page[title]:
                  type: string
                  description: The title for the new page.
                wiki_page[body]:
