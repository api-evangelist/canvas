openapi: 3.2.0
info:
  title: Canvas LMS REST Pages API
  version: v1
  summary: The complete Canvas LMS REST API, converted from the Swagger 1.2 documents Instructure publishes under https://canvas.instructure.com/doc/api/.
  description: The Canvas LMS REST API covers courses, assignments, quizzes, grades, users, enrollments, accounts, files, modules, rubrics, submissions, SIS imports, LTI, analytics and account administration.
  contact:
    name: Instructure Canvas
    url: https://canvas.instructure.com/doc/api/
  license:
    name: AGPL-3.0
    url: https://github.com/instructure/canvas-lms/blob/master/LICENSE
servers:
- url: https://canvas.instructure.com/api
  description: Instructure-hosted Canvas (canvas.instructure.com)
- url: https://{canvas_host}/api
  description: Any Canvas instance; Canvas is multi-tenant and self-hostable, so the host is the institution's Canvas domain.
  variables:
    canvas_host:
      default: canvas.instructure.com
      description: Your institution's Canvas hostname, e.g. school.instructure.com
security:
- bearerAuth: []
- oauth2: []
tags:
- name: Pages
  x-resource: pages
  externalDocs:
    url: https://canvas.instructure.com/doc/api/pages.html
paths:
  /v1/courses/{course_id}/front_page:
    get:
      tags:
      - Pages
      operationId: show_front_page_courses
      summary: Show front page
      description: Retrieve the content of the front page
      parameters:
      - name: course_id
        in: path
        schema:
          type: string
        required: true
        description: ID
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page'
      externalDocs:
        url: https://canvas.instructure.com/doc/api/pages.html
    put:
      tags:
      - Pages
      operationId: update_create_front_page_courses
      summary: Update/create front page
      description: Update the title or contents of the front page
      parameters:
      - name: course_id
        in: path
        schema:
          type: string
        required: true
        description: ID
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                wiki_page[title]:
                  type: string
                  description: 'The title for the new page. NOTE: changing a page''s title will change its

                    url. The updated url will be returned in the result.'
                wiki_page[body]:
                  type: string
                  description: The content for the new page.
                wiki_page[editing_roles]:
                  type: string
                  enum:
                  - teachers
                  - students
                  - members
                  - public
                  description: 'Which user roles are allowed to edit this page. Any combination

                    of these roles is allowed (separated by commas).


                    "teachers":: Allows editing by teachers in the course.

                    "students":: Allows editing by students in the course.

                    "members":: For group wikis, allows editing by members of the group.

                    "public":: Allows editing by any user.'
                wiki_page[notify_of_update]:
                  type: boolean
                  description: Whether participants should be notified when this page changes.
                wiki_page[published]:
                  type: boolean
                  description: Whether the page is published (true) or draft state (false).
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                wiki_page[title]:
                  type: string
                  description: 'The title for the new page. NOTE: changing a page''s title will change its

                    url. The updated url will be returned in the result.'
                wiki_page[body]:
                  type: string
                  description: The content for the new page.
                wiki_page[editing_roles]:
                  type: string
                  enum:
                  - teachers
                  - students
                  - members
                  - public
                  description: 'Which user roles are allowed to edit this page. Any combination

                    of these roles is allowed (separated by commas).


                    "teachers":: Allows editing by teachers in the course.

                    "students":: Allows editing by students in the course.

                    "members":: For group wikis, allows editing by members of the group.

                    "public":: Allows editing by any user.'
                wiki_page[notify_of_update]:
                  type: boolean
                  description: Whether participants should be notified when this page changes.
                wiki_page[published]:
                  type: boolean
                  description: Whether the page is published (true) or draft state (false).
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page'
      externalDocs:
        url: https://canvas.instructure.com/doc/api/pages.html
