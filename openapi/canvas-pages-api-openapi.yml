                  - public
                  description: 'Which user roles are allowed to edit this page. Any combination

                    of these roles is allowed (separated by commas).


                    "teachers":: Allows editing by teachers in the course.

                    "students":: Allows editing by students in the course.

                    "members":: For group wikis, allows editing by members of the group.

                    "public":: Allows editing by any user.'
                wiki_page[notify_of_update]:
                  type: boolean
                  description: Whether participants should be notified when this page changes.
                wiki_page[published]:
                  type: boolean
                  description: Whether the page is published (true) or draft state (false).
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page'
      externalDocs:
        url: https://canvas.instructure.com/doc/api/pages.html
  /v1/courses/{course_id}/pages/{url_or_id}/duplicate:
    post:
      tags:
      - Pages
      operationId: duplicate_page
      summary: Duplicate page
      description: Duplicate a wiki page
      parameters:
      - name: course_id
        in: path
        schema:
          type: string
        required: true
        description: ID
      - name: url_or_id
        in: path
        schema:
          type: string
        required: true
        description: ID
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page'
      externalDocs:
        url: https://canvas.instructure.com/doc/api/pages.html
  /v1/courses/{course_id}/pages:
    get:
      tags:
      - Pages
      operationId: list_pages_courses
      summary: List pages
      description: A paginated list of the wiki pages associated with a course or group
      parameters:
      - name: course_id
        in: path
        schema:
          type: string
        required: true
        description: ID
      - name: sort
        in: query
        schema:
          type: string
          enum:
          - title
          - created_at
          - updated_at
        required: false
        description: Sort results by this field.
      - name: order
        in: query
        schema:
          type: string
          enum:
          - asc
          - desc
        required: false
        description: The sorting order. Defaults to 'asc'.
      - name: search_term
        in: query
        schema:
          type: string
        required: false
        description: The partial title of the pages to match and return.
      - name: published
        in: query
        schema:
          type: boolean
        required: false
        description: 'If true, include only published paqes. If false, exclude published

          pages. If not present, do not filter on published status.'
      - name: include
        in: query
        schema:
          type: array
          items:
            type: string
            enum:
            - body
        required: false
        description: '- "body": Optionally include the page body with each Page.

          If this is a block_editor page, returns the block_editor_attributes.'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Page'
      externalDocs:
        url: https://canvas.instructure.com/doc/api/pages.html
