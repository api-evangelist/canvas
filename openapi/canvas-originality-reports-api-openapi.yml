paths:
  /lti/assignments/{assignment_id}/submissions/{submission_id}/originality_report:
    post:
      tags:
      - Originality Reports
      operationId: create_originality_report
      summary: Create an Originality Report
      description: Create a new OriginalityReport for the specified file
      parameters:
      - name: assignment_id
        in: path
        schema:
          type: string
        required: true
        description: ID
      - name: submission_id
        in: path
        schema:
          type: string
        required: true
        description: ID
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                originality_report[file_id]:
                  type: integer
                  format: int64
                  description: 'The id of the file being given an originality score. Required

                    if creating a report associated with a file.'
                originality_report[originality_score]:
                  type: number
                  description: 'A number between 0 and 100 representing the measure of the

                    specified file''s originality.'
                originality_report[originality_report_url]:
                  type: string
                  description: 'The URL where the originality report for the specified

                    file may be found.'
                originality_report[originality_report_file_id]:
                  type: integer
                  format: int64
                  description: 'The ID of the file within Canvas that contains the originality

                    report for the submitted file provided in the request URL.'
                originality_report[tool_setting][resource_type_code]:
                  type: string
                  description: 'The resource type code of the resource handler Canvas should use for the

                    LTI launch for viewing originality reports. If set Canvas will launch

                    to the message with type ''basic-lti-launch-request'' in the specified

                    resource handler rather than using the originality_report_url.'
                originality_report[tool_setting][resource_url]:
                  type: string
                  description: 'The URL Canvas should launch to when showing an LTI originality report.

                    Note that this value is inferred from the specified resource handler''s

                    message "path" value (See `resource_type_code`) unless

                    it is specified. If this parameter is used a `resource_type_code`

                    must also be specified.'
                originality_report[workflow_state]:
                  type: string
                  description: 'May be set to "pending", "error", or "scored". If an originality score

                    is provided a workflow state of "scored" will be inferred.'
                originality_report[error_message]:
                  type: string
                  description: 'A message describing the error. If set, the "workflow_state"

                    will be set to "error."'
                originality_report[attempt]:
                  type: integer
                  format: int64
                  description: 'If no `file_id` is given, and no file is required for the assignment

                    (that is, the assignment allows an online text entry), this parameter

                    may be given to clarify which attempt number the report is for (in the

                    case of resubmissions). If this field is omitted and no `file_id` is

                    given, the report will be created (or updated, if it exists) for the

                    first submission attempt with no associated file.'
              required:
              - originality_report[originality_score]
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                originality_report[file_id]:
                  type: integer
                  format: int64
                  description: 'The id of the file being given an originality score. Required

