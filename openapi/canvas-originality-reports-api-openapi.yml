components:
  schemas:
    OriginalityReport:
      type: object
      properties:
        id:
          type: integer
          example: '4'
          description: The id of the OriginalityReport
        file_id:
          type: integer
          example: '8'
          description: The id of the file receiving the originality score
        originality_score:
          type: number
          example: '0.16'
          description: A number between 0 and 100 representing the originality score
        originality_report_file_id:
          type: integer
          example: '23'
          description: The ID of the file within Canvas containing the originality report document (if provided)
        originality_report_url:
          type: string
          example: http://www.example.com/report
          description: A non-LTI launch URL where the originality score of the file may be found.
        tool_setting:
          type: string
          description: A ToolSetting object containing optional 'resource_type_code' and 'resource_url'
        error_report:
          type: string
          description: A message describing the error. If set, the workflow_state will become 'error.'
        submission_time:
          type: string
          format: date-time
          description: The submitted_at date time of the submission.
        root_account_id:
          type: integer
          example: '1'
          description: The id of the root Account associated with the OriginalityReport
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'Canvas OAuth2 access token sent as "Authorization: Bearer <token>". See https://canvas.instructure.com/doc/api/file.oauth.html'
    oauth2:
      type: oauth2
      description: Canvas OAuth2. See https://canvas.instructure.com/doc/api/file.oauth.html and https://canvas.instructure.com/doc/api/file.oauth_endpoints.html
      flows:
        authorizationCode:
          authorizationUrl: https://canvas.instructure.com/login/oauth2/auth
          tokenUrl: https://canvas.instructure.com/login/oauth2/token
          refreshUrl: https://canvas.instructure.com/login/oauth2/token
          scopes: {}
