                originality_report[workflow_state]:
                  type: string
                  description: 'May be set to "pending", "error", or "scored". If an originality score

                    is provided a workflow state of "scored" will be inferred.'
                originality_report[error_message]:
                  type: string
                  description: 'A message describing the error. If set, the "workflow_state"

                    will be set to "error."'
                originality_report[attempt]:
                  type: integer
                  format: int64
                  description: 'If no `file_id` is given, and no file is required for the assignment

