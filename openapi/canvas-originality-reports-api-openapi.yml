                    first submission attempt with no associated file.'
              required:
              - originality_report[originality_score]
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OriginalityReport'
      externalDocs:
        url: https://canvas.instructure.com/doc/api/originality_reports.html
