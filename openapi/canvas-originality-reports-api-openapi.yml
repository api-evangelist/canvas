                  format: int64
                  description: 'The ID of the file within Canvas that contains the originality

                    report for the submitted file provided in the request URL.'
                originality_report[tool_setting][resource_type_code]:
                  type: string
                  description: 'The resource type code of the resource handler Canvas should use for the

                    LTI launch for viewing originality reports. If set Canvas will launch

