  /v1/courses/{course_id}/rubrics/{id}/used_locations:
    get:
      tags:
      - Rubrics
      operationId: get_courses_and_assignments_for_rubric_courses
      summary: Get the courses and assignments for a rubric
      description: Returns the courses and assignments where a rubric is being used
      parameters:
      - name: course_id
        in: path
        schema:
          type: string
        required: true
        description: ID
      - name: id
        in: path
        schema:
          type: string
        required: true
        description: ID
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: string
                x-canvas-declared-type: UsedLocations
      externalDocs:
        url: https://canvas.instructure.com/doc/api/rubrics.html
  /v1/accounts/{account_id}/rubrics/{id}/used_locations:
    get:
      tags:
