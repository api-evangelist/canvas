components:
  schemas:
    RubricRating__rubrics:
      type: object
      properties:
        id:
          type: string
          example: name_2
        criterion_id:
          type: string
          example: _10
        description:
          type: string
        long_description:
          type: string
        points:
          type: integer
          example: '5'
    RubricAssessment:
      type: object
      properties:
        id:
          type: integer
          example: 1
          description: the ID of the rubric
        rubric_id:
          type: integer
          example: 1
          description: the rubric the assessment belongs to
        rubric_association_id:
          type: integer
          example: '2'
        score:
          type: integer
          example: '5.0'
        artifact_type:
          type: string
          example: Submission
          description: the object of the assessment
        artifact_id:
          type: integer
          example: '3'
          description: the id of the object of the assessment
        artifact_attempt:
          type: integer
          example: '2'
          description: the current number of attempts made on the object of the assessment
        assessment_type:
          type: string
          example: grading
          description: the type of assessment. values will be either 'grading', 'peer_review', or 'provisional_grade'
        assessor_id:
          type: integer
          example: '6'
          description: user id of the person who made the assessment
        data:
          type: array
          items:
            type: object
            additionalProperties: true
          description: (Optional) If 'full' is included in the 'style' parameter, returned assessments will have their full details contained in their data hash. If the user does not request a style, this key will be absent.
        comments:
          type: array
          items:
            type: string
          description: (Optional) If 'comments_only' is included in the 'style' parameter, returned assessments will include only the comments portion of their data hash. If the user does not request a style, this key will be absent.
    Rubric:
      type: object
      properties:
        id:
          type: integer
          example: 1
          description: the ID of the rubric
        title:
          type: string
          example: some title
          description: title of the rubric
        context_id:
          type: integer
          example: 1
          description: the context owning the rubric
        context_type:
          type: string
          example: Course
        points_possible:
          type: integer
          example: '10.0'
        reusable:
          type: boolean
          example: 'false'
        read_only:
          type: boolean
          example: 'true'
        free_form_criterion_comments:
          type: boolean
          example: 'true'
          description: whether or not free-form comments are used
        hide_score_total:
          type: boolean
          example: 'true'
        data:
          type: array
          items:
            $ref: '#/components/schemas/RubricCriterion'
          description: An array with all of this Rubric's grading Criteria
        assessments:
          type: array
          items:
            $ref: '#/components/schemas/RubricAssessment'
          description: If an assessment type is included in the 'include' parameter, includes an array of rubric assessment objects for a given rubric, based on the assessment type requested. If the user does not request an assessment type this key will be absent.
        associations:
          type: array
          items:
            $ref: '#/components/schemas/RubricAssociation'
          description: If an association type is included in the 'include' parameter, includes an array of rubric association objects for a given rubric, based on the association type requested. If the user does not request an association type this key will be absent.
    RubricAssociation:
      type: object
      properties:
        id:
          type: integer
          example: 1
          description: the ID of the association
        rubric_id:
          type: integer
          example: '1'
          description: the ID of the rubric
        association_id:
          type: integer
          example: 1
          description: the ID of the object this association links to
        association_type:
          type: string
          example: Course
          description: the type of object this association links to
        use_for_grading:
          type: boolean
          example: 'true'
          description: Whether or not the associated rubric is used for grade calculation
        summary_data:
          type: string
          example: ''
        purpose:
          type: string
          example: grading
          description: Whether or not the association is for grading (and thus linked to an assignment) or if it's to indicate the rubric should appear in its context. Values will be grading or bookmark.
        hide_score_total:
          type: boolean
          example: 'true'
          description: Whether or not the score total is displayed within the rubric. This option is only available if the rubric is not used for grading.
        hide_points:
          type: boolean
          example: 'true'
        hide_outcome_results:
          type: boolean
          example: 'true'
    RubricCriterion:
      type: object
      properties:
        id:
          type: string
          example: _10
          description: the ID of the criterion
        description:
          type: string
        long_description:
          type: string
        points:
          type: integer
          example: '5'
        criterion_use_range:
          type: boolean
          example: 'false'
        ratings:
          type: array
          items:
            $ref: '#/components/schemas/RubricRating__rubrics'
          description: the possible ratings for this Criterion
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'Canvas OAuth2 access token sent as "Authorization: Bearer <token>". See https://canvas.instructure.com/doc/api/file.oauth.html'
    oauth2:
      type: oauth2
      description: Canvas OAuth2. See https://canvas.instructure.com/doc/api/file.oauth.html and https://canvas.instructure.com/doc/api/file.oauth_endpoints.html
      flows:
        authorizationCode:
          authorizationUrl: https://canvas.instructure.com/login/oauth2/auth
          tokenUrl: https://canvas.instructure.com/login/oauth2/token
          refreshUrl: https://canvas.instructure.com/login/oauth2/token
          scopes: {}
