openapi: 3.2.0
info:
  title: Canvas LMS REST Rubrics API
  version: v1
  summary: The complete Canvas LMS REST API, converted from the Swagger 1.2 documents Instructure publishes under https://canvas.instructure.com/doc/api/.
  description: The Canvas LMS REST API covers courses, assignments, quizzes, grades, users, enrollments, accounts, files, modules, rubrics, submissions, SIS imports, LTI, analytics and account administration.
  contact:
    name: Instructure Canvas
    url: https://canvas.instructure.com/doc/api/
  license:
    name: AGPL-3.0
    url: https://github.com/instructure/canvas-lms/blob/master/LICENSE
servers:
- url: https://canvas.instructure.com/api
  description: Instructure-hosted Canvas (canvas.instructure.com)
- url: https://{canvas_host}/api
  description: Any Canvas instance; Canvas is multi-tenant and self-hostable, so the host is the institution's Canvas domain.
  variables:
    canvas_host:
      default: canvas.instructure.com
      description: Your institution's Canvas hostname, e.g. school.instructure.com
security:
- bearerAuth: []
- oauth2: []
tags:
- name: Rubrics
  x-resource: rubrics
  externalDocs:
    url: https://canvas.instructure.com/doc/api/rubrics.html
paths:
  /v1/courses/{course_id}/rubrics:
    post:
      tags:
      - Rubrics
      operationId: create_single_rubric
      summary: Create a single rubric
      description: 'Returns the rubric with the given id.


        Unfortunately this endpoint does not return a standard Rubric object,

        instead it returns a hash that looks like

        { ''rubric'': Rubric, ''rubric_association'': RubricAssociation }


        This may eventually be deprecated in favor of a more standardized return

        value, but that is not currently planned.'
      parameters:
      - name: course_id
        in: path
        schema:
          type: string
        required: true
        description: ID
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                  format: int64
                  description: The id of the rubric
                rubric_association_id:
                  type: integer
                  format: int64
                  description: 'The id of the rubric association object (not the course/assignment itself, but the join table record id).

                    It can be used in place of +rubric_association[association_id]+ and +rubric_association[association_type]+ if desired.'
                rubric[title]:
                  type: string
                  description: The title of the rubric
                rubric[free_form_criterion_comments]:
                  type: boolean
                  description: Whether or not you can write custom comments in the ratings field for a rubric
                rubric_association[association_id]:
                  type: integer
                  format: int64
                  description: The id of the object with which this rubric is associated
                rubric_association[association_type]:
                  type: string
                  enum:
                  - Assignment
                  - Course
                  - Account
                  description: The type of object this rubric is associated with
                rubric_association[use_for_grading]:
                  type: boolean
                  description: Whether or not the associated rubric is used for grade calculation
                rubric_association[hide_score_total]:
                  type: boolean
                  description: 'Whether or not the score total is displayed within the rubric.

                    This option is only available if the rubric is not used for grading.'
                rubric_association[purpose]:
                  type: string
                  description: 'Whether or not the association is for grading (and thus linked to an assignment)

                    or if it''s to indicate the rubric should appear in its context'
                rubric[criteria]:
                  type: object
                  additionalProperties: true
                  description: An indexed Hash of RubricCriteria objects where the keys are integer ids and the values are the RubricCriteria objects
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                id:
                  type: integer
                  format: int64
                  description: The id of the rubric
                rubric_association_id:
                  type: integer
                  format: int64
                  description: 'The id of the rubric association object (not the course/assignment itself, but the join table record id).

                    It can be used in place of +rubric_association[association_id]+ and +rubric_association[association_type]+ if desired.'
                rubric[title]:
                  type: string
                  description: The title of the rubric
                rubric[free_form_criterion_comments]:
                  type: boolean
                  description: Whether or not you can write custom comments in the ratings field for a rubric
                rubric_association[association_id]:
                  type: integer
                  format: int64
                  description: The id of the object with which this rubric is associated
                rubric_association[association_type]:
                  type: string
                  enum:
                  - Assignment
                  - Course
                  - Account
                  description: The type of object this rubric is associated with
                rubric_association[use_for_grading]:
                  type: boolean
                  description: Whether or not the associated rubric is used for grade calculation
                rubric_association[hide_score_total]:
                  type: boolean
                  description: 'Whether or not the score total is displayed within the rubric.

                    This option is only available if the rubric is not used for grading.'
                rubric_association[purpose]:
                  type: string
                  description: 'Whether or not the association is for grading (and thus linked to an assignment)

                    or if it''s to indicate the rubric should appear in its context'
                rubric[criteria]:
                  type: object
                  additionalProperties: true
                  description: An indexed Hash of RubricCriteria objects where the keys are integer ids and the values are the RubricCriteria objects
      responses:
        '200':
          description: Success, no content returned
      externalDocs:
        url: https://canvas.instructure.com/doc/api/rubrics.html
    get:
      tags:
      - Rubrics
      operationId: list_rubrics_courses
      summary: List rubrics
      description: Returns the paginated list of active rubrics for the current context.
      parameters:
      - name: course_id
        in: path
        schema:
          type: string
        required: true
        description: ID
      responses:
        '200':
          description: Success, no content returned
      externalDocs:
        url: https://canvas.instructure.com/doc/api/rubrics.html
  /v1/courses/{course_id}/rubrics/{id}:
    put:
      tags:
      - Rubrics
      operationId: update_single_rubric
      summary: Update a single rubric
      description: 'Returns the rubric with the given id.


        Unfortunately this endpoint does not return a standard Rubric object,

        instead it returns a hash that looks like

        { ''rubric'': Rubric, ''rubric_association'': RubricAssociation }


        This may eventually be deprecated in favor of a more standardized return

        value, but that is not currently planned.'
      parameters:
