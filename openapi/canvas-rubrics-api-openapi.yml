  /v1/rubrics/upload_template:
    get:
      tags:
      - Rubrics
      operationId: templated_file_for_importing_rubric
      summary: Templated file for importing a rubric
      description: Returns a CSV template file that can be used to import rubrics into Canvas.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: string
                x-canvas-declared-type: a CSV file in the format that can be imported
      externalDocs:
