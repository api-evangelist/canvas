      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                rubric_association_id:
                  type: integer
                  format: int64
                  description: 'The id of the rubric association object (not the course/assignment itself, but the join table record id).

                    It can be used in place of +rubric_association[association_id]+ and +rubric_association[association_type]+ if desired.'
                rubric[title]:
                  type: string
                  description: The title of the rubric
                rubric[free_form_criterion_comments]:
                  type: boolean
                  description: Whether or not you can write custom comments in the ratings field for a rubric
                rubric[skip_updating_points_possible]:
                  type: boolean
                  description: Whether or not to update the points possible
                rubric_association[association_id]:
                  type: integer
                  format: int64
                  description: The id of the object with which this rubric is associated
                rubric_association[association_type]:
                  type: string
                  enum:
                  - Assignment
                  - Course
                  - Account
                  description: The type of object this rubric is associated with
                rubric_association[use_for_grading]:
                  type: boolean
                  description: Whether or not the associated rubric is used for grade calculation
                rubric_association[hide_score_total]:
                  type: boolean
                  description: 'Whether or not the score total is displayed within the rubric.

                    This option is only available if the rubric is not used for grading.'
                rubric_association[purpose]:
                  type: string
                  enum:
                  - grading
                  - bookmark
                  description: 'Whether or not the association is for grading (and thus linked to an assignment)

                    or if it''s to indicate the rubric should appear in its context'
                rubric[criteria]:
                  type: object
                  additionalProperties: true
                  description: An indexed Hash of RubricCriteria objects where the keys are integer ids and the values are the RubricCriteria objects
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                rubric_association_id:
                  type: integer
                  format: int64
                  description: 'The id of the rubric association object (not the course/assignment itself, but the join table record id).

                    It can be used in place of +rubric_association[association_id]+ and +rubric_association[association_type]+ if desired.'
                rubric[title]:
                  type: string
                  description: The title of the rubric
                rubric[free_form_criterion_comments]:
                  type: boolean
                  description: Whether or not you can write custom comments in the ratings field for a rubric
                rubric[skip_updating_points_possible]:
                  type: boolean
                  description: Whether or not to update the points possible
                rubric_association[association_id]:
                  type: integer
                  format: int64
                  description: The id of the object with which this rubric is associated
                rubric_association[association_type]:
                  type: string
                  enum:
                  - Assignment
                  - Course
                  - Account
                  description: The type of object this rubric is associated with
                rubric_association[use_for_grading]:
                  type: boolean
                  description: Whether or not the associated rubric is used for grade calculation
                rubric_association[hide_score_total]:
                  type: boolean
                  description: 'Whether or not the score total is displayed within the rubric.

                    This option is only available if the rubric is not used for grading.'
                rubric_association[purpose]:
                  type: string
                  enum:
                  - grading
                  - bookmark
                  description: 'Whether or not the association is for grading (and thus linked to an assignment)

                    or if it''s to indicate the rubric should appear in its context'
                rubric[criteria]:
                  type: object
                  additionalProperties: true
                  description: An indexed Hash of RubricCriteria objects where the keys are integer ids and the values are the RubricCriteria objects
      responses:
        '200':
          description: Success, no content returned
      externalDocs:
        url: https://canvas.instructure.com/doc/api/rubrics.html
    delete:
      tags:
      - Rubrics
      operationId: delete_single
      summary: Delete a single
      description: Deletes a Rubric and removes all RubricAssociations.
      parameters:
      - name: course_id
        in: path
        schema:
          type: string
        required: true
        description: ID
      - name: id
        in: path
        schema:
          type: string
        required: true
        description: ID
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rubric'
      externalDocs:
        url: https://canvas.instructure.com/doc/api/rubrics.html
    get:
      tags:
      - Rubrics
      operationId: get_single_rubric_courses
      summary: Get a single rubric
      description: Returns the rubric with the given id.
      parameters:
      - name: course_id
        in: path
        schema:
          type: string
        required: true
        description: ID
      - name: id
        in: path
        schema:
          type: string
        required: true
        description: ID
      - name: include
        in: query
        schema:
          type: array
          items:
            type: string
            enum:
            - assessments
            - graded_assessments
            - peer_assessments
            - associations
            - assignment_associations
            - course_associations
            - account_associations
        required: false
        description: Related records to include in the response.
      - name: style
        in: query
        schema:
          type: string
          enum:
          - full
          - comments_only
        required: false
        description: Applicable only if assessments are being returned. If included, returns either all criteria data associated with the assessment, or just the comments. If not included, both data and comments are omitted.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rubric'
      externalDocs:
        url: https://canvas.instructure.com/doc/api/rubrics.html
