summary: Instructure publishes Instructure UI ("InstUI"), the accessible React design system Canvas itself is built
  from, plus two Canvas-specific components extracted out of the Canvas LMS repo. These are client-side UI libraries,
  not API SDKs — an LTI tool or a Canvas theme uses them to look and behave like Canvas.
