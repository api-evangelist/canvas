name: Canvas
description: Canvas is Instructure's open-source learning management system (LMS) used by K-12, higher education,
  and corporate training organizations to deliver courses, assessments, and learner communication. Canvas exposes
  a comprehensive REST API and a GraphQL endpoint for reading and modifying courses, assignments, quizzes, grades,
  users, enrollments, content, and account administration, and it integrates with external tools through LTI, Caliper,
  and live event streams.
