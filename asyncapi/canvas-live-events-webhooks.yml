name: Canvas Live Events (Canvas Data Services)
description: Canvas emits Live Events when something interesting happens — a page viewed, an assignment submitted,
  a course setting changed. Customers subscribe per event type and receive them on an AWS SQS queue or an HTTPS
  webhook. Instructure explicitly positions Live Events for analytics and data collection, NOT for anything needing
  up-to-the-second state — for that they direct you back to the REST API.
delivery:
  transports:
  - https-webhook
  - aws-sqs
  subscription: per event type, configured through Canvas Data Services
  setup_docs: https://developerdocs.instructure.com/services/canvas/data-services/live-events/overview/file.data_service_setup
  guarantees: Not real-time. Instructure states Live Events should not be used where data must be current.
