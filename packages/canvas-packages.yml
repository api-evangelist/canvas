source: registry.npmjs.org, pypi.org/pypi, rubygems.org/api/v1 (all queried unauthenticated 2026-09-05); plus https://developerdocs.instructure.com/services/dap
  and https://instructure.design/
summary:
  official_client_libraries: 3
  community_client_libraries: 3
  finding: Instructure publishes NO first-party client SDK for the Canvas LMS REST API itself. The three official
    packages below are (a) the Data Access Platform client for Canvas Data 2, (b) the Instructure-authored canvas_sync
    Rails gem, and (c) the Instructure UI component library. The most widely used Canvas REST client, ucfopen/canvasapi,
    is maintained by the University of Central Florida, not by Instructure.
