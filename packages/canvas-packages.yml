  registry: pypi
  name: instructure-dap-client
  url: https://pypi.org/project/instructure-dap-client/
  install: pip install instructure-dap-client
  official: true
  version: 2.3.0
  published: '2026-08-27'
  covers: Instructure Data Access Platform (Canvas Data 2) — query API client and the `dap` CLI
  docs: https://developerdocs.instructure.com/services/dap
- language: ruby
